<title>놀이동산 데이트 로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 위는 하루 전체 띠(턴별 시간, 장소, 긴장, 사건). 왼쪽은 실제 대화, 오른쪽은 읽고 있는 턴의 월드 모델. */
:root{
  --bg:#f3f5f1; --panel:#fbfcf9; --ink:#1b2a2a; --quiet:#5b6b69; --line:#d5dcd5;
  --teal:#0d6a68; --teal-soft:#d6ebe7; --amber:#a85a0c; --amber-soft:#f6e6cf; --rose:#ab2c4a; --rose-soft:#f7dde2;
  --p1:#cfe3dc; --p2:#f1dfc0; --p3:#dcd7ec; --p4:#f2d3d0; --p5:#cfdff0;
  --talk:"Gowun Batang","Noto Serif KR",serif; --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a1a; --panel:#1a2424; --ink:#e6eeea; --quiet:#9db0ac; --line:#2f3e3d;
  --teal:#62cdc2; --teal-soft:#16403d; --amber:#eeb066; --amber-soft:#463014; --rose:#f08ba2; --rose-soft:#4b1f2a;
  --p1:#22443c; --p2:#4a3a1c; --p3:#37315a; --p4:#4f2a2a; --p5:#233c58; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1a; --panel:#1a2424; --ink:#e6eeea; --quiet:#9db0ac; --line:#2f3e3d;
  --teal:#62cdc2; --teal-soft:#16403d; --amber:#eeb066; --amber-soft:#463014; --rose:#f08ba2; --rose-soft:#4b1f2a;
  --p1:#22443c; --p2:#4a3a1c; --p3:#37315a; --p4:#4f2a2a; --p5:#233c58; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-family:var(--talk);font-size:26px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:12px;letter-spacing:.05em;margin:0;color:var(--quiet);font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
button:hover{border-color:var(--teal)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--panel)}
.sum{color:var(--quiet);font-size:13px}
/* 하루 띠 */
.strip{overflow-x:auto;padding-bottom:4px}
.day{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(18px,1fr);grid-template-rows:42px 20px 8px 20px 16px;min-width:max-content;gap:0 1px}
.day .col{display:contents}
.bar{align-self:end;background:var(--quiet);opacity:.55;border-radius:2px 2px 0 0;margin-inline:2px}
.pl{font-size:11px;white-space:nowrap;overflow:hidden;padding-inline:4px;line-height:20px}
.tn{height:8px;margin-top:2px;background:transparent}
.tn.on{background:var(--rose)}
.tn.br{background:var(--amber)}
.mk{text-align:center;font-size:11px;line-height:20px;font-family:var(--mono)}
.no{border:0;background:none;padding:0;border-radius:0;font-family:var(--mono);font-size:10px;color:var(--quiet);line-height:16px;text-align:center}
.no.cur{color:var(--panel);background:var(--teal)}
.legend{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--quiet)}
.legend b{font-family:var(--mono);font-weight:500}
.legend i{display:inline-block;width:12px;height:6px;margin-right:5px;vertical-align:2px}
/* 본문 */
.main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}.world{order:-1;position:static!important;max-height:none!important}}
.chat{display:grid;gap:2px;min-width:0}
.t{display:grid;gap:5px;padding:9px 11px;border-radius:6px;border-left:3px solid transparent;cursor:pointer}
.t.on{background:var(--panel);border-left-color:var(--teal)}
.t small{font-family:var(--mono);font-size:11px;color:var(--quiet)}
.t .u{justify-self:end;max-width:82%;background:var(--teal-soft);border-radius:10px 10px 2px 10px;padding:5px 11px}
.t .c{font-family:var(--talk);font-size:15.5px;max-width:92%}
.t .c b{font-weight:700}
.ev{font-size:12.5px;display:flex;gap:7px;align-items:baseline;min-width:0}
.ev em{font-style:normal;font-size:11px;padding:0 7px;border-radius:9px;white-space:nowrap;background:var(--line)}
.ev.spark em{background:var(--amber-soft);color:var(--amber)}
.ev.rose em{background:var(--rose-soft);color:var(--rose)}
.ev.mint em{background:var(--teal-soft);color:var(--teal)}
.ev span{overflow-wrap:anywhere;color:var(--quiet)}
/* 월드 모델 */
.world{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);max-height:calc(100vh - 20px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
.sky{padding:14px 16px;color:#fff;display:grid;gap:2px;transition:background .3s;border-radius:9px 9px 0 0}
.sky .clock{font-family:var(--mono);font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.sky .place{font-size:15px;font-weight:500}
.sky .rel{font-size:12.5px;opacity:.9}
.body{padding:12px 16px 16px;display:grid;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:1px 9px;border-radius:10px;border:1px solid var(--line);white-space:nowrap}
.chip.on{background:var(--amber-soft);border-color:transparent;color:var(--amber)}
.chip.open{background:var(--rose-soft);border-color:transparent;color:var(--rose)}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border-radius:6px;overflow:hidden}
.ledger div{background:var(--panel);padding:5px 4px;text-align:center;font-size:11px;color:var(--quiet)}
.ledger b{display:block;font-family:var(--mono);font-size:16px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
pre{font-family:var(--mono);font-size:11.5px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0;background:var(--bg);border-radius:6px;padding:9px}
.block{display:grid;gap:5px}
.lk{display:grid;gap:1px;font-size:12.5px}
.lk small{color:var(--quiet)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:12.5px}
/* 아래 */
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
details summary{cursor:pointer;font-weight:500}
details>div{margin-top:10px;display:grid;gap:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:4px 10px 4px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--quiet)}
.scroll{overflow-x:auto}
.mono{font-family:var(--mono);white-space:nowrap}
</style>

ay": [], "details": {"seed": 12, "planted": 10, "paid": 1, "expired": 32}, "fired": ["ticket_queue_long", "hunger", "carousel_closing_announce", "phone_message_notice", "neighbor_quarrel", "gas_runs_low", "rain_starts", "evening_cold"], "revealed": ["transfer", "movies"], "spoken": []}}], "ledger": [{"id": "d1", "text": "정문 옆 간식 수레에서 설탕 솜사탕 냄새가 진하게 풍긴다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d2", "text": "입장 게이트 옆 기둥에 오래된 연인 낙서 스티커가 붙어 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d3", "text": "정문 앞 벤치에 교복 입은 학생들이 단체 사진을 찍고 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d4", "text": "하늘이 흐려져 저녁 바람이 조금씩 차가워지고 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d5", "text": "매표소 안내판에 야간 할인 시간이 17시 이후로 적혀 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d6", "text": "정문 쪽 가판대에서 캐릭터 풍선을 파는 아저씨가 큰 소리로 호객한다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d7", "text": "근처 영화관 간판이 놀이동산 입구 건너편에 보인다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d8", "text": "누군가 정문 근처에서 놀이기구 고장으로 한 시간 넘게 멈췄다는 소문이 돈다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d9", "text": "입구 옆 포토존 거울에 두 사람의 실루엣이 희미하게 비친다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d10", "text": "정문 근처 편의점 앞에서 아이스크림 냉동고 돌아가는 소리가 난다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d11", "text": "입장객들 손목에 채워지는 형광 팔찌 색이 날마다 바뀌는 중이다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d12", "text": "유저는 영화를 보면 자주 존다.", "status": "planted", "source": "character", "planted": {"turn": 1, "quote": "영화만 보면 너 또 졸잖아."}, "paid": null}, {"id": "d13", "text": "유저는 어릴 때 놀이동산을 좋아했다.", "status": "planted", "source": "character", "planted": {"turn": 2, "quote": "너 어릴 때 놀이동산 좋아했잖아, 예전에 그랬다며"}, "paid": null}, {"id": "d14", "text": "유저가 전에 놀이기구를 타다 운 적이 있고, 캐릭터가 그때 달래 준 적이 있다.", "status": "planted", "source": "character", "planted": {"turn": 3, "quote": "너 울지 마라, 나 저번처럼 안 달래줄 거야"}, "paid": null}, {"id": "d15", "text": "회전목마의 말 한 마리에 금박이 벗겨져 안쪽 나무가 드러나 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d16", "text": "매표소 옆 간판에 야간 할인 시간이 손글씨로 적혀 있는데 글씨가 번져 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d17", "text": "회전목마 가장자리 기둥마다 작은 전구가 달려 있고 그중 두 개는 깜빡인다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d18", "text": "바로 옆 벤치에 누군가 두고 간 종이컵 커피가 반쯤 식어 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d19", "text": "어린 아이가 아빠 손을 잡고 목마에 앉으려다 울음을 터뜨린다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d20", "text": "음악 상자 같은 오르골 음악이 스피커 잡음과 섞여 늘어지는 소리로 들린다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d21", "text": "회전목마 입구 쪽에서 솜사탕 기계가 돌아가며 달콤한 냄새가 퍼진다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d22", "text": "서쪽 하늘이 주황빛으로 물들고 있고 해가 건물 뒤로 넘어가려 한다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d23", "text": "관리 직원이 회전목마 바닥 틈에 떨어진 동전을 주워 주머니에 넣는다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d24", "text": "근처 카페 간판에 신메뉴 광고가 붙어 있는데 한 글자가 떨어져 나가 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d25", "text": "회전목마 주변 나무에 연인 이름이 새겨진 작은 팻말이 여러 개 걸려 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d26", "text": "저번에 영화 끝나고 유저의 눈이 빨개져서 둘이 카페에 갔었다.", "status": "planted", "source": "character", "planted": {"turn": 4, "quote": "저번에 영화 끝나고 너 눈 빨갛게 해서 카페 갔던 거"}, "paid": null}, {"id": "d27", "text": "유저는 배고프면 아무거나 먹는 편이다", "status": "planted", "source": "character", "planted": {"turn": 6, "quote": "너 배고프면 아무거나 먹잖아"}, "paid": null}, {"id": "d28", "text": "유저는 지난번 연락 문제 때문에 아직 서운해하고 있다.", "status": "paid", "source": "user", "planted": {"turn": 7, "quote": "가면서 지난번 연락 얘기도 좀 하고 싶어, 나 아직 좀 서운하거든."}, "paid": {"turn": 9, "how": "dialogue"}}, {"id": "d29", "text": "가게 벽에 붙은 메뉴판에는 핫도그 옆에 '소스 추가 무료'라고 손글씨가 적혀 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d30", "text": "계산대 옆 작은 화분의 흙이 말라서 잎끝이 누렇게 변해 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d31", "text": "가게 주인이 손님 한 명에게 단골 할인 쿠폰 도장을 찍어 준다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d32", "text": "길 건너 편의점 앞에서 학생 무리가 아이스크림을 나눠 먹으며 웃고 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d33", "text": "가게 안 라디오에서 오래된 발라드가 낮게 흘러나온다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d34", "text": "바닥 타일 한 장이 깨져 있고 그 위에 의자 다리가 살짝 걸쳐 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d35", "text": "누군가 가게 밖에 세워 둔 자전거 바구니에 우산 하나가 꽂혀 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d36", "text": "주방 쪽에서 기름 튀기는 소리가 탁탁 나고 고소한 냄새가 가게 안에 퍼진다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d37", "text": "창가 자리에 놓인 물컵에 누군가 먹다 남긴 얼음이 거의 녹아 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d38", "text": "인근 골목에서 어떤 커플이 헤어졌다는 소문이 가게 사람들 사이에서 조용히 돌고 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d39", "text": "캐릭터는 휴대폰 알림을 보고 표정이 굳었고, 연락 문제와 관련해 할 말이 있다고 함.", "status": "planted", "source": "character", "planted": {"turn": 8, "quote": "연락 안 된다고 저러는 거, 나는 좀... 듣기 싫더라."}, "paid": null}, {"id": "d40", "text": "캐릭터는 요즘 회사에서 이상한 얘기가 나와 머리가 복잡하다.", "status": "planted", "source": "character", "planted": {"turn": 10, "quote": "요즘 회사에서 이상한 얘기가 나와서 머리가 복 46", "text": "광장 바닥 타일 한 장이 깨져 있어 사람들이 돌아서 걷고 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d47", "text": "옆 매점에서 팝콘 대신 호떡을 팔고 있는데 줄이 짧다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d48", "text": "하늘에 비행기 한 대가 낮게 지나가며 굉음이 한동안 남는다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d49", "text": "관광 지도 한 장이 바람에 날려 화단 가장자리에 걸려 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d50", "text": "상대가 좋아하는 색은 이번 불꽃의 색이다.", "status": "planted", "source": "character", "planted": {"turn": 19, "quote": "너 좋아하는 색이잖아"}, "paid": null}, {"id": "d51", "text": "캐릭터가 다음 주말 데이트를 제안했고, 영화는 캐릭터가 고른다.", "status": "planted", "source": "character", "planted": {"turn": 20, "quote": "다음 주말에도 시간 비워놔. 영화는 내가 고를 거니까"}, "paid": null}, {"id": "d52", "text": "벽에 붙은 낡은 메뉴판에는 '계란 추가 500원'이라는 손글씨가 테이프로 덧대어 있다.", "status": "planted", "source": "plan", "planted": {"turn": 21, "quote": "계란 추가 500원… 저거 아직도 붙어 있네."}, "paid": null}, {"id": "d53", "text": "창가 쪽 김 서린 유리에 누군가 손가락으로 쓴 낙서가 희미하게 남아 있다.", "status": "planted", "source": "plan", "planted": {"turn": 24, "quote": "아, 저거 누가 쓴 거야. 지저분하게."}, "paid": null}, {"id": "d54", "text": "테이블마다 놓인 냉수병 뚜껑이 하나씩 달라서 짝이 맞지 않는다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d55", "text": "카운터 위 작은 라디오에서 오래된 트로트가 낮게 흘러나온다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d56", "text": "주방 쪽에서 튀김 기름이 파지직 튀는 소리가 간헐적으로 들린다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d57", "text": "벽걸이 텔레비전은 야구 중계 채널에 고정되어 있고 음소거 상태다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d58", "text": "계산대 옆 유리병에 일회용 젓가락이 가득 꽂혀 있고 몇 개는 포장지가 반쯤 벗겨져 있다.", "status": "expired", "source": "plan", "planted": null, "paid": null}, {"id": "d59", "text": "입구 옆 액자 속 사진에는 가게 주인과 단골처럼 보이는 여러 사람이 웃고 있다.", "status": "expired", "source": " ": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d41", "text": "정문 밖 카페 간판 불이 꺼져 있고 '오늘 22시 영업 종료' 종이가 문에 붙어 있다.", "status": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d42", "text": "포장마차 앞 나무 의자 아래에 롤러코스터 입장 팔찌 하나가 떨어져 있다.", "status": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d43", "text": "정문 경비원이 손전등을 들고 나가는 사람들의 수를 세고 있다.", "status": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d44", "text": "포장마차 앞 비닐봉지 안에 솜사탕 하나가 담겨 한쪽에 놓여 있다.", "status": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d45", "text": "가로등 하나가 깜빡이다 꺼졌다 다시 켜지기를 반복한다.", "status": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d46", "text": "옆 테이블 위에 누군가 두고 간 종이컵 세 개가 바람에 굴러다니고 있다.", "status": "seed", "source": "plan", "planted": null, "paid": null}, {"id": "d47", "text": "순대는 캐릭터가 도와준 덕분에 시켰고 떡볶이 값은 유저가 내기로 했다.", "status": "planted", "source": "character", "planted": {"turn": 25, "quote": "순대는 나 간 덕분에 시킨 거니까 떡볶이 값은 너가 내라."}, "paid": null}, {"id": "d48", "text": "둘은 다음에 롤러코스터를 타러 오기로 약속했다.", "status": "planted", "source": "user", "planted": {"turn": 28, "quote": "다음에 꼭 타러 오자."}, "paid": null}, {"id": "d49", "text": "바람이 차서 캐릭터가 유저에게 목도리를 두르고 가라고 했고, 그 목도리는 유저의 것이다.", "status": "planted", "source": "character", "planted": {"turn": 29, "quote": "내 목도리 아니고 네 거니까 괜히 빌려준다고 생각하지 마."}, "paid": null}], "closed": {"oneline": "연락 문제로 어색했던 첫 놀이동산 데이트에서, 길 잃은 아이를 도와주고 떡볶이 곱빼기를 나눠 먹으며 불꽃을 본 하루.", "relationship": "연락 문제로 남았던 앙금은 오늘 농담 속에서 조금 가라앉았고, 함께 아이를 돕고 떡볶이를 나눠 먹으며 거리가 한층 좁아졌다. 서로를 챙기는 마음이 더 자연스러워져 다음 데이트를 기약하는 사이가 되었다."}, "ended": true, "cost": 0.045714, "calls": 102, "judge": {"a_character": 4, "a_reason": "말은 툭툭 던지고 퉁명스러우면서도 챙겨주는 태도(T20 '목도리는 무슨, 너 추운 거 아냐?', T25 '머리끈은 내가 주워 줄게, 너 손 다 떨렸잖아', T29 '내 목도리 아니고 네 거니까 괜히 빌려준다고 생각하지 마')와 쑥스러워하는 반말투가 일관되게 잘 구현되었습니다.", "b_freshness": 3, "fresh_moments": [{"turn": 17, "quote": "야, 먹지 말라니까 누가 먹는다고. 얘, 이름 말해 봐. 엄마 찾으면 우리 아저씨 솜사탕도 하나 더 사 줄게.", function sky(text){
 const [h,m]=text.split(":").map(Number),v=h*60+m;
 let a=SKY[0],b=SKY[SKY.length-1];
 for(let i=0;i<SKY.length-1;i++)if(v>=SKY[i][0]&&v<=SKY[i+1][0]){a=SKY[i];b=SKY[i+1];break}
 const r=a===b?0:Math.min(1,Math.max(0,(v-a[0])/(b[0]-a[0])));
 return `rgb(${a[1].map((x,i)=>Math.round(x+(b[1][i]-x)*r)).join(",")})`;
}

   <div class="block"><h2>체크포인트</h2><div class="chips">
     ${Object.entries(CP).map(([k,v])=>`<span class="chip${a.fired.includes(k)?" on":""}">${a.fired.includes(k)?"●":"○"} ${v}</span>`).join("")}
     ${a.fired.filter(k=>!(k in CP)).map(k=>`<span class="chip on">● ${esc(k)}</span>`).join("")}</div></div>
   <div class="block"><h2>히든</h2>${run.hidden.map(h=>{const open=a.revealed.includes(h.id),told=a.spoken.includes(h.id);return `<div class="lk"><span><span class="chip${open?" open":""}">${told?"말함":open?"열림":"잠김"}</span> ${esc(h.id)}</span><small>${esc(open?h.fact:"평소: "+h.cover)}</small></div>`}).join("")}</div>
   <div class="block"><h2>떡밥 원장</h2><div class="ledger"><div><b>${d.seed}</b>대기</div><div><b>${d.planted}</b>살포</div><div><b>${d.paid}</b>회수</div><div><b>${d.expired}</b>소멸</div></div></div>
   <div class="block"><h2>관계 기억</h2><p style="font-size:12.5px">${esc(a.bond)}</p></div>
   ${a.today.length?`<div class="block"><h2>오늘의 에피소드</h2><ul>${a.today.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}
   <div class="block"><h2>이 턴에 캐릭터가 받은 순간</h2><pre>${esc(t.moment)}</pre></div>
  </div>`;
}
function renderLedger(){
 const order={paid:0,planted:1,seed:2,expired:3},name={paid:"회수",planted:"살포",seed:"대기",expired:"소멸"};
 const rows=[...run.ledger].sort((a,b)=>order[a.status]-order[b.status]);
 $("ledger").innerHTML=`<table><thead><tr><th>상태</th><th>디테일</th><th>출처</th><th>살포</th><th>회수</th></tr></thead><tbody>${rows.map(d=>`<tr><td class="mono">${name[d.status]}</td><td>${esc(d.text)}</td><td class="mono">${esc(d.source)}</td><td class="mono">${d.planted?"T"+d.planted.turn:""}</td><td class="mono">${d.paid?"T"+d.paid.turn:""}</td></tr>`).join("")}</tbody></table>`;
}
function renderJudge(){
 const j=run.judge;$("judgeBox").hidden=!j;if(!j)return;
 const list=(rows,fn,none)=>rows.length?`<ul>${rows.map(fn).join("")}</ul>`:`<p class="sum">${none}</p>`;
 $("judge").innerHTML=`<p>${esc(j.summary)}</p><p class="sum">${esc(DATA.judges[run.attempt]?.model)} · ${esc(DATA.judges[run.attempt]?.prompt)} 채점. a ${j.a_character}/5, b ${j.b_freshness}/5 (참고용), c 붕괴 ${j.c_breaks.length}건, d 회수 ${j.d_payoffs.length}건</p>
  <h2>a. 캐릭터답게</h2><p>${esc(j.a_reason)}</p>
  <h2>b. 신선한 순간</h2>${list(j.fresh_moments,m=>`<li>T${m.turn} “${esc(m.quote)}”<br><span class="sum">${esc(m.why)}</span></li>`,"없음")}
  <h2>c. 붕괴</h2>${list(j.c_breaks,m=>`<li>T${m.turn} ${esc(m.type)} “${esc(m.quote)}”<br><span class="sum">${esc(m.why)}</span></li>`,"없음")}
  <h2>d. 떡밥 회수</h2>${list(j.d_payoffs,m=>`<li>T${m.planted_turn}→T${m.paid_turn} 자연스러움 ${esc(m.natural)}/5${m.in_log?"":" (로그 밖)"}: ${esc(m.what)}</li>`,"없음")}`;
}
function select(t,scroll){
 cur=t;
 for(const b of $("day").querySelectorAll("button"))b.classList.toggle("cur",+b.dataset.t===t);
 for(const a of $("chat").children)a.classList.toggle("on",+a.dataset.t===t);
 renderWorld();
 if(scroll)$("t"+t)?.scrollIntoView({block:"center"});
}
let observer;
function watch(){
 observer?.disconnect();
 if(!("IntersectionObserver" in window))return;
 observer=new IntersectionObserver(items=>{
  const seen=items.filter(i=>i.isIntersecting);
  if(seen.length){const n=+seen[0].target.dataset.t;if(n!==cur)select(n,false)}
 },{rootMargin:"-45% 0px -50% 0px"});
 for(const a of $("chat").children)observer.observe(a);
}
function render(){colors();renderTabs();renderSum();renderDay();renderChat();renderWorld();renderLedger();renderJudge();watch()}
render();
</script>
