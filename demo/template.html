<title>봄날 데이트 월드 모델</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 왼쪽은 관객이 보는 무대, 오른쪽은 놀이동산 조종실. 아래 눈금은 하루 전체의 턴. */
:root{
  --bg:#eef3ef; --board:#fbfdfb; --ink:#15302c; --quiet:#54706a; --line:#c9d8d2;
  --teal:#0b7f73; --teal-soft:#d4eee8; --gold:#b86e00; --gold-soft:#fbeccd; --rose:#c43a5e; --rose-soft:#fbdfe6; --ice:#2767b0; --ice-soft:#dbe9f8;
  --display:"Jua","IBM Plex Sans KR",sans-serif; --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1c1e; --board:#172a2c; --ink:#e4f2ee; --quiet:#9ab8b1; --line:#2d4a4a;
  --teal:#54d1c1; --teal-soft:#123f3c; --gold:#efb44f; --gold-soft:#433312; --rose:#f77f9f; --rose-soft:#4b1f2e; --ice:#7fb6f4; --ice-soft:#1c3652; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c1e; --board:#172a2c; --ink:#e4f2ee; --quiet:#9ab8b1; --line:#2d4a4a;
  --teal:#54d1c1; --teal-soft:#123f3c; --gold:#efb44f; --gold-soft:#433312; --rose:#f77f9f; --rose-soft:#4b1f2e; --ice:#7fb6f4; --ice-soft:#1c3652; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.55}
.wrap{max-width:1320px;margin:0 auto;padding-block:16px 28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:26px;margin:0;line-height:1.2}
.lede{margin:0;color:var(--quiet);max-width:62ch}
.runs{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;background:var(--board);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--teal)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--board)}
button:disabled{opacity:.4;cursor:default}
.main{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px;align-items:start}
.stage-col{display:grid;gap:10px;min-width:0}
.stagebox{position:relative;border-radius:8px;overflow:hidden;background:#9fd6ee;aspect-ratio:16/9;max-width:100%}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:10px;left:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
.hud b{font-family:var(--display);font-weight:400;font-size:24px;background:#15302ce6;color:#fff;padding:0 10px;border-radius:6px;font-variant-numeric:tabular-nums}
.hud span{background:#15302ce6;color:#fff;padding:2px 8px;border-radius:6px;font-size:12.5px}
.dialog{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:8px;min-height:128px}
.line{display:grid;grid-template-columns:48px minmax(0,1fr);gap:8px}
.arms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.arm{border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.arm.on{border-color:var(--teal);background:var(--teal-soft)}
.arm small{display:block;font-size:11.5px;color:var(--quiet);margin-bottom:2px}
.arm.on small{color:inherit;font-weight:600}
.arm p{margin:0}
.verdict{margin:0;font-size:12.5px;color:var(--quiet);display:flex;flex-wrap:wrap;gap:2px 12px}
.verdict strong{color:var(--ink);font-weight:600}
.verdict b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.compare{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px;min-width:0}
.compare p{margin:0;color:var(--quiet);max-width:78ch}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--quiet);font-size:12px}
td.n,th.n{text-align:right;font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.cards{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:8px;min-width:0}
.card header{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;justify-content:flex-start}
.card header button{font-family:var(--mono);font-size:12px;padding:0 6px}
.card header strong{font-weight:600}
.card .said-user{margin:0;color:var(--quiet);font-size:13px}
.card .count-row{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12.5px;color:var(--quiet)}
.card .count-row b{font-family:var(--mono);font-weight:500;color:var(--ink)}
.card details{padding-top:6px}
.card ol{margin:6px 0 0;padding-left:20px;font-size:12.5px;display:grid;gap:3px}
.card h3{font-size:12px;font-weight:600;margin:8px 0 0;color:var(--quiet)}
.who{font-family:var(--display);color:var(--quiet)}
.who.char{color:var(--teal)}
.said{margin:0}
.said.silent{color:var(--quiet);font-style:italic}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.controls .count{font-family:var(--mono);color:var(--quiet);margin-left:auto;font-size:12.5px}
.moments{display:flex;flex-wrap:wrap;gap:6px}
.moments button{font-size:12.5px;display:flex;gap:6px;align-items:baseline}
.moments time{font-family:var(--mono);color:var(--quiet);font-size:11.5px}
.moments button[aria-pressed="true"] time{color:inherit}
.timeline{display:flex;gap:2px;align-items:stretch;height:30px;overflow-x:auto}
.tick{flex:1 1 0;min-width:9px;border:0;border-radius:2px;padding:0;background:var(--line);position:relative}
.tick.on{outline:2px solid var(--ink);outline-offset:1px}
.tick[data-s="만남"]{background:#e7a8bb}.tick[data-s="놀이동산"]{background:#7ec9b4}.tick[data-s="식당"]{background:#e9b868}.tick[data-s="산책"]{background:#8d9fd9}.tick[data-s="불꽃놀이"]{background:#3f3a78}.tick[data-s="귀가"]{background:#7b6a93}
.tick.key::after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;margin:-3.5px;background:#fff;border:1.5px solid #15302c;border-radius:50%}
.panel{background:var(--board);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:14px;min-width:0}
h2{font-family:var(--display);font-weight:400;font-size:16px;margin:0 0 6px}
.gauges{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gauge{border:1px solid var(--line);border-radius:6px;padding:5px 8px;min-width:0}
.gauge small{display:block;color:var(--quiet);font-size:11.5px}
.gauge strong{font-weight:600}
.gauge.changed{border-color:var(--gold);background:var(--gold-soft)}
.gauge.alert{border-color:var(--ice);background:var(--ice-soft)}
.chain{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.chain li{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;padding:5px 8px;border-radius:6px;background:var(--bg);animation:rise .3s both}
.chain li.hot{background:var(--teal-soft)}
.chain li.warn{background:var(--gold-soft)}
.chain li.quiet{color:var(--quiet);background:transparent;padding-block:2px}
.chain .lab{font-size:11.5px;color:var(--quiet);padding-top:2px}
.chain li.hot .lab,.chain li.warn .lab{color:inherit}
@keyframes rise{from{opacity:.25;transform:translateY(3px)}to{opacity:1;transform:none}}
.mem{display:grid;gap:5px}
.fact{border:1px dashed var(--line);border-radius:6px;padding:6px 8px}
.fact.live{border:1.5px solid var(--rose);background:var(--rose-soft)}
.fact .state{font-size:11.5px;color:var(--quiet)}
.fact.live .state{color:var(--rose);font-weight:600}
.fact button{font-size:11.5px;padding:0 6px;margin-left:6px}
.eps{margin:0;padding:0;list-style:none;display:grid;gap:3px;font-size:12.5px}
.eps li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:6px}
.eps time{font-family:var(--mono);color:var(--quiet);font-size:11.5px;padding-top:1px}
.empty{color:var(--quiet);font-size:12.5px;margin:0}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;color:var(--quiet);font-size:12.5px}
pre{font-family:var(--mono);font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 0;background:var(--bg);padding:8px;border-radius:6px}
footer{color:var(--quiet);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 16px}
footer strong{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.conds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.conds.split{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.group{display:grid;gap:4px;align-content:start;min-width:0}
.group>span{font-family:var(--display);font-size:14px}
.group>.arm{height:100%}
.group .arms{align-items:stretch}
@media (max-width:560px){.arms,.conds,.conds.split{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}.gauges{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){.chain li{animation:none}}
</style>
<div class="wrap">
  <header>
    <div>
      <h1>봄날 놀이동산, 월드 모델이 흘려보내는 하루</h1>
      <p class="lede">판정과 사실은 코드가 정하고 LLM은 서술만 합니다. 턴을 넘기며 왼쪽 대화의 원인을 오른쪽 조종실에서 확인하세요. 같은 턴을 지시 없이, 월드 모델 없이 돌린 응답도 나란히 보여 줍니다.</p>
    </div>
    <div class="runs" id="runs" role="group" aria-label="실행 기록 선택"></div>
  </header>
  <div class="main">
    <div class="stage-col">
      <div class="stagebox"><canvas id="stage" width="1280" height="720" aria-label="놀이동산 2D 장면"></canvas><div class="hud"><b id="hudClock"></b><span id="hudScene"></span><span id="hudTemp"></span></div></div>
      <div class="dialog" aria-live="polite" id="dialog"></div>
      <div class="controls">
        <button id="prev" title="왼쪽 화살표">이전 턴</button>
        <button id="next" title="오른쪽 화살표">다음 턴</button>
        <button id="play" aria-pressed="false">자동 재생</button>
        <span class="count" id="count"></span>
      </div>
      <div class="timeline" id="timeline" role="group" aria-label="턴 눈금"></div>
      <div class="moments" id="moments" role="group" aria-label="핵심 장면으로 이동"></div>
    </div>
    <aside class="panel">
      <section><h2>월드 상태</h2><div class="gauges" id="gauges"></div></section>
      <section><h2>이번 턴이 만들어진 순서</h2><ol class="chain" id="chain"></ol></section>
      <section><h2>기억</h2><div class="mem" id="facts"></div></section>
      <section><h2>지난 에피소드</h2><ul class="eps" id="eps"></ul></section>
      <details><summary>이번 턴에 LLM이 받은 현재 상황 블록</summary><pre id="situation"></pre></details>
    </aside>
  </div>
  <section class="compare" aria-labelledby="cmpTitle">
    <div><h2 id="cmpTitle">월드 모델과 지시가 바꾸는 행동</h2><p id="cmpNote"></p></div>
    <div class="scroll"><table id="cmpTable"></table></div>
    <h2 id="cmpRun"></h2>
    <div class="cards" id="cmpCards"></div>
  </section>
  <footer id="foot"></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DIRECTIVE_LABEL = {open_greeting:"먼저 인사하며 옷 이야기", suggest_meal:"먼저 점심 제안", sauce_notice:"\"가만 있어 봐\"까지만", sauce_resolve:"반응을 보고 닦아 주기", offer_coat:"기억을 꺼내 겉옷 건네기", afternoon_passed:"오후가 지났다는 전제", fireworks_fire:"불꽃이 터지는 순간", ask_farewell:"집에 갈지 더 놀지 묻기"};
const VALUE_LABEL = {pending:"대기",deferred:"미루는 중",fired:"터짐",none:"캐릭터가 입음",offered:"건네는 중",given:"유저가 입음",declined:"거절함"};
const EVENT_LABEL = {meal_agreed:"유저가 식사에 동의",meal_declined:"유저가 식사를 미룸",sauce_wiped:"입가를 닦아 줌",sauce_declined:"유저가 직접 닦기로 함",coat_given:"겉옷을 건넴",coat_declined:"유저가 겉옷을 거절",home_chosen:"유저가 귀가를 고름",stay_chosen:"유저가 더 놀기를 고름"};
const ACTION_LABEL = {short_talk:"짧은 대화", ride_or_sight:"놀이기구·구경", move:"이동", meal:"식사"};
const MOMENTS = [
  {match:t=>t.stored.length>0, time:t=>t.clock, label:"사실 저장, 반응 없음"},
  {match:t=>t.directive==="suggest_meal", time:t=>t.clock, label:"캐릭터가 먼저 식사 제안"},
  {match:t=>t.directive==="sauce_notice", time:t=>t.clock, label:"입가 소스, 유저 몫 남기기"},
  {match:t=>t.directive==="offer_coat", time:t=>t.clock, label:"아침 기억이 돌아온다"},
  {match:t=>t.drama&&t.drama.action==="defer", time:t=>t.clock, label:"불꽃 미루기"},
  {match:t=>t.directive==="fireworks_fire", time:t=>t.clock, label:"불꽃 터짐"},
  {match:t=>t.directive==="ask_farewell", time:t=>t.clock, label:"귀가 갈림길"},
];
let runName = DATA.order[0], index = 0, timer = null;
const run = () => DATA.runs[runName];
const turn = () => run().turns[index];
function minutes(text){const [h,m]=text.split(":").map(Number);return h*60+m}

/* ── 조종실 렌더링: 로그에 있는 값만 보여 준다 ─────────────── */
function render(){
  const r = run(), t = turn();
  $("hudClock").textContent = t.clock;
  $("hudScene").textContent = t.scene;
  $("hudTemp").textContent = "기온 " + t.world.temperature;
  const said = t.user ? `<p class="said">${esc(t.user)}</p>` : `<p class="said silent">${t.idle ? "아무 말 없이 곁에 있다" : "아직 말하기 전"}</p>`;
  const counts = p => `지시 없음 <b>${p.state_yes}/${DATA.state.samples}</b> · 지시 있음 <b>${p.world_yes}/${DATA.compare.samples}</b> · 월드 모델 없음 <b>${p.baseline_yes}/${DATA.compare.samples}</b>`;
  const verdict = t.points.length ? `<p class="verdict">${t.points.map(p=>`<span><strong>${esc(p.label)}</strong> ${counts(p)}</span>`).join("")}</p>` : "";

  $("dialog").innerHTML = `<div class="line"><span class="who">나</span>${said}</div>${conds(t,r.persona.name)}${verdict}`;
  $("count").textContent = `T${t.turn} / ${r.turns.length}`;
  $("prev").disabled = index === 0; $("next").disabled = index === r.turns.length - 1;
  document.querySelectorAll(".tick").forEach((el,i)=>el.classList.toggle("on", i===index));
  document.querySelectorAll("#moments button").forEach(b=>b.setAttribute("aria-pressed", String(Number(b.dataset.i)===index)));

  const changed = new Set(t.changes.map(c=>c.field));
  const g = (label,val,field,alert) => `<div class="gauge ${alert?"alert":changed.has(field)?"changed":""}"><small>${label}</small><strong>${esc(val)}</strong></div>`;
  const coat = {none:"캐릭터가 입음",offered:"건네는 중",given:"유저가 입음",declined:"거절함"}[t.world.coat];
  const fire = {pending:"대기",deferred:"미루는 중",fired:"터짐"}[t.world.fireworks];
  $("gauges").innerHTML = g("게임 시각",t.clock,"clock")+g("장면",t.scene,"scene")+g("기온",t.world.temperature,"temperature")
    +g("유저 체감",t.world.felt,"felt",t.world.felt==="추움")+g("캐릭터 배고픔",t.world.hunger,"hunger")+g("겉옷",coat,"coat")+g("불꽃놀이",fire,"fireworks");

  const rows = [];
  const changeText = t.changes.filter(c=>c.field!=="clock"||c.to>c.from+60).map(c=>c.field==="clock"?`시각 건너뜀 → ${Math.floor(c.to/60)}:${String(c.to%60).padStart(2,"0")}`:`${fieldName(c.field)}: ${VALUE_LABEL[c.from]||c.from} → ${VALUE_LABEL[c.to]||c.to}`);
  if (changeText.length) rows.push(["warn","① 판정",esc(changeText.join(" · "))]);
  else rows.push(["quiet","① 판정","바뀐 상태 없음"]);
  if (t.episode_closed) rows.push(["warn","장면 전환",`에피소드 닫음, 프롬프트의 대화 기록을 잘라냄. 요약: ${esc(t.episode_closed.summary)}`]);
  if (t.drama) { const j=t.drama.judgement; const yes=[j.emotional&&"감정",j.relationship&&"관계·고백",j.tension&&"긴장",j.peak&&"정점"].filter(Boolean).join(", ")||"해당 없음";
    rows.push([t.drama.action==="fire"?"hot":"warn","② drama",`${esc(t.drama.reason)} <span style="color:var(--quiet)">(판정: ${yes})</span>`]); }
  if(!t.drama) rows.push(["quiet","② drama",t.world.fireworks==="fired"?"불꽃놀이는 이미 터졌음":"예정 시각 20:00 전이라 판단하지 않음"]);
  rows.push(t.recalled.length?["hot","③ 기억 검색",esc(t.recalled.filter(i=>i.kind==="fact").map(i=>i.text).join(" ")||`오늘 에피소드 요약 ${t.recalled.length}개를 꺼냄`)]:["quiet","③ 기억 검색","판정이 요청하지 않아 꺼내지 않음"]);
  rows.push(t.directive?["hot","④ 지시",`지시 있음 조건에만 전달: ${esc(DIRECTIVE_LABEL[t.directive])}`]:["quiet","④ 지시","없음. LLM은 평소처럼 대화"]);
  rows.push(["","⑤ LLM",`현재 상황 블록을 받아 대사만 썼음 (${esc(r.persona.name)}의 말투)`]);
  const a=t.analysis||{}; const stored=t.stored.map(s=>`사실 저장: 옷 보온성=${s.value} ("${s.quote}")`);
  const ev=(a.events||[]).map(x=>EVENT_LABEL[x]||x).join(", ");
  rows.push(stored.length?["hot","⑥ 턴 마감",esc(stored.join(" "))+` · ${ACTION_LABEL[a.action_type]||""} +${t.minutes||0}분`]:["","⑥ 턴 마감",`${ACTION_LABEL[a.action_type]||"오프닝"} +${t.minutes||0}분${ev?` · 사건: ${esc(ev)}`:""}`]);
  $("chain").innerHTML = rows.map(([c,l,x],i)=>`<li class="${c}" style="animation-delay:${i*60}ms"><span class="lab">${l}</span><span>${x}</span></li>`).join("");

  const known = t.facts_before.concat(t.stored);
  const live = t.recalled.some(i=>i.kind==="fact");
