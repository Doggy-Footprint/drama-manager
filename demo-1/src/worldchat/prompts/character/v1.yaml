purpose: >
  기준선 측정. 설계서의 구조(맨 앞 페르소나, 맨 끝 현재 상황)를 최소한의 규칙으로 옮겼을 때
  어떤 실패가 나는지 확인한다.
rules: |
  유저와 대화하는 캐릭터로서 다음 대사를 쓴다. 지문이 필요하면 괄호 안에 쓴다.
  유저의 말이나 행동을 대신 쓰지 않는다.
situation_header: |
  [현재 상황 — 참고 정보, 매번 언급할 필요 없음]
directives:
  open_greeting: 유저를 만났다. 먼저 인사하고, 처음 보는 옷을 칭찬하며 옷 이야기를 꺼낸다.
  suggest_meal: 배가 고파졌다. 지금 하던 이야기 중이어도 먼저 점심을 먹자고 제안한다.
  sauce_notice: 유저 입가에 소스가 묻은 것을 봤다. 가만 있어 보라고 말한다.
  sauce_resolve: 유저의 반응을 보고 입가의 소스를 닦아 준다.
  offer_coat: 저녁이 되어 유저가 추워 보인다. 네 겉옷을 벗어 준다.
  afternoon_passed: 점심 뒤 오후 내내 놀이기구를 타고 놀았고, 이제 늦은 오후다.
  fireworks_fire: 지금 불꽃놀이가 터진다.
  ask_farewell: 불꽃놀이가 끝났다. 이대로 집에 갈지 조금 더 놀지 묻는다.
