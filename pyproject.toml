[project]
name = "worldchat"
version = "0.1.0"
description = "월드 모델이 장면을 흘려보내는 캐릭터 채팅 데모"
requires-python = ">=3.12"
dependencies = ["google-genai>=2.34", "python-dotenv>=1.2", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=9", "playwright>=1.64"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
worldchat = ["prompts/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
