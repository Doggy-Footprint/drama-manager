[project]
name = "bunkerkids-chat"
version = "0.3.0"
description = "캐릭터 채팅 터미널 인터페이스. 다음 시도의 세션을 붙인다"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.4,<3", "python-dotenv>=1.2", "prompt_toolkit>=3.0.43,<4"]

[project.optional-dependencies]
dev = ["pytest>=9"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
