  }

  // ------------------------------------------------ 대화
  function runSwitch(r) {
    const dims = [["turns", "턴", Array.from(new Set(RUNS.map((x) => x.turns))).sort((a, b) => a - b).map((x) => [x, x + "턴"])],
      ["kind", "종류", [["engine", "엔진"], ["baseline", "기준선"]]],
      ["persona", "채원", Object.keys(P).map((x) => [x, x])]];
    if (GROUPS.length > 1) dims.unshift(["group", "묶음", GROUPS.map((g) => [g, g])]);
    return `<div class="filters">${dims.map(([key, label, opts]) => `<span class="seg-g"><span class="seg-l">${label}</span><span class="seg" role="group" aria-label="${label}">${opts.map(([val, txt]) => {
      const want = Object.assign({ group: r.group, turns: r.turns, kind: r.kind, persona: r.persona }, { [key]: val });
      const exact = RUNS.find((x) => x.group === want.group && String(x.turns) === String(want.turns) && x.kind === want.kind && x.persona === want.persona);
      return `<button type="button" data-sw="${key}" data-v="${esc(val)}" aria-pressed="${String(r[key]) === String(val)}" class="${exact ? "" : "miss"}" title="${exact ? esc(exact.label) : "이 조합의 판이 없어 가장 가까운 판으로 간다"}">${esc(txt)}</button>`;
    }).join("")}</span></span>`).join("")}</div>`;
  }
  function bestRun(want) {
    let best = null, score = -1;
    RUNS.forEach((x) => {
      const sc = (x.group === want.group ? 1 : 0) + (String(x.turns) === String(want.turns) ? 2 : 0) + (x.kind === want.kind ? 4 : 0) + (x.persona === want.persona ? 2 : 0) + (String(x[want.key]) === String(want[want.key]) ? 10 : 0);
      if (sc > score) { score = sc; best = x; }
    });
    return best;
  }
  function renderRun() {
    const r = BY[state.runId]; const v = $("#v-run");
    if (!r) { v.innerHTML = "<p>판을 찾지 못했다.</p>"; return; }
    const pr = pairOf(r);
    const marks = marksFor(r.id);
    const head = `<div class="run-head">
      ${runSwitch(r)}
      <h2><span class="kind ${r.kind}" style="font-family:var(--font-body)">${r.kind === "engine" ? "엔진" : "기준선"}</span>${esc(r.label)}<small>${r.turns}턴 시험 · ${r.n}턴 기록${r.clock0 ? ` · ${esc(r.clock0)}–${esc(r.clock1)}` : ""} · ${esc(r.group)}</small></h2>
      <p><b>채원 ${esc(personaLabel(r))}</b> · ${esc((P[r.persona] || {}).desc || "")}</p>
      <p>${esc(r.summary)}</p>
      ${ribbon(r, true, new Set(marks.keys()))}
      ${relStrip(r)}
      ${r.kind === "engine" ? legend() : ""}
      ${r.system ? `<details class="sys"><summary>기준선 시스템 프롬프트 보기 (${r.system.length.toLocaleString()}자)</summary><pre>${esc(r.system)}</pre></details>` : ""}
      <div class="run-tools">${pr ? `<a class="btn" href="#pair-${r.kind === "engine" ? r.id : pr.id}">${r.kind === "engine" ? "기준선과" : "엔진과"} 나란히 보기</a>` : ""}
        ${r.kind === "engine" ? `<button type="button" class="btn" id="open-all" aria-pressed="false">원문 모두 펼치기</button>` : ""}
        <span class="mono" style="color:var(--muted);font-size:12px">${esc(r.file)}</span></div>
    </div><div class="follow" hidden></div>`;
    const rows = r.rows.map((t) => (r.kind === "engine" ? engineTurn(r, t, marks.get(t.n)) : baseTurn(r, t, marks.get(t.n)))).join("");
    v.innerHTML = head + `<div class="turns">${rows}</div>`;
    v.dataset.built = "1"; state.builtHl = state.hl;
    $$("[data-sw]", v).forEach((b) => b.addEventListener("click", () => {
      const want = { group: r.group, turns: r.turns, kind: r.kind, persona: r.persona, key: b.dataset.sw };
      want[b.dataset.sw] = b.dataset.sw === "turns" ? +b.dataset.v : b.dataset.v;
      const x = bestRun(want); if (x) location.hash = "#" + x.id;
    }));
    const oa = $("#open-all", v);
    if (oa) oa.addEventListener("click", () => {
      const on = oa.getAttribute("aria-pressed") !== "true";
      oa.setAttribute("aria-pressed", String(on)); oa.textContent = on ? "원문 모두 접기" : "원문 모두 펼치기";
      $$(".turn", v).forEach((el) => {
        const raw = $(".raw", el); if (!raw) return;
        const t = r.rows.find((x) => x.n === +el.dataset.n);
        if (!raw.dataset.filled) { raw.innerHTML = rawHTML(t); raw.dataset.filled = "1"; }
        raw.hidden = !on; const tg = $(".chip.more", el); tg.setAttribute("aria-expanded", String(on)); tg.textContent = on ? "원문 닫기" : "판단 원문";
      });
    });
  }
  function marksFor(runId) {
    const m = new Map();
    if (state.hl != null && HL[state.hl]) HL[state.hl].steps.forEach((s) => { if (s.run === runId) m.set(s.n, s.cap); });
    return m;
  }
  function updateFollow() {
    const box = $("#v-run .follow"); if (!box) return;
    const h = state.hl != null ? HL[state.hl] : null;
    if (!h || !h.steps.some((s) => s.run === state.runId)) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<b>${esc(h.title)}</b><div class="steps">${stepsHTML(h, state.hl, state.runId, state.n)}</div><button type="button" class="x">따라가기 끄기</button>`;
    $(".x", box).addEventListener("click", () => { state.hl = null; box.hidden = true; renderRun(); updateFollow(); });
  }

  // ------------------------------------------------ 나란히
  function renderPair() {
    const v = $("#v-pair");
    const e = BY[state.pairId] || PAIRS[0];
    if (!e) { v.innerHTML = "<p>짝이 되는 엔진·기준선 판이 없다.</p>"; return; }
    const b = pairOf(e);
    const tab = store.get("ot-pair-tab", "eng");
    const opts = PAIRS.map((x) => `<button type="button" data-pair="${x.id}" aria-pressed="${x.id === e.id}">${x.turns}턴 ${x.persona}${GROUPS.length > 1 ? " · " + esc(x.group) : ""}</button>`).join("");
    const head = `<div class="pair-head">
      <div class="filters"><span class="seg-g"><span class="seg-l">짝</span><span class="seg" role="group" aria-label="짝 고르기">${opts}</span></span></div>
      <h2>${esc(e.label)} ↔ ${esc(b.label)}</h2>
      <p style="margin:0;color:var(--ink-2)">채원 ${esc(personaLabel(e))} · 같은 페르소나 지시로 돌렸지만 유저 대사는 판마다 다르다(시뮬레이션 유저가 앞 응답에 반응한다). 턴 번호로만 맞춘다.</p>
      <div class="pair-tabs seg" role="group" aria-label="열 고르기"><button type="button" data-tab="eng" aria-pressed="${tab === "eng"}">엔진</button><button type="button" data-tab="base" aria-pressed="${tab === "base"}">기준선</button></div>
    </div>
    <div class="pair-cols"><div><span class="kind engine">엔진</span>${esc(e.label)} · ${e.n}턴</div><div><span class="kind baseline">기준선</span>${esc(b.label)} · ${b.n}턴</div></div>`;
    const N = Math.max(e.n, b.n);
    const eBy = new Map(e.rows.map((t) => [t.n, t])); const bBy = new Map(b.rows.map((t) => [t.n, t]));
    const nums = Array.from(new Set(e.rows.map((t) => t.n).concat(b.rows.map((t) => t.n)))).sort((x, y) => x - y);
    const rows = nums.map((n) => {
      const et = eBy.get(n), bt = bBy.get(n);
      const ec = et ? `<div class="pcell eng" data-run="${e.id}" data-n="${n}"><div class="ph"><span class="tn">T${pad(n)}</span><span class="clk">${esc(et.clock)}</span><span>${et.cl === et.ul ? esc(et.cl) : "도하 " + esc(et.cl) + " / 채원 " + esc(et.ul)}</span></div>${dialog(et, "engine")}<div class="chips">${chipsHTML(et)}</div><div class="raw" hidden></div></div>`
        : `<div class="pcell eng none">이 턴 없음</div>`;
      const bc = bt ? `<div class="pcell base"><div class="ph"><span class="tn">T${pad(n)}</span><span>기준선</span></div>${dialog(bt, "baseline")}</div>` : `<div class="pcell base none">이 턴 없음</div>`;
      return `<div class="prow" data-n="${n}" id="p-${n}">${ec}${bc}</div>`;
    }).join("");
    v.innerHTML = head + `<div class="pair show-${tab}">${rows}</div>`;
    v.dataset.built = "1";
    $$("[data-pair]", v).forEach((x) => x.addEventListener("click", () => { location.hash = "#pair-" + x.dataset.pair; }));
    $$("[data-tab]", v).forEach((x) => x.addEventListener("click", () => {
      store.set("ot-pair-tab", x.dataset.tab);
      const p = $(".pair", v); p.classList.remove("show-eng", "show-base"); p.classList.add("show-" + x.dataset.tab);
      $$("[data-tab]", v).forEach((y) => y.setAttribute("aria-pressed", String(y === x)));
    }));
    void N;
  }

  // ------------------------------------------------ 요약
  const isScalar = (x) => x == null || ["string", "number", "boolean"].includes(typeof x);
  function cell(x) {
    if (x == null) return `<td>—</td>`;
    if (typeof x === "number") return `<td class="n">${Number.isInteger(x) ? x.toLocaleString() : x.toFixed(2)}</td>`;
    if (typeof x === "boolean") return `<td>${x ? "예" : "아니오"}</td>`;
    if (typeof x === "object") return `<td>${esc(JSON.stringify(x))}</td>`;
    return `<td>${esc(x)}</td>`;
  }
  function tableOf(objs) {
    const cols = []; objs.forEach((o) => Object.keys(o).forEach((k) => { if (!cols.includes(k)) cols.push(k); }));
    return `<div class="tbl-wrap"><table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${objs.map((o) => `<tr>${cols.map((c) => cell(o[c])).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function tableCols(cols, rows) {
    return `<div class="tbl-wrap"><table><thead><tr>${cols.map((c) => `<th>${esc(typeof c === "object" ? (c.label || c.key) : c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) =>
      `<tr>${cols.map((c, i) => cell(Array.isArray(r) ? r[i] : r[typeof c === "object" ? c.key : c])).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function renderAny(v, depth) {
    depth = depth || 0;
    if (Array.isArray(v)) {
      if (v.length && v.every((x) => x && typeof x === "object" && !Array.isArray(x))) return tableOf(v);
      if (v.length && v.every(Array.isArray)) return tableCols(v[0], v.slice(1));
      return `<ul>${v.map((x) => `<li>${renderAny(x, depth + 1)}</li>`).join("")}</ul>`;
    }
    if (v && typeof v === "object") {
      if (Array.isArray(v.columns) && Array.isArray(v.rows)) {
        return (v.title ? `<h3>${esc(v.title)}</h3>` : "") + tableCols(v.columns, v.rows) + (v.note ? `<p style="color:var(--muted);font-size:13px">${esc(v.note)}</p>` : "");
      }
      const vals = Object.values(v);
      if (vals.length > 1 && vals.every((x) => x && typeof x === "object" && !Array.isArray(x) && Object.values(x).every(isScalar))) {
        return tableOf(Object.entries(v).map(([k, x]) => Object.assign({ "": k }, x)));
      }
      const sc = Object.entries(v).filter(([, x]) => isScalar(x));
      const nested = Object.entries(v).filter(([, x]) => !isScalar(x));
      return (sc.length ? `<dl class="kv">${sc.map(([k, x]) => `<dt>${esc(k)}</dt><dd>${esc(x == null ? "—" : x)}</dd>`).join("")}</dl>` : "")
        + nested.map(([k, x]) => `<div><h3>${esc(k)}</h3>${renderAny(x, depth + 1)}</div>`).join("");
    }
    return esc(v);
  }
  // summary.json의 판 이름("엔진 50-a", "E16-b", "기준선 16턴")을 판 id로
  function runFromName(s) {
    s = String(s || "");
    let m = /(엔진|기준선)\s*(\d+)\s*[-턴]?\s*([abc])?/i.exec(s) || null;
    let kind, turns, persona;
    if (m) { kind = m[1] === "엔진" ? "engine" : "baseline"; turns = +m[2]; persona = m[3]; }
    else if ((m = /^([EB])(\d+)-([abc])$/i.exec(s))) { kind = m[1].toUpperCase() === "E" ? "engine" : "baseline"; turns = +m[2]; persona = m[3]; }
    else return null;
    turns = turns <= 20 ? 15 : 50;
    const group = /수정 후/.test(s) && GROUPS.includes("수정 후") ? "수정 후" : GROUPS[0];
    return RUNS.find((r) => r.kind === kind && r.turns === turns && (!persona || r.persona === persona.toUpperCase()) && r.group === group) || null;
  }
  const GROUP_NAMES = { 1: "시간", 2: "지난 만남 회수", 3: "비밀", 4: "관계", 5: "이벤트", 6: "코드 거절·가드레일", 7: "반복·버릇", 8: "호칭·말투", 9: "기타", 10: "비용·지연" };
  function metricTable(t) {
    const cols = t.columns || [];
    let last = null;
    const body = t.rows.map((r) => {
      const mm = /^(\d+)\s+(.*)$/.exec(r.metric || ""); const g = mm ? mm[1] : null; const name = mm ? mm[2] : r.metric;
      let head = "";
      if (g !== last) { head = `<tr><th colspan="${cols.length + 1}" style="background:var(--bg);color:var(--ink)">${esc(g)} ${esc(GROUP_NAMES[g] || "")}</th></tr>`; last = g; }
      return head + `<tr><td style="min-width:220px">${esc(name.trim())}</td>${(r.cells || []).map((c) => `<td class="n" style="white-space:normal">${esc(c)}</td>`).join("")}</tr>`;
    }).join("");
    return `<div class="tbl-wrap"><table><thead><tr><th>지표</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function labelTable(lb) {
    const cols = Object.keys(lb); const labels = [];
    cols.forEach((c) => Object.keys(lb[c] || {}).forEach((l) => { if (!labels.includes(l)) labels.push(l); }));
    return `<div class="tbl-wrap"><table><thead><tr><th>호출</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${labels.map((l) =>
      `<tr><td>${esc(l)}</td>${cols.map((c) => { const x = (lb[c] || {})[l]; return x ? `<td class="n">${x.in_k} / ${x.out_k} / ${x.sec}s</td>` : "<td>—</td>"; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function bucketTable(bk) {
    const runs = Object.keys(bk); const bs = [];
    runs.forEach((r) => Object.keys(bk[r] || {}).forEach((b) => { if (!bs.includes(b)) bs.push(b); }));
    const head = runs.map((r) => { const x = runFromName(r); return `<th>${x ? `<a href="#${x.id}">${esc(x.label)}</a>` : esc(r)}</th>`; }).join("");
    return `<div class="tbl-wrap"><table><thead><tr><th>구간</th>${head}</tr></thead><tbody>${bs.map((b) =>
      `<tr><td>${esc(b)}</td>${runs.map((r) => { const x = (bk[r] || {})[b]; return x ? `<td class="n">${kfmt(x.input)} <span style="color:var(--muted)">[캐시 ${kfmt(x.cached)}, 출력 ${(x.output / 1000).toFixed(2)}k, ${x.lat}s]</span></td>` : "<td>—</td>"; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function memoryTable(lm) {
    const rows = [];
    lm.forEach((x) => (x.tests || []).forEach((t, i) => {
      const r = runFromName(x.run);
      const bad = /틀림/.test(t.verdict || ""); const weak = /\*/.test(t.verdict || "");
      rows.push(`<tr><td>${i ? "" : (r ? `<a href="#${r.id}">${esc(x.run)}</a>` : esc(x.run))}</td><td>${i ? "" : esc(x.fact)}</td>
        <td class="n">${r ? `<a href="#${r.id}-${t.turn}">T${t.turn}</a>` : "T" + esc(t.turn)}</td>
        <td><span class="tone ${bad ? "fail" : weak ? "note" : "ok"}">${esc(t.verdict)}</span></td><td>${esc(t.note)}</td></tr>`);
    }));
    return `<div class="tbl-wrap"><table><thead><tr><th>판</th><th>원래 사실</th><th>질문 턴</th><th>판정</th><th>근거</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  }
  function perRunTable(pr) {
    const runs = Object.keys(pr); const keys = [];
    runs.forEach((r) => Object.keys(pr[r] || {}).forEach((k) => { if (!keys.includes(k)) keys.push(k); }));
    const val = (x) => x == null ? "—" : typeof x === "object" ? JSON.stringify(x) : String(x);
    return `<div class="tbl-wrap"><table><thead><tr><th>필드</th>${runs.map((r) => { const x = runFromName(r); return `<th>${x ? `<a href="#${x.id}">${esc(r)}</a>` : esc(r)}</th>`; }).join("")}</tr></thead><tbody>${keys.map((k) =>
      `<tr><td class="mono" style="font-size:12px">${esc(k)}</td>${runs.map((r) => `<td style="font-size:12px;min-width:120px;overflow-wrap:anywhere">${esc(val((pr[r] || {})[k]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function summaryBlocks(S) {
    const known = new Set(["table", "labels", "buckets", "long_memory", "per_run"]);
    const out = [];
    if (S.table && Array.isArray(S.table.rows) && S.table.rows.length && S.table.rows[0].cells) out.push(`<div><h3>엔진과 기준선 지표</h3>${metricTable(S.table)}</div>`);
    else if (S.table) out.push(`<div><h3>표</h3>${renderAny(S.table)}</div>`);
    if (Array.isArray(S.long_memory)) out.push(`<div><h3>장기 기억 시험 (수작업 판정)</h3>${memoryTable(S.long_memory)}</div>`);
    if (S.labels) out.push(`<div><h3>LLM 호출별 턴당 평균 <span style="font-weight:400;color:var(--muted);font-size:13px">입력 k / 출력 k / 호출당 초</span></h3>${labelTable(S.labels)}</div>`);
    if (S.buckets) out.push(`<div><h3>50턴 판, 10턴 구간별 턴당 입력 토큰</h3>${bucketTable(S.buckets)}</div>`);
    Object.keys(S).filter((k) => !known.has(k)).forEach((k) => out.push(`<div><h3>${esc(k)}</h3>${renderAny(S[k])}</div>`));
    if (S.per_run) out.push(`<details class="sys"><summary>판별 원자료 (per_run) 펼치기</summary>${perRunTable(S.per_run)}</details>`);
    if ((DATA.summary_notes || []).length) out.push(`<details class="sys" open><summary>매칭 규칙·측정 약점</summary><ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:4px;max-width:90ch">${DATA.summary_notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></details>`);
    return out.join("");
  }
  function renderSummary() {
    const v = $("#v-summary");
    let ext;
    try {
      ext = DATA.summary
        ? `<div style="display:grid;gap:16px"><div class="sec-h"><h2>정량 비교</h2><span>${esc(DATA.summary_src || "review/summary.json")}</span></div>${Array.isArray(DATA.summary) ? renderAny(DATA.summary) : summaryBlocks(DATA.summary)}</div>`
        : `<div class="pending"><b>정리 중</b>review/summary.json이 아직 없다. 들어오면 다시 빌드할 때 여기에 정량 표가 붙는다.</div>`;
    } catch (err) {
      ext = `<div class="pending"><b>정리 중</b>summary.json 형식을 읽지 못했다(${esc(err.message)}). 아래 표는 로그에서 바로 센 값이다.</div>`;
    }
    const rows = RUNS.map((r) => {
      const s = STATS[r.id]; const eng = r.kind === "engine";
      return `<tr><td><a href="#${r.id}">${esc(r.label)}</a></td><td>${eng ? "엔진" : "기준선"}</td><td>${esc(r.group)}</td><td class="n">${r.n}</td><td class="n">${eng ? esc(r.clock0) + "–" + esc(r.clock1) : "—"}</td>
        <td class="n">${s.avgLen}</td><td class="n">${kfmt(s.avgI)} / ${kfmt(s.avgO)}</td><td class="n">${s.avgSec.toFixed(1)}</td>
        <td class="n">${eng ? `${s.ev} (${s.forced})` : "—"}</td><td class="n">${eng ? `${s.det} (${s.prior})` : "—"}</td><td class="n">${eng ? s.leak : "—"}</td><td class="n">${eng ? s.rej : "—"}</td><td class="n">${eng ? s.ep : "—"}</td>
        <td>${eng ? esc((r.final || {}).stage) : "—"}</td></tr>`;
    }).join("");
    const own = `<div><div class="sec-h"><h2>로그에서 바로 센 값</h2><span>빌드할 때 로그를 그대로 센다</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>판</th><th>종류</th><th>묶음</th><th>턴</th><th>시각</th><th>도하 대사 평균(자)</th><th>턴당 입력/출력 tok</th><th>턴당 초</th><th>이벤트(코드)</th><th>떡밥 확정(지난 만남)</th><th>비밀 새어 나감</th><th>코드 거절</th><th>기억 묶음</th><th>최종 단계</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    v.innerHTML = `<div class="sum">${ext}${own}</div>`;
  }

  // 시작
  const lastRun = store.get("ot-run", null); if (lastRun && BY[lastRun]) $("#nav-run").href = "#" + lastRun;
  const lastPair = store.get("ot-pair", null); if (lastPair && BY[lastPair]) $("#nav-pair").href = "#pair-" + lastPair;
  if (!PAIRS.length) $("#nav-pair").hidden = true;
  $("#brand-title").textContent = SC.title;
  const topEl = $(".top");
  const setTop = () => document.documentElement.style.setProperty("--toph", topEl.offsetHeight + "px");
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(topEl); else window.addEventListener("resize", setTop);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
