<title>야근 이야기 플레이 로그</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 형광등 아래 14층 사무실. 위에 시나리오 한 줄, 그 아래 하이라이트(왼쪽)와 판 카드(오른쪽). 대화는 턴마다 [시각 레일 | 대사 | 판단 칩] 세 칸. */
:root {
  --bg: #eef1ef;        /* 형광등 아래 사무실 벽 */
  --panel: #fbfcfb;
  --panel-2: #e3e8e5;
  --ink: #18202c;       /* 남색 볼펜 잉크 */
  --ink-2: #364152;
  --muted: #5c6674;
  --line: #c9d1cc;
  --deck: #2347a3;      /* PT 장표 파랑 = 엔진 */
  --deck-soft: #e1e8f8;
  --graphite: #646c79;  /* 연필 = 기준선 */
  --postit: #fbe46a;    /* 노란 포스트잇 = 하이라이트 */
  --postit-ink: #403400;
  --redpen: #bf3427;    /* 교정 빨간펜 = 실패, 거절 */
  --redpen-soft: #f7dfdb;
  --ok: #1d7448;
  --ok-soft: #d9eee1;
  --amber: #9a5600;     /* 검은 노트 속 비밀 */
  --amber-soft: #f6e8cf;
  --rel: #18766a;
  --rain: #7d8fa8;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f131a; --panel: #161c25; --panel-2: #1e2632; --ink: #e5e9ef; --ink-2: #c2c9d3; --muted: #8e98a7; --line: #2c3644;
    --deck: #8eabff; --deck-soft: #1c2948; --graphite: #9ca5b2; --postit: #e6cd47; --postit-ink: #231c00;
    --redpen: #ff7b6c; --redpen-soft: #3b1e1b; --ok: #62d095; --ok-soft: #143021; --amber: #f2a948; --amber-soft: #382912;
    --rel: #52d3be; --rain: #6f83a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f131a; --panel: #161c25; --panel-2: #1e2632; --ink: #e5e9ef; --ink-2: #c2c9d3; --muted: #8e98a7; --line: #2c3644;
  --deck: #8eabff; --deck-soft: #1c2948; --graphite: #9ca5b2; --postit: #e6cd47; --postit-ink: #231c00;
  --redpen: #ff7b6c; --redpen-soft: #3b1e1b; --ok: #62d095; --ok-soft: #143021; --amber: #f2a948; --amber-soft: #382912;
  --rel: #52d3be; --rain: #6f83a0;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.6; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--deck); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--deck); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }

.wrap { max-width: 1280px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main.wrap { padding-block: 18px 72px; }

/* 상단 막대 */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand b { font-family: var(--font-display); font-weight: 400; font-size: 22px; letter-spacing: .01em; }
.brand span { color: var(--muted); font-size: 13px; }
.nav { display: flex; gap: 2px; margin-left: auto; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink-2); padding: 5px 12px; border-radius: 3px; font-size: 14px; border: 1px solid transparent; }
.nav a:hover { background: var(--panel-2); }
.nav a[aria-current="page"] { background: var(--ink); color: var(--bg); }

/* 시나리오 소개 */
.intro { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px 28px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .04em; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.eyebrow .cd { color: var(--redpen); }
.intro h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; line-height: 1.15; margin: 4px 0 6px; }
.lede { margin: 0 0 10px; color: var(--ink-2); max-width: 64ch; }
.eps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.eps li { min-width: 0; font-size: 13px; color: var(--ink-2); border-top: 2px solid var(--ink); padding-top: 6px; }
.eps .ep-t { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
.eps .ep-t b { font-weight: 600; color: var(--ink); }
.eps .ep-t span { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.eps p { margin: 2px 0 0; line-height: 1.5; }
.rel0 { min-width: 0; font-size: 13px; display: grid; gap: 8px; align-content: start; }
.rel0 h3 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .04em; }
.ladder { display: flex; flex-wrap: wrap; gap: 4px; }
.ladder span { padding: 1px 8px; border: 1px solid var(--line); border-radius: 2px; color: var(--muted); }
.ladder span.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.meters { display: grid; grid-template-columns: auto 1fr auto; gap: 3px 10px; align-items: center; }
.meter { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; height: 9px; }
.meter i { background: var(--panel-2); border: 1px solid var(--line); }
.meter i.on { background: var(--rel); border-color: var(--rel); }
.rel0 ul { margin: 0; padding-left: 16px; }
.rel0 details summary { cursor: pointer; color: var(--ink-2); }
.rel0 details p { margin: 4px 0 0; color: var(--ink-2); }

/* 홈 그리드 */
.home-grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; padding-top: 18px; align-items: start; }
.sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.sec-h h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.sec-h span { color: var(--muted); font-size: 13px; }

.hl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.hl-item { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px 11px; min-width: 0; }
.hl-item.active { box-shadow: inset 0 0 0 2px var(--postit); }
.hl-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.hl-head h3 { font-size: 15px; font-weight: 600; }
.tone { font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 2px; letter-spacing: .02em; white-space: nowrap; }
.tone.ok { background: var(--ok); color: var(--panel); }
.tone.fail { color: var(--redpen); border: 1px solid var(--redpen); background: repeating-linear-gradient(135deg, var(--redpen-soft) 0 4px, transparent 4px 8px); }
.tone.note { border: 1px solid var(--ink-2); }
.hl-item p { margin: 4px 0 8px; font-size: 13.5px; color: var(--ink-2); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.step { display: inline-flex; gap: 6px; align-items: baseline; text-decoration: none; color: var(--ink); border: 1px solid var(--line); background: var(--bg); padding: 2px 8px; border-radius: 2px; font-size: 12.5px; min-width: 0; }
.step:hover { border-color: var(--ink-2); }
.step b { font-family: var(--font-mono); font-weight: 500; font-size: 12px; white-space: nowrap; }
.step.base b::before { content: "기준선 "; font-family: var(--font-body); color: var(--graphite); }
.step span { color: var(--ink-2); }
.arrow { color: var(--muted); font-size: 12px; }

/* 필터와 세그먼트 */
.filters { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 3px 10px; font-size: 13px; cursor: pointer; border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg button.miss { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--line); }
.seg-l { font-size: 12px; color: var(--muted); margin-right: 4px; align-self: center; }
.seg-g { display: inline-flex; align-items: center; }

/* 판 카드 */
.grp-h { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .05em; margin: 4px 0 8px; display: flex; gap: 8px; align-items: center; }
.grp-h::after { content: ""; flex: 1; border-top: 1px solid var(--line); }
.cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.card.baseline { border-style: dashed; border-color: var(--graphite); background: transparent; }
.card-top { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
.kind { font-size: 11.5px; font-weight: 600; padding: 0 6px; border-radius: 2px; }
.kind.engine { background: var(--deck); color: var(--panel); }
.kind.baseline { border: 1px dashed var(--graphite); color: var(--graphite); }
.pill { border: 1px solid var(--line); padding: 0 6px; border-radius: 2px; color: var(--ink-2); white-space: nowrap; }
.card h3 { font-size: 16px; font-weight: 600; }
.card .meta { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.card p { margin: 0; font-size: 13px; color: var(--ink-2); }
.card .facts { font-size: 12px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px; }
.card .acts { display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; padding-top: 2px; }
.empty-note { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); padding: 10px 12px; }

/* 시간 띠 */
.ribbon { position: relative; height: 22px; margin: 2px 0 14px; }
.ribbon .bar { position: absolute; left: 0; right: 0; top: 9px; height: 4px; background: var(--panel-2); border: 1px solid var(--line); }
.ribbon .dark { position: absolute; top: 9px; height: 4px; right: 0; background: repeating-linear-gradient(90deg, var(--ink-2) 0 3px, transparent 3px 6px); }
.ribbon .cut { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px solid var(--redpen); }
.ribbon .cut span { position: absolute; top: 20px; left: -2px; transform: translateX(-50%); font-family: var(--font-mono); font-size: 10.5px; color: var(--redpen); white-space: nowrap; }
.ribbon .tick { position: absolute; top: 4px; width: 3px; height: 14px; margin-left: -1px; background: var(--deck); border: 0; padding: 0; opacity: .75; }
.ribbon button.tick { cursor: pointer; }
.ribbon .tick.fail { background: var(--redpen); opacity: 1; height: 18px; top: 2px; }
.ribbon .tick.mark { background: var(--postit); opacity: 1; height: 18px; top: 2px; box-shadow: 0 0 0 1px var(--postit-ink); }
.ribbon .lab { position: absolute; top: 20px; font-family: var(--font-mono); font-size: 10.5px; color: var(--muted); }
.ribbon.big { height: 34px; }
.ribbon.big .bar, .ribbon.big .dark { top: 12px; height: 6px; }
.ribbon.big .tick { top: 6px; height: 18px; width: 4px; }
.ribbon.big .tick.fail, .ribbon.big .tick.mark { top: 3px; height: 24px; }
.ribbon.big .cut span, .ribbon.big .lab { top: 30px; }

/* 대화 보기 머리 */
.run-head { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.run-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.run-head h2 small { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.run-head p { margin: 0; color: var(--ink-2); max-width: 80ch; }
.run-tools { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 3px 10px; border-radius: 3px; cursor: pointer; font-size: 13px; text-decoration: none; color: var(--ink); display: inline-block; }
.btn:hover { border-color: var(--ink-2); }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.sys { font-size: 13px; }
.sys summary { cursor: pointer; color: var(--ink-2); }
.sys pre { white-space: pre-wrap; font-family: var(--font-body); font-size: 13px; background: var(--panel); border: 1px solid var(--line); padding: 10px; max-height: 360px; overflow: auto; margin: 6px 0 0; }

.strip { display: grid; gap: 2px; font-size: 11px; overflow-x: auto; }
.strip .row { display: grid; gap: 1px; align-items: stretch; min-width: 0; }
.strip .row > span { font-size: 11.5px; color: var(--muted); padding-right: 6px; white-space: nowrap; }
.strip i { font-style: normal; font-family: var(--font-mono); font-size: 10.5px; text-align: center; line-height: 16px; min-height: 16px; color: var(--ink);
  background: color-mix(in srgb, var(--rel) calc(var(--v) * 85%), var(--panel-2)); cursor: pointer; }
.strip i.hi { color: var(--panel); }
.strip i.chg { box-shadow: inset 0 2px 0 var(--ink); }
.strip.dense i { color: transparent; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .chip { cursor: default; }

.follow { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph, 52px)); z-index: 4; background: var(--postit); color: var(--postit-ink); padding: 6px 10px; margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px; }
.follow b { font-weight: 600; }
.follow .step { background: transparent; border-color: var(--postit-ink); color: var(--postit-ink); }
.follow .step span { color: var(--postit-ink); }
.follow .step.cur { background: var(--postit-ink); color: var(--postit); }
.follow .step.cur span, .follow .step.cur b, .follow .step.cur b::before { color: var(--postit); }
.follow .x { margin-left: auto; border: 0; background: transparent; color: var(--postit-ink); cursor: pointer; text-decoration: underline; font-size: 12.5px; }

/* 턴 */
.turns { display: grid; gap: 0; }
.turn { display: grid; grid-template-columns: 92px minmax(0, 1fr) minmax(0, 300px); gap: 4px 18px; padding: 14px 0; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--toph, 52px) + 56px); }
.turn.baseline { grid-template-columns: 92px minmax(0, 1fr); }
.turn.target { background: linear-gradient(90deg, var(--postit) 0 4px, transparent 4px); padding-left: 10px; }
.rail { display: grid; gap: 2px; align-content: start; font-size: 12px; color: var(--muted); min-width: 0; }
.rail .tn { font-family: var(--font-display); font-size: 22px; line-height: 1; color: var(--ink); }
.rail .clk { font-family: var(--font-mono); font-size: 13px; color: var(--ink); font-variant-numeric: tabular-nums; }
.rail .loc { line-height: 1.35; }
.rail .tag { justify-self: start; font-size: 11px; padding: 0 5px; border-radius: 2px; border: 1px solid var(--line); }
.rail .tag.off { border-color: var(--redpen); color: var(--redpen); }
.body { display: grid; gap: 6px; min-width: 0; }
.mark { justify-self: start; background: var(--postit); color: var(--postit-ink); font-size: 12px; padding: 0 8px; font-weight: 500; }
.narr { margin: 0; color: var(--muted); font-size: 13.5px; padding-left: 10px; border-left: 2px solid var(--line); }
.line { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 8px; min-width: 0; }
.who { font-size: 12px; font-weight: 600; padding-top: 2px; }
.line.user .who { color: var(--muted); }
.line.char .who { color: var(--deck); }
.baseline .line.char .who { color: var(--graphite); }
.line p { margin: 0; overflow-wrap: anywhere; }
.line.user p { color: var(--ink-2); }
.act { color: var(--muted); font-style: italic; }
.tok { font-family: var(--font-mono); font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-content: start; min-width: 0; }
.chip { display: inline-flex; gap: 5px; align-items: baseline; border: 1px solid var(--line); background: var(--panel); padding: 1px 7px; border-radius: 2px; font-size: 12px; line-height: 1.5; cursor: pointer; text-align: left; max-width: 100%; color: var(--ink); }
.chip b { font-weight: 600; font-size: 10.5px; letter-spacing: .03em; color: var(--muted); white-space: nowrap; }
.chip:hover { border-color: var(--ink-2); }
.chip.k-event { border-color: var(--deck); background: var(--deck-soft); }
.chip.k-event b { color: var(--deck); }
.chip.k-event.forced { background: repeating-linear-gradient(135deg, var(--deck-soft) 0 5px, var(--panel) 5px 10px); border-width: 1px 1px 1px 4px; }
.chip.k-detail { border-color: var(--ink-2); }
.chip.k-detail.prior { border: 3px double var(--ink-2); padding: 0 6px; }
.chip.k-secret { border-color: var(--amber); color: var(--ink); }
.chip.k-secret b { color: var(--amber); }
.chip.k-secret.open { border-style: dashed; }
.chip.k-secret.tell { background: var(--amber-soft); }
.chip.k-secret.leak { border-color: var(--redpen); background: repeating-linear-gradient(135deg, var(--redpen-soft) 0 4px, var(--panel) 4px 8px); }
.chip.k-secret.leak b { color: var(--redpen); }
.chip.k-rel b { color: var(--rel); }
.chip.k-rel.up { border-color: var(--ok); background: var(--ok-soft); }
.chip.k-rel.down { border-color: var(--redpen); }
.chip.k-rel.down b { color: var(--redpen); }
.chip.k-rel.stage { border-color: var(--rel); border-width: 2px; }
.chip.k-reject { border: 1px dashed var(--redpen); color: var(--redpen); background: transparent; }
.chip.k-reject b { color: var(--redpen); }
.chip.k-episode { background: var(--panel-2); border-color: var(--ink-2); }
.chip.k-gate.open { border: 1px dashed var(--ok); color: var(--ok); }
.chip.k-gate.open b { color: var(--ok); }
.chip.k-gate { border-style: dashed; color: var(--muted); }
.chip.k-state, .chip.k-time { background: transparent; }
.chip.k-item { border-color: var(--rain); }
.chip.more { background: transparent; border-color: transparent; color: var(--deck); text-decoration: underline; text-underline-offset: 2px; padding-inline: 2px; }
.chip.more:hover { border-color: transparent; }

.raw { grid-column: 2 / -1; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; display: grid; gap: 10px; font-size: 13px; min-width: 0; }
.raw section { display: grid; gap: 3px; min-width: 0; }
.raw section.focus { box-shadow: -10px 0 0 -6px var(--postit); }
.raw h4 { margin: 0; font-size: 11.5px; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.raw ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 2px; }
.raw li { overflow-wrap: anywhere; }
.raw .id { font-family: var(--font-mono); font-size: 12px; color: var(--ink); background: var(--panel-2); padding: 0 4px; }
.raw .directive { margin: 0; padding: 6px 10px; background: var(--deck-soft); border-left: 3px solid var(--deck); }
.raw .ok, .raw .no { font-family: var(--font-mono); font-size: 10.5px; padding: 0 4px; margin-right: 6px; border-radius: 2px; }
.raw .ok { color: var(--ok); border: 1px solid var(--ok); }
.raw .no { color: var(--redpen); border: 1px dashed var(--redpen); }
.raw .src { color: var(--muted); font-size: 11.5px; margin-right: 6px; }
.raw li.no-row { color: var(--redpen); }
.raw dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 12px; margin: 0; }
.raw dt { color: var(--muted); }
.raw dd { margin: 0; overflow-wrap: anywhere; }

/* 나란히 */
.pair-head { display: grid; gap: 8px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.pair-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.pair-tabs { display: none; }
.pair-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--toph, 52px)); background: var(--bg); z-index: 3; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.pair-cols div { display: flex; gap: 8px; align-items: center; min-width: 0; }
.prow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 18px; border-bottom: 1px solid var(--line); scroll-margin-top: calc(var(--toph, 52px) + 48px); }
.prow.target { background: linear-gradient(90deg, var(--postit) 0 4px, transparent 4px); }
.pcell { display: grid; gap: 6px; padding: 12px 0 12px; min-width: 0; align-content: start; }
.pcell.eng { padding-left: 10px; }
.pcell.base { padding-left: 12px; border-left: 1px dashed var(--graphite); }
.pcell .ph { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pcell .ph .tn { font-family: var(--font-display); font-size: 19px; color: var(--ink); line-height: 1; }
.pcell .ph .clk { font-family: var(--font-mono); color: var(--ink); }
.pcell .raw { grid-column: auto; }
.pcell.none { color: var(--muted); font-size: 13px; }

/* 요약 */
.sum { display: grid; gap: 22px; }
.sum h3 { font-size: 15px; font-weight: 600; margin: 8px 0 6px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); background: var(--panel); }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel-2); white-space: nowrap; }
td.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: 12.5px; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.pending { border: 1px dashed var(--line); padding: 16px; color: var(--ink-2); background: repeating-linear-gradient(135deg, transparent 0 10px, var(--panel-2) 10px 11px); }
.pending b { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: block; color: var(--ink); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 14px; margin: 0; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }

@media (max-width: 980px) {
  .home-grid { grid-template-columns: minmax(0, 1fr); }
  .intro { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 820px) {
  .turn, .turn.baseline { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .rail { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .rail .tn { font-size: 19px; }
  .raw { grid-column: 1 / -1; }
  .cards { grid-template-columns: minmax(0, 1fr); }
  .eps { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .eps p, .rel-more { display: none; }
  .intro h1 { font-size: 28px; }
}
@media (max-width: 760px) {
  .pair-tabs { display: flex; }
  .pair-cols { display: none; }
  .prow { grid-template-columns: minmax(0, 1fr); }
  .pcell.base { border-left: 0; padding-left: 10px; }
  .pair.show-eng .pcell.base, .pair.show-base .pcell.eng { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .turn.target, .prow.target { animation: land .9s ease-out 1; }
  @keyframes land { from { background-color: color-mix(in srgb, var(--postit) 35%, transparent); } to { background-color: transparent; } }
}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">

<header class="top">
  <div class="wrap">
    <div class="brand"><b id="brand-title">14층의 야근</b><span>플레이 로그 · 엔진과 기준선</span></div>
    <nav class="nav" aria-label="보기">
      <a href="#home" data-nav="home">개요</a>
      <a href="#b15" data-nav="run" id="nav-run">대화</a>
      <a href="#pair-a15" data-nav="pair" id="nav-pair">나란히</a>
      <a href="#summary" data-nav="summary">요약</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="v-home"></section>
  <section id="v-run" hidden></section>
  <section id="v-pair" hidden></section>
  <section id="v-summary" hidden></section>
</main>

<script>
const DATA = /*__DATA__*/null;
(function () {
  "use strict";
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 저장 못 해도 동작 */ } },
  };

  const SC = DATA.scenario;
  const RUNS = DATA.runs;
  const BY = Object.fromEntries(RUNS.map((r) => [r.id, r]));
  const P = DATA.personas;
  const HL = DATA.highlights;
  const GROUPS = Array.from(new Set(RUNS.map((r) => r.group)));
  const T0 = 20 * 60 + 30, T1 = 24 * 60;
  const toMin = (c) => { const m = /^(\d{1,2}):(\d{2})$/.exec(c || ""); return m ? (+m[1]) * 60 + (+m[2]) : null; };
  const pct = (c) => { const m = toMin(c); return m == null ? null : Math.max(0, Math.min(100, ((m - T0) / (T1 - T0)) * 100)); };
  const cutPct = pct((SC.countdown && SC.countdown.at) || "23:00");
  const pad = (n) => String(n).padStart(2, "0");
  const kfmt = (n) => (n / 1000).toFixed(1) + "k";
  const fmtLine = (s) => esc(s).replace(/\(([^()]*)\)/g, '<span class="act">($1)</span>');
  const personaLabel = (r) => `${r.persona} ${(P[r.persona] || {}).name || ""}`.trim();

  // 짝: 같은 페르소나·턴 수·묶음의 엔진 ↔ 기준선
  function pairOf(r) {
    const other = r.kind === "engine" ? "baseline" : "engine";
    return RUNS.find((x) => x.kind === other && x.persona === r.persona && x.turns === r.turns && x.group === r.group)
      || RUNS.find((x) => x.kind === other && x.persona === r.persona && x.turns === r.turns) || null;
  }
  const PAIRS = RUNS.filter((r) => r.kind === "engine" && pairOf(r));

  // 판별 집계
  function stats(r) {
    const s = { ev: 0, forced: 0, det: 0, prior: 0, rej: 0, leak: 0, guard: 0, ep: 0, len: 0, i: 0, o: 0, sec: 0 };
    r.rows.forEach((t) => {
      s.len += (t.reply || "").length;
      s.i += t.use.i || 0; s.o += t.use.o || 0; s.sec += t.use.s || 0;
      (t.chips || []).forEach((c) => {
        if (c.k === "event") { s.ev++; if (c.c === "forced") s.forced++; }
        if (c.k === "detail") { s.det++; if (c.ep) s.prior++; }
        if (c.k === "reject") { s.rej++; if (c.c === "guard") s.guard++; }
        if (c.k === "secret" && c.c === "leak") s.leak++;
        if (c.k === "episode") s.ep++;
      });
    });
    const n = r.rows.length || 1;
    s.avgLen = Math.round(s.len / n); s.avgI = s.i / n; s.avgO = s.o / n; s.avgSec = s.sec / n;
    return s;
  }
  const STATS = Object.fromEntries(RUNS.map((r) => [r.id, stats(r)]));

  // ------------------------------------------------ 시간 띠
  function ribbon(r, big, marks) {
    if (r.kind !== "engine") return "";
    const ticks = r.rows.map((t) => {
      const p = pct(t.clock); if (p == null) return "";
      const fail = (t.chips || []).some((c) => c.k === "reject" || (c.k === "secret" && c.c === "leak"));
      const mark = marks && marks.has(t.n);
      const cls = "tick" + (mark ? " mark" : fail ? " fail" : "");
      const lab = `T${t.n} ${t.clock}`;
      return big
        ? `<button type="button" class="${cls}" style="left:${p}%" data-jump="${t.n}" aria-label="${lab}" title="${lab}"></button>`
        : `<span class="${cls}" style="left:${p}%" title="${lab}"></span>`;
    }).join("");
    return `<div class="ribbon${big ? " big" : ""}" aria-hidden="${big ? "false" : "true"}">
      <div class="bar"></div><div class="dark" style="left:${cutPct}%"></div>
      <div class="cut" style="left:${cutPct}%"><span>${esc((SC.countdown && SC.countdown.at) || "23:00")} 전원 차단</span></div>
      <span class="lab" style="left:0">20:30</span>${ticks}</div>`;
  }

  function relStrip(r) {
    if (r.kind !== "engine") return "";
    const n = r.rows.length;
    const names = ["친밀", "신뢰", "설렘"];
    const cols = `grid-template-columns: 40px repeat(${n}, minmax(${n > 24 ? 5 : 16}px, 1fr))`;
    const rows = names.map((nm, k) => {
      let prev = null;
      const cells = r.rows.map((t) => {
        const v = t.st[k]; const chg = prev != null && v !== prev; prev = v;
        return `<i style="--v:${(v || 0) / 5}" class="${v >= 4 ? "hi" : ""}${chg ? " chg" : ""}" data-jump="${t.n}" title="T${t.n} ${nm} ${v}">${v}</i>`;
      }).join("");
      return `<div class="row" style="${cols}"><span>${nm}</span>${cells}</div>`;
    });
    let prevS = null;
    const stCells = r.rows.map((t) => {
      const idx = Math.max(0, SC.stages.indexOf(t.stage)); const chg = prevS != null && t.stage !== prevS; prevS = t.stage;
      return `<i style="--v:${idx / 3}" class="${idx >= 2 ? "hi" : ""}${chg ? " chg" : ""}" data-jump="${t.n}" title="T${t.n} ${esc(t.stage)}">${esc((t.stage || "").split(" ").pop())}</i>`;
    }).join("");
    rows.push(`<div class="row" style="${cols}"><span>단계</span>${stCells}</div>`);
    return `<div class="strip${n > 24 ? " dense" : ""}" aria-label="턴별 관계 수치">${rows.join("")}</div>`;
  }

  // ------------------------------------------------ 칩
  const KIND = { event: "이벤트", detail: "떡밥", secret: "비밀", rel: "관계", item: "소지품", reject: "거절", episode: "기억", gate: "이벤트 문", state: "상태", time: "시간" };
  function chipTag(c) {
    if (c.k === "event" && c.c === "forced") return "코드 발동";
    if (c.k === "detail" && c.ep) return "지난 만남 " + c.ep;
    if (c.k === "reject" && c.c === "guard") return "가드레일";
    return KIND[c.k] || c.k;
  }
  const chipHTML = (c) => `<button type="button" class="chip k-${c.k} ${c.c || ""}" data-sec="${esc(c.s)}" title="${esc(c.tip || "")}"><b>${esc(chipTag(c))}</b>${esc(c.t)}</button>`;

  function legend() {
    const ex = [
      { k: "event", c: "", t: "카피 반려" }, { k: "event", c: "forced", t: "비 시작" },
      { k: "detail", c: "", t: "언급 볼펜 딸깍" }, { k: "detail", c: "prior", ep: "ep3", t: "회수 검은 우산" },
      { k: "secret", c: "open", t: "비밀 열림" }, { k: "secret", c: "tell", t: "털어놓음" }, { k: "secret", c: "leak", t: "새어 나감" },
      { k: "rel", c: "up", t: "신뢰 +1" }, { k: "rel", c: "down", t: "친밀 -1" }, { k: "reject", c: "", t: "떡밥 거절" },
      { k: "gate", c: "open", t: "풀림" }, { k: "episode", c: "", t: "묶음" },
    ];
    return `<div class="legend"><span>칩 읽는 법</span>${ex.map((c) => chipHTML(c).replace("<button", '<span tabindex="-1"').replace("</button>", "</span>")).join("")}<span>칩을 누르면 DM 지시와 코드 노트 원문이 열린다.</span></div>`;
  }

  // ------------------------------------------------ 원문 패널
  function kvs(o) {
    return Object.entries(o || {}).filter(([, v]) => v != null && v !== "").map(([k, v]) =>
      `<span class="src">${esc(k)}</span>${esc(typeof v === "object" ? JSON.stringify(v) : v)}`).join(" ");
  }
  function sec(key, title, inner) { return inner ? `<section data-sec="${key}"><h4>${esc(title)}</h4>${inner}</section>` : ""; }
  function list(items) { return items.length ? `<ul>${items.join("")}</ul>` : ""; }
  function rawHTML(t) {
    const r = t.raw || {};
    const dm = [
      r.scene && `<dt>장면</dt><dd>${esc(r.scene)}</dd>`,
      (r.beat || r.tension != null) && `<dt>박자·긴장</dt><dd>${esc(r.beat || "")} · ${esc(r.tension)}</dd>`,
      r.minutes != null && `<dt>시간</dt><dd>+${esc(r.minutes)}분 ${esc(r.minutes_why || "")}</dd>`,
    ].filter(Boolean).join("");
    const parts = [
      sec("dm", "DM 판단", (dm ? `<dl>${dm}</dl>` : "") + (r.directive ? `<p class="directive"><span class="src">directive</span>${esc(r.directive)}</p>` : "")),
      sec("events", "이벤트 (일어난 것)", list((r.fired || []).map((x) => `<li><span class="id">${esc(x.id)}</span> ${x.forced ? '<span class="no">코드 발동</span>' : ""}${esc(x.how)}</li>`))),
      sec("details", "떡밥 (DM 제안 how)", list((r.details || []).map((x) => `<li><span class="id">${esc(x.id)}</span> <span class="src">${esc(x.mode)} · ${esc(x.via)}</span>${esc(x.how)}</li>`))
        + (r.used && r.used.length ? `<p style="margin:0"><span class="src">캐릭터가 쓴 것</span>${r.used.map((x) => `<span class="id">${esc(x)}</span>`).join(" ")}</p>` : "")),
      sec("reveal", "비밀 (reveal)", list((r.reveal || []).map((x) => `<li><span class="id">${esc(x.id)}</span> ${esc(x.why)}</li>`))
        + (r.revealed && r.revealed.length ? `<p style="margin:0"><span class="src">캐릭터가 털어놓음</span>${r.revealed.map((x) => `<span class="id">${esc(x)}</span>`).join(" ")}</p>` : "")),
      sec("rel", "관계 제안 (relationship_update)", list(Object.entries(r.rel || {}).map(([k, v]) =>
        `<li><span class="src">${esc(k)}</span>${Array.isArray(v) ? v.map((x) => typeof x === "object" ? kvs(x) : esc(x)).join(" / ") : (typeof v === "object" ? kvs(v) : esc(v))}</li>`))),
      sec("items", "소지품 이동", list((r.items || []).map((x) => `<li><span class="id">${esc(x.id)}</span> → ${esc(x.to)} <span class="src">${esc(x.why || "")}</span></li>`))),
      sec("episode", "기억 묶음 (에피소드)", list((r.episodes || []).map((x) => `<li><b>${esc(x.title)}</b> <span class="src">턴 ${esc((x.turns || []).join ? x.turns.join(", ") : x.turns)} · ${esc(x.clock || "")}</span><br>${esc(x.summary)}</li>`))),
      sec("retrieval", "검색", (r.need ? `<p style="margin:0"><span class="src">필요</span>${esc(r.need)}</p>` : "")
        + list((r.picks || []).map((x) => `<li><span class="id">${esc(x.id)}</span> ${esc(x.use_as || "")}</li>`))
        + ((r.blocked || []).length ? `<p style="margin:0"><span class="src">막힌 이벤트</span>${r.blocked.map((b) => `<span class="id">${esc(b.id)}</span> ${esc(b.why)}`).join(" · ")}</p>` : "")),
      sec("notes", "코드 노트 (applied.notes, 캐릭터 확정, 가드레일)", list((r.notes || []).map((x) =>
        `<li class="${x.ok ? "" : "no-row"}"><span class="${x.ok ? "ok" : "no"}">${x.ok ? "OK" : "NO"}</span><span class="src">${esc(x.src)}</span>${esc(x.t)}</li>`))),
      sec("tok", "토큰", tokTable(t.use)),
    ];
    return parts.join("");
  }
  function tokTable(u) {
    if (!u || !u.by || !u.by.length) return "";
    return `<div class="tbl-wrap"><table><thead><tr><th>호출</th><th>입력</th><th>캐시</th><th>출력</th><th>초</th></tr></thead><tbody>${u.by.map((b) =>
      `<tr><td>${esc(b.l)}${b.n > 1 ? " ×" + b.n : ""}</td><td class="n">${b.i}</td><td class="n">${b.c}</td><td class="n">${b.o}</td><td class="n">${b.s}</td></tr>`).join("")}</tbody></table></div>`;
  }
  function tokLine(u, kind) {
    if (!u) return "";
    if (kind === "baseline" || !u.by || !u.by.length) return `<div class="tok"><span>기준선 ${kfmt((u.i || 0) + (u.o || 0))} tok</span><span>${u.s}s</span></div>`;
    const by = u.by.slice().sort((a, b) => (b.i + b.o) - (a.i + a.o));
    return `<div class="tok">${by.map((b) => `<span>${esc(b.l)} ${kfmt(b.i + b.o)}</span>`).join("")}<span>${u.s}s</span></div>`;
  }

  // ------------------------------------------------ 턴
  function railHTML(t) {
    const loc = t.cl === t.ul ? `둘 다 · ${esc(t.cl)}` : `도하 ${esc(t.cl)}<br>채원 ${esc(t.ul)}`;
    const tags = [];
    if (t.ch === "phone") tags.push(`<span class="tag">메신저</span>`);
    if (t.power === "꺼짐") tags.push(`<span class="tag off">전원 꺼짐</span>`);
    return `<span class="tn">T${pad(t.n)}</span><span class="clk">${esc(t.clock || "")}</span><span class="loc">${loc}</span>
      <span>폰 ${Math.round(t.bat)}%${t.chg ? " 충전 중" : ""}${t.weather === "비" ? " · 비" : ""}</span>${tags.join("")}`;
  }
  function dialog(t, kind) {
    return (t.narr ? `<p class="narr">${fmtLine(t.narr)}</p>` : "")
      + `<div class="line user"><span class="who">채원</span><p>${fmtLine(t.user)}</p></div>`
      + `<div class="line char"><span class="who">도하</span><p>${fmtLine(t.reply)}</p></div>`
      + tokLine(t.use, kind);
  }
  function chipsHTML(t) {
    return (t.chips || []).map(chipHTML).join("") + `<button type="button" class="chip more" data-raw aria-expanded="false">판단 원문</button>`;
  }
  function engineTurn(r, t, mark) {
    return `<article class="turn engine" id="t-${t.n}" data-n="${t.n}">
      <div class="rail">${railHTML(t)}</div>
      <div class="body">${mark ? `<span class="mark">하이라이트 · ${esc(mark)}</span>` : ""}${dialog(t, "engine")}</div>
      <div class="chips">${chipsHTML(t)}</div>
      <div class="raw" hidden></div></article>`;
  }
  function baseTurn(r, t, mark) {
    return `<article class="turn baseline" id="t-${t.n}" data-n="${t.n}">
      <div class="rail"><span class="tn">T${pad(t.n)}</span><span>시각 없음</span></div>
      <div class="body">${mark ? `<span class="mark">하이라이트 · ${esc(mark)}</span>` : ""}${dialog(t, "baseline")}</div></article>`;
  }

  // 칩 클릭 → 원문 펼침
  document.addEventListener("click", (ev) => {
    const chip = ev.target.closest(".chip");
    if (chip && !chip.closest(".legend")) {
      const host = chip.closest(".turn, .pcell");
      if (!host) return;
      const raw = $(".raw", host);
      const n = +(host.dataset.n);
      const r = BY[host.dataset.run || state.runId];
      const t = r && r.rows.find((x) => x.n === n);
      if (!raw || !t) return;
      if (!raw.dataset.filled) { raw.innerHTML = rawHTML(t); raw.dataset.filled = "1"; }
      const toggle = $(".chip.more", host);
      if (chip.hasAttribute("data-raw")) {
        raw.hidden = !raw.hidden;
      } else {
        raw.hidden = false;
      }
      $$("section", raw).forEach((s) => s.classList.toggle("focus", !chip.hasAttribute("data-raw") && s.dataset.sec === chip.dataset.sec));
      toggle.setAttribute("aria-expanded", String(!raw.hidden));
      toggle.textContent = raw.hidden ? "판단 원문" : "원문 닫기";
      return;
    }
    const jump = ev.target.closest("[data-jump]");
    if (jump) {
      const n = +jump.dataset.jump;
      if (state.view === "run") location.hash = `#${state.runId}-${n}`;
      return;
    }
    const step = ev.target.closest(".step[data-hl]");
    if (step) {
      state.hl = +step.dataset.hl;
      if (step.getAttribute("href") === location.hash) { ev.preventDefault(); route(); }
    }
  });

  // ------------------------------------------------ 상태와 라우팅
  const state = { view: "home", runId: null, pairId: null, n: null, hl: null, filt: store.get("ot-filt", { turns: "all", kind: "all", persona: "all" }) };

  function parseHash() {
    const h = decodeURIComponent((location.hash || "").replace(/^#/, ""));
    if (!h || h === "home") return { view: "home" };
    if (h === "summary") return { view: "summary" };
    if (h.startsWith("pair")) {
      const rest = h.replace(/^pair-?/, "");
      const id = matchId(rest, PAIRS.map((r) => r.id));
      return { view: "pair", id: id ? id.id : (PAIRS[0] && PAIRS[0].id), n: id ? id.n : null };
    }
    const m = matchId(h, RUNS.map((r) => r.id));
    if (m) return { view: "run", id: m.id, n: m.n };
    return { view: "home" };
  }
  function matchId(s, ids) {
    const sorted = ids.slice().sort((a, b) => b.length - a.length);
    for (const id of sorted) {
      if (s === id) return { id, n: null };
      if (s.startsWith(id + "-") && /^\d+$/.test(s.slice(id.length + 1))) return { id, n: +s.slice(id.length + 1) };
    }
    return null;
  }

  function route() {
    const p = parseHash();
    state.view = p.view;
    ["home", "run", "pair", "summary"].forEach((v) => { $("#v-" + v).hidden = v !== p.view; });
    $$(".nav a").forEach((a) => { if (a.dataset.nav === p.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (p.view === "home") renderHome();
    if (p.view === "run") {
      if (state.runId !== p.id || !$("#v-run").dataset.built || state.builtHl !== state.hl) { state.runId = p.id; renderRun(); }
      state.n = p.n; store.set("ot-run", p.id); $("#nav-run").href = "#" + p.id;
      updateFollow(); target(p.n, "#v-run .turn");
    }
    if (p.view === "pair") {
      if (state.pairId !== p.id || !$("#v-pair").dataset.built) { state.pairId = p.id; renderPair(); }
      store.set("ot-pair", p.id); $("#nav-pair").href = "#pair-" + p.id;
      target(p.n, "#v-pair .prow");
    }
    if (p.view === "summary") renderSummary();
    if (p.n == null) window.scrollTo(0, 0);
  }
  function target(n, sel) {
    $$(sel).forEach((el) => el.classList.remove("target"));
    if (n == null) return;
    const el = $$(sel).find((x) => +x.dataset.n === n);
    if (el) { el.classList.add("target"); el.scrollIntoView({ block: "start" }); }
  }

  // ------------------------------------------------ 개요
  function renderHome() {
    const v = $("#v-home");
    const stats0 = SC.stats.map((s) => `<span>${esc(s.name)}</span><span class="meter">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= s.value ? "on" : ""}"></i>`).join("")}</span><span class="num mono">${s.value}/5</span>`).join("");

        <div class="eyebrow"><span>scenario: overtime</span><span>${esc(SC.start)}–${esc(SC.end)}</span><span class="cd">${esc((SC.countdown || {}).at || "")} ${esc((SC.countdown || {}).label || "")}</span></div>
        <h1>${esc(SC.title)}</h1>
        <p class="lede">${(SC.intro || []).map(esc).join(" ")}</p>
        <ol class="eps">${SC.episodes.map((e) => `<li><div class="ep-t"><b>${esc(e.id)} ${esc(e.title)}</b><span>${esc(e.when)}</span></div><p>${esc(e.line)}</p></li>`).join("")}</ol>
      </div>
      <aside class="rel0" aria-label="시작 관계">

        <div class="ladder">${SC.stages.map((s) => `<span class="${s === SC.stage ? "on" : ""}">${esc(s)}</span>`).join("")}</div>

        <div class="rel-more"><h3>열린 약속 ${SC.promises.length}</h3><ul>${SC.promises.map((p) => `<li>${esc(p.name)} <span style="color:var(--muted)">(${esc(p.by)})</span></li>`).join("")}</ul></div>
        <details class="rel-more"><summary>잠긴 비밀 ${SC.secrets.length}개 보기</summary>${SC.secrets.map((s) => `<p><span class="mono">${esc(s.id)}</span> ${esc(s.fact)}<br><span style="color:var(--muted)">숨길 때: ${esc(s.cover)}</span></p>`).join("")}</details>
      </aside></div>`;

    const hl = `<section aria-labelledby="h-hl"><div class="sec-h"><h2 id="h-hl">하이라이트</h2><span>누르면 그 턴으로 간다</span></div>
      <ol class="hl-list">${HL.map((h, i) => {
        const r0 = BY[h.steps[0].run];
        const runTag = r0 ? `${r0.turns}턴 ${r0.kind === "engine" ? "엔진" : "기준선"} ${r0.persona}` : "";
        return `<li class="hl-item${state.hl === i ? " active" : ""}"><div class="hl-head"><span class="tone ${h.tone}">${h.tone === "ok" ? "설계대로" : h.tone === "fail" ? "실패" : "관찰"}</span><span class="pill">${esc(runTag)}</span><h3>${esc(h.title)}</h3></div>
          <p>${esc(h.desc)}</p><div class="steps">${stepsHTML(h, i)}</div></li>`;
      }).join("")}</ol></section>`;

    const f = state.filt;
    const segF = (key, label, opts) => `<span class="seg-g"><span class="seg-l">${label}</span><span class="seg" role="group" aria-label="${label}">${opts.map(([val, txt]) =>
      `<button type="button" data-f="${key}" data-v="${val}" aria-pressed="${String(f[key]) === String(val)}">${txt}</button>`).join("")}</span></span>`;
    const shown = RUNS.filter((r) => (f.turns === "all" || String(r.turns) === String(f.turns)) && (f.kind === "all" || r.kind === f.kind) && (f.persona === "all" || r.persona === f.persona));
    const groups = GROUPS.concat(GROUPS.includes("수정 후") ? [] : ["수정 후"]);
    const cards = groups.map((g) => {
      const rs = shown.filter((r) => r.group === g);
      const body = rs.length ? `<div class="cards">${rs.map(cardHTML).join("")}</div>`
        : `<p class="empty-note">${g === "수정 후" && !GROUPS.includes("수정 후") ? "수정 후 재실행 로그가 들어오면 여기에 붙는다." : "이 조건에 맞는 판이 없다."}</p>`;
      return `<div class="grp-h">${esc(g)}</div>${body}`;
    }).join("");
    const runs = `<section aria-labelledby="h-runs"><div class="sec-h"><h2 id="h-runs">판</h2><span>${RUNS.length}개 · 엔진 ${RUNS.filter((r) => r.kind === "engine").length}, 기준선 ${RUNS.filter((r) => r.kind === "baseline").length}</span></div>
      <div class="filters">${segF("turns", "턴", [["all", "전체"], ["15", "15턴"], ["50", "50턴"]])}${segF("kind", "종류", [["all", "전체"], ["engine", "엔진"], ["baseline", "기준선"]])}${segF("persona", "채원", [["all", "전체"], ["A", "A"], ["B", "B"], ["C", "C"]])}</div>
      ${cards}</section>`;

    v.innerHTML = intro + `<div class="home-grid">${hl}${runs}</div>`;
    $$("[data-f]", v).forEach((b) => b.addEventListener("click", () => {
      state.filt[b.dataset.f] = b.dataset.v; store.set("ot-filt", state.filt); renderHome();
      const nb = $(`[data-f="${b.dataset.f}"][data-v="${b.dataset.v}"]`); if (nb) nb.focus();
    }));
  }
  function stepsHTML(h, i, curRun, curN) {
    return h.steps.map((s, k) => {
      const r = BY[s.run]; if (!r) return "";
      const cur = curRun === s.run && curN === s.n;
      return (k ? '<span class="arrow" aria-hidden="true">→</span>' : "")
        + `<a class="step${r.kind === "baseline" ? " base" : ""}${cur ? " cur" : ""}" data-hl="${i}" href="#${s.run}-${s.n}"><b>${r.kind === "engine" && h.steps.some((x) => BY[x.run] && BY[x.run].kind === "baseline") ? "엔진 " : ""}T${s.n}</b><span>${esc(s.cap)}</span></a>`;
    }).join("");
  }
  function cardHTML(r) {
    const s = STATS[r.id];
    const pr = pairOf(r);
    let meta, facts = [];
    if (r.kind === "engine") {
      const fs = r.final || {};
      meta = `${r.n}턴 기록 · ${esc(r.clock0)}–${esc(r.clock1)} · 최종 ${esc(fs.stage)} ${fs.st ? `친${fs.st[0]} 신${fs.st[1]} 설${fs.st[2]}` : ""}`;
      (r.secrets || []).forEach((x) => {
        if (x.revealed != null) facts.push(`<span class="chip k-secret ${x.leaked ? "leak" : "tell"}" tabindex="-1"><b>비밀</b>${esc(x.name)} T${x.revealed}${x.leaked ? " 새어 나감" : ""}</span>`);
      });
      facts.push(`<span class="chip k-event${s.forced ? " forced" : ""}" tabindex="-1"><b>이벤트</b>${s.ev}${s.forced ? ` (코드 ${s.forced})` : ""}</span>`);
      facts.push(`<span class="chip k-detail prior" tabindex="-1"><b>떡밥</b>${s.det} (지난 만남 ${s.prior})</span>`);
      if (s.rej) facts.push(`<span class="chip k-reject" tabindex="-1"><b>거절</b>${s.rej}</span>`);
    } else {
      meta = `${r.n}턴 기록 · 시각 없음 · 턴당 ${kfmt(s.avgI + s.avgO)} tok`;
    }
    return `<article class="card ${r.kind}">
      <div class="card-top"><span class="kind ${r.kind}">${r.kind === "engine" ? "엔진" : "기준선"}</span><span class="pill">${r.turns}턴</span><span class="pill">채원 ${esc(personaLabel(r))}</span></div>
      <h3>${esc(r.label)}</h3><div class="meta">${meta}</div>
      ${ribbon(r, false)}
      <p>${esc(r.summary)}</p>
      ${facts.length ? `<div class="facts">${facts.join("")}</div>` : ""}
      <div class="acts"><a href="#${r.id}">대화 보기</a>${pr ? `<a href="#pair-${r.kind === "engine" ? r.id : pr.id}">${r.kind === "engine" ? "기준선과" : "엔진과"} 나란히</a>` : ""}</div></article>`;
  }

  // ------------------------------------------------ 대화
  function runSwitch(r) {
    const dims = [["turns", "턴", Array.from(new Set(RUNS.map((x) => x.turns))).sort((a, b) => a - b).map((x) => [x, x + "턴"])],
      ["kind", "종류", [["engine", "엔진"], ["baseline", "기준선"]]],
      ["persona", "채원", Object.keys(P).map((x) => [x, x])]];
    if (GROUPS.length > 1) dims.unshift(["group", "묶음", GROUPS.map((g) => [g, g])]);
    return `<div class="filters">${dims.map(([key, label, opts]) => `<span class="seg-g"><span class="seg-l">${label}</span><span class="seg" role="group" aria-label="${label}">${opts.map(([val, txt]) => {
      const want = Object.assign({ group: r.group, turns: r.turns, kind: r.kind, persona: r.persona }, { [key]: val });
      const exact = RUNS.find((x) => x.group === want.group && String(x.turns) === String(want.turns) && x.kind === want.kind && x.persona === want.persona);
      return `<button type="button" data-sw="${key}" data-v="${esc(val)}" aria-pressed="${String(r[key]) === String(val)}" class="${exact ? "" : "miss"}" title="${exact ? esc(exact.label) : "이 조합의 판이 없어 가장 가까운 판으로 간다"}">${esc(txt)}</button>`;
    }).join("")}</span></span>`).join("")}</div>`;
  }
  function bestRun(want) {
    let best = null, score = -1;
    RUNS.forEach((x) => {
      const sc = (x.group === want.group ? 1 : 0) + (String(x.turns) === String(want.turns) ? 2 : 0) + (x.kind === want.kind ? 4 : 0) + (x.persona === want.persona ? 2 : 0) + (String(x[want.key]) === String(want[want.key]) ? 10 : 0);
      if (sc > score) { score = sc; best = x; }
    });
    return best;
  }
  function renderRun() {
    const r = BY[state.runId]; const v = $("#v-run");
    if (!r) { v.innerHTML = "<p>판을 찾지 못했다.</p>"; return; }
    const pr = pairOf(r);
    const marks = marksFor(r.id);
    const head = `<div class="run-head">
      ${runSwitch(r)}
      <h2><span class="kind ${r.kind}" style="font-family:var(--font-body)">${r.kind === "engine" ? "엔진" : "기준선"}</span>${esc(r.label)}<small>${r.turns}턴 시험 · ${r.n}턴 기록${r.clock0 ? ` · ${esc(r.clock0)}–${esc(r.clock1)}` : ""} · ${esc(r.group)}</small></h2>
      <p><b>채원 ${esc(personaLabel(r))}</b> · ${esc((P[r.persona] || {}).desc || "")}</p>
      <p>${esc(r.summary)}</p>
      ${ribbon(r, true, new Set(marks.keys()))}
      ${relStrip(r)}
      ${r.kind === "engine" ? legend() : ""}
      ${r.system ? `<details class="sys"><summary>기준선 시스템 프롬프트 보기 (${r.system.length.toLocaleString()}자)</summary><pre>${esc(r.system)}</pre></details>` : ""}
      <div class="run-tools">${pr ? `<a class="btn" href="#pair-${r.kind === "engine" ? r.id : pr.id}">${r.kind === "engine" ? "기준선과" : "엔진과"} 나란히 보기</a>` : ""}
        ${r.kind === "engine" ? `<button type="button" class="btn" id="open-all" aria-pressed="false">원문 모두 펼치기</button>` : ""}
        <span class="mono" style="color:var(--muted);font-size:12px">${esc(r.file)}</span></div>
    </div><div class="follow" hidden></div>`;
    const rows = r.rows.map((t) => (r.kind === "engine" ? engineTurn(r, t, marks.get(t.n)) : baseTurn(r, t, marks.get(t.n)))).join("");
    v.innerHTML = head + `<div class="turns">${rows}</div>`;
    v.dataset.built = "1"; state.builtHl = state.hl;
    $$("[data-sw]", v).forEach((b) => b.addEventListener("click", () => {
      const want = { group: r.group, turns: r.turns, kind: r.kind, persona: r.persona, key: b.dataset.sw };
      want[b.dataset.sw] = b.dataset.sw === "turns" ? +b.dataset.v : b.dataset.v;
      const x = bestRun(want); if (x) location.hash = "#" + x.id;
    }));
    const oa = $("#open-all", v);
    if (oa) oa.addEventListener("click", () => {
      const on = oa.getAttribute("aria-pressed") !== "true";
      oa.setAttribute("aria-pressed", String(on)); oa.textContent = on ? "원문 모두 접기" : "원문 모두 펼치기";
      $$(".turn", v).forEach((el) => {
        const raw = $(".raw", el); if (!raw) return;
        const t = r.rows.find((x) => x.n === +el.dataset.n);
        if (!raw.dataset.filled) { raw.innerHTML = rawHTML(t); raw.dataset.filled = "1"; }
        raw.hidden = !on; const tg = $(".chip.more", el); tg.setAttribute("aria-expanded", String(on)); tg.textContent = on ? "원문 닫기" : "판단 원문";
      });
    });
  }
  function marksFor(runId) {
    const m = new Map();
    if (state.hl != null && HL[state.hl]) HL[state.hl].steps.forEach((s) => { if (s.run === runId) m.set(s.n, s.cap); });
    return m;
  }
  function updateFollow() {
    const box = $("#v-run .follow"); if (!box) return;
    const h = state.hl != null ? HL[state.hl] : null;
    if (!h || !h.steps.some((s) => s.run === state.runId)) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = `<b>${esc(h.title)}</b><div class="steps">${stepsHTML(h, state.hl, state.runId, state.n)}</div><button type="button" class="x">따라가기 끄기</button>`;
    $(".x", box).addEventListener("click", () => { state.hl = null; box.hidden = true; renderRun(); updateFollow(); });
  }

  // ------------------------------------------------ 나란히
  function renderPair() {
    const v = $("#v-pair");
    const e = BY[state.pairId] || PAIRS[0];
    if (!e) { v.innerHTML = "<p>짝이 되는 엔진·기준선 판이 없다.</p>"; return; }
    const b = pairOf(e);
    const tab = store.get("ot-pair-tab", "eng");
    const opts = PAIRS.map((x) => `<button type="button" data-pair="${x.id}" aria-pressed="${x.id === e.id}">${x.turns}턴 ${x.persona}${GROUPS.length > 1 ? " · " + esc(x.group) : ""}</button>`).join("");
    const head = `<div class="pair-head">
      <div class="filters"><span class="seg-g"><span class="seg-l">짝</span><span class="seg" role="group" aria-label="짝 고르기">${opts}</span></span></div>
      <h2>${esc(e.label)} ↔ ${esc(b.label)}</h2>
      <p style="margin:0;color:var(--ink-2)">채원 ${esc(personaLabel(e))} · 같은 페르소나 지시로 돌렸지만 유저 대사는 판마다 다르다(시뮬레이션 유저가 앞 응답에 반응한다). 턴 번호로만 맞춘다.</p>
      <div class="pair-tabs seg" role="group" aria-label="열 고르기"><button type="button" data-tab="eng" aria-pressed="${tab === "eng"}">엔진</button><button type="button" data-tab="base" aria-pressed="${tab === "base"}">기준선</button></div>
    </div>
    <div class="pair-cols"><div><span class="kind engine">엔진</span>${esc(e.label)} · ${e.n}턴</div><div><span class="kind baseline">기준선</span>${esc(b.label)} · ${b.n}턴</div></div>`;
    const N = Math.max(e.n, b.n);
    const eBy = new Map(e.rows.map((t) => [t.n, t])); const bBy = new Map(b.rows.map((t) => [t.n, t]));
    const nums = Array.from(new Set(e.rows.map((t) => t.n).concat(b.rows.map((t) => t.n)))).sort((x, y) => x - y);
    const rows = nums.map((n) => {
      const et = eBy.get(n), bt = bBy.get(n);
      const ec = et ? `<div class="pcell eng" data-run="${e.id}" data-n="${n}"><div class="ph"><span class="tn">T${pad(n)}</span><span class="clk">${esc(et.clock)}</span><span>${et.cl === et.ul ? esc(et.cl) : "도하 " + esc(et.cl) + " / 채원 " + esc(et.ul)}</span></div>${dialog(et, "engine")}<div class="chips">${chipsHTML(et)}</div><div class="raw" hidden></div></div>`
        : `<div class="pcell eng none">이 턴 없음</div>`;
      const bc = bt ? `<div class="pcell base"><div class="ph"><span class="tn">T${pad(n)}</span><span>기준선</span></div>${dialog(bt, "baseline")}</div>` : `<div class="pcell base none">이 턴 없음</div>`;
      return `<div class="prow" data-n="${n}" id="p-${n}">${ec}${bc}</div>`;
    }).join("");
    v.innerHTML = head + `<div class="pair show-${tab}">${rows}</div>`;
    v.dataset.built = "1";
    $$("[data-pair]", v).forEach((x) => x.addEventListener("click", () => { location.hash = "#pair-" + x.dataset.pair; }));
    $$("[data-tab]", v).forEach((x) => x.addEventListener("click", () => {
      store.set("ot-pair-tab", x.dataset.tab);
      const p = $(".pair", v); p.classList.remove("show-eng", "show-base"); p.classList.add("show-" + x.dataset.tab);
      $$("[data-tab]", v).forEach((y) => y.setAttribute("aria-pressed", String(y === x)));
    }));
    void N;
  }

  // ------------------------------------------------ 요약
  const isScalar = (x) => x == null || ["string", "number", "boolean"].includes(typeof x);
  function cell(x) {
    if (x == null) return `<td>—</td>`;
    if (typeof x === "number") return `<td class="n">${Number.isInteger(x) ? x.toLocaleString() : x.toFixed(2)}</td>`;
    if (typeof x === "boolean") return `<td>${x ? "예" : "아니오"}</td>`;
    if (typeof x === "object") return `<td>${esc(JSON.stringify(x))}</td>`;
    return `<td>${esc(x)}</td>`;
  }
  function tableOf(objs) {
    const cols = []; objs.forEach((o) => Object.keys(o).forEach((k) => { if (!cols.includes(k)) cols.push(k); }));
    return `<div class="tbl-wrap"><table><thead><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${objs.map((o) => `<tr>${cols.map((c) => cell(o[c])).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function tableCols(cols, rows) {
    return `<div class="tbl-wrap"><table><thead><tr>${cols.map((c) => `<th>${esc(typeof c === "object" ? (c.label || c.key) : c)}</th>`).join("")}</tr></thead><tbody>${rows.map((r) =>
      `<tr>${cols.map((c, i) => cell(Array.isArray(r) ? r[i] : r[typeof c === "object" ? c.key : c])).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function renderAny(v, depth) {
    depth = depth || 0;
    if (Array.isArray(v)) {
      if (v.length && v.every((x) => x && typeof x === "object" && !Array.isArray(x))) return tableOf(v);
      if (v.length && v.every(Array.isArray)) return tableCols(v[0], v.slice(1));
      return `<ul>${v.map((x) => `<li>${renderAny(x, depth + 1)}</li>`).join("")}</ul>`;
    }
    if (v && typeof v === "object") {
      if (Array.isArray(v.columns) && Array.isArray(v.rows)) {
        return (v.title ? `<h3>${esc(v.title)}</h3>` : "") + tableCols(v.columns, v.rows) + (v.note ? `<p style="color:var(--muted);font-size:13px">${esc(v.note)}</p>` : "");
      }
      const vals = Object.values(v);
      if (vals.length > 1 && vals.every((x) => x && typeof x === "object" && !Array.isArray(x) && Object.values(x).every(isScalar))) {
        return tableOf(Object.entries(v).map(([k, x]) => Object.assign({ "": k }, x)));
      }
      const sc = Object.entries(v).filter(([, x]) => isScalar(x));
      const nested = Object.entries(v).filter(([, x]) => !isScalar(x));
      return (sc.length ? `<dl class="kv">${sc.map(([k, x]) => `<dt>${esc(k)}</dt><dd>${esc(x == null ? "—" : x)}</dd>`).join("")}</dl>` : "")
        + nested.map(([k, x]) => `<div><h3>${esc(k)}</h3>${renderAny(x, depth + 1)}</div>`).join("");
    }
    return esc(v);
  }
  // summary.json의 판 이름("엔진 50-a", "E16-b", "기준선 16턴")을 판 id로
  function runFromName(s) {
    s = String(s || "");
    let m = /(엔진|기준선)\s*(\d+)\s*[-턴]?\s*([abc])?/i.exec(s) || null;
    let kind, turns, persona;
    if (m) { kind = m[1] === "엔진" ? "engine" : "baseline"; turns = +m[2]; persona = m[3]; }
    else if ((m = /^([EB])(\d+)-([abc])$/i.exec(s))) { kind = m[1].toUpperCase() === "E" ? "engine" : "baseline"; turns = +m[2]; persona = m[3]; }
    else return null;
    turns = turns <= 20 ? 15 : 50;
    const group = /수정 후/.test(s) && GROUPS.includes("수정 후") ? "수정 후" : GROUPS[0];
    return RUNS.find((r) => r.kind === kind && r.turns === turns && (!persona || r.persona === persona.toUpperCase()) && r.group === group) || null;
  }
  const GROUP_NAMES = { 1: "시간", 2: "지난 만남 회수", 3: "비밀", 4: "관계", 5: "이벤트", 6: "코드 거절·가드레일", 7: "반복·버릇", 8: "호칭·말투", 9: "기타", 10: "비용·지연" };
  function metricTable(t) {
    const cols = t.columns || [];
    let last = null;
    const body = t.rows.map((r) => {
      const mm = /^(\d+)\s+(.*)$/.exec(r.metric || ""); const g = mm ? mm[1] : null; const name = mm ? mm[2] : r.metric;
      let head = "";
      if (g !== last) { head = `<tr><th colspan="${cols.length + 1}" style="background:var(--bg);color:var(--ink)">${esc(g)} ${esc(GROUP_NAMES[g] || "")}</th></tr>`; last = g; }
      return head + `<tr><td style="min-width:220px">${esc(name.trim())}</td>${(r.cells || []).map((c) => `<td class="n" style="white-space:normal">${esc(c)}</td>`).join("")}</tr>`;
    }).join("");
    return `<div class="tbl-wrap"><table><thead><tr><th>지표</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table></div>`;
  }
  function labelTable(lb) {
    const cols = Object.keys(lb); const labels = [];
    cols.forEach((c) => Object.keys(lb[c] || {}).forEach((l) => { if (!labels.includes(l)) labels.push(l); }));
    return `<div class="tbl-wrap"><table><thead><tr><th>호출</th>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${labels.map((l) =>
      `<tr><td>${esc(l)}</td>${cols.map((c) => { const x = (lb[c] || {})[l]; return x ? `<td class="n">${x.in_k} / ${x.out_k} / ${x.sec}s</td>` : "<td>—</td>"; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function bucketTable(bk) {
    const runs = Object.keys(bk); const bs = [];
    runs.forEach((r) => Object.keys(bk[r] || {}).forEach((b) => { if (!bs.includes(b)) bs.push(b); }));
    const head = runs.map((r) => { const x = runFromName(r); return `<th>${x ? `<a href="#${x.id}">${esc(x.label)}</a>` : esc(r)}</th>`; }).join("");
    return `<div class="tbl-wrap"><table><thead><tr><th>구간</th>${head}</tr></thead><tbody>${bs.map((b) =>
      `<tr><td>${esc(b)}</td>${runs.map((r) => { const x = (bk[r] || {})[b]; return x ? `<td class="n">${kfmt(x.input)} <span style="color:var(--muted)">[캐시 ${kfmt(x.cached)}, 출력 ${(x.output / 1000).toFixed(2)}k, ${x.lat}s]</span></td>` : "<td>—</td>"; }).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function memoryTable(lm) {
    const rows = [];
    lm.forEach((x) => (x.tests || []).forEach((t, i) => {
      const r = runFromName(x.run);
      const bad = /틀림/.test(t.verdict || ""); const weak = /\*/.test(t.verdict || "");
      rows.push(`<tr><td>${i ? "" : (r ? `<a href="#${r.id}">${esc(x.run)}</a>` : esc(x.run))}</td><td>${i ? "" : esc(x.fact)}</td>
        <td class="n">${r ? `<a href="#${r.id}-${t.turn}">T${t.turn}</a>` : "T" + esc(t.turn)}</td>
        <td><span class="tone ${bad ? "fail" : weak ? "note" : "ok"}">${esc(t.verdict)}</span></td><td>${esc(t.note)}</td></tr>`);
    }));
    return `<div class="tbl-wrap"><table><thead><tr><th>판</th><th>원래 사실</th><th>질문 턴</th><th>판정</th><th>근거</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
  }
  function perRunTable(pr) {
    const runs = Object.keys(pr); const keys = [];
    runs.forEach((r) => Object.keys(pr[r] || {}).forEach((k) => { if (!keys.includes(k)) keys.push(k); }));
    const val = (x) => x == null ? "—" : typeof x === "object" ? JSON.stringify(x) : String(x);
    return `<div class="tbl-wrap"><table><thead><tr><th>필드</th>${runs.map((r) => { const x = runFromName(r); return `<th>${x ? `<a href="#${x.id}">${esc(r)}</a>` : esc(r)}</th>`; }).join("")}</tr></thead><tbody>${keys.map((k) =>
      `<tr><td class="mono" style="font-size:12px">${esc(k)}</td>${runs.map((r) => `<td style="font-size:12px;min-width:120px;overflow-wrap:anywhere">${esc(val((pr[r] || {})[k]))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  function summaryBlocks(S) {
    const known = new Set(["table", "labels", "buckets", "long_memory", "per_run"]);
    const out = [];
    if (S.table && Array.isArray(S.table.rows) && S.table.rows.length && S.table.rows[0].cells) out.push(`<div><h3>엔진과 기준선 지표</h3>${metricTable(S.table)}</div>`);
    else if (S.table) out.push(`<div><h3>표</h3>${renderAny(S.table)}</div>`);
    if (Array.isArray(S.long_memory)) out.push(`<div><h3>장기 기억 시험 (수작업 판정)</h3>${memoryTable(S.long_memory)}</div>`);
    if (S.labels) out.push(`<div><h3>LLM 호출별 턴당 평균 <span style="font-weight:400;color:var(--muted);font-size:13px">입력 k / 출력 k / 호출당 초</span></h3>${labelTable(S.labels)}</div>`);
    if (S.buckets) out.push(`<div><h3>50턴 판, 10턴 구간별 턴당 입력 토큰</h3>${bucketTable(S.buckets)}</div>`);
    Object.keys(S).filter((k) => !known.has(k)).forEach((k) => out.push(`<div><h3>${esc(k)}</h3>${renderAny(S[k])}</div>`));
    if (S.per_run) out.push(`<details class="sys"><summary>판별 원자료 (per_run) 펼치기</summary>${perRunTable(S.per_run)}</details>`);
    if ((DATA.summary_notes || []).length) out.push(`<details class="sys" open><summary>매칭 규칙·측정 약점</summary><ul style="margin:6px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2);display:grid;gap:4px;max-width:90ch">${DATA.summary_notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></details>`);
    return out.join("");
  }
  function renderSummary() {
    const v = $("#v-summary");
    let ext;
    try {
      ext = DATA.summary
        ? `<div style="display:grid;gap:16px"><div class="sec-h"><h2>정량 비교</h2><span>${esc(DATA.summary_src || "review/summary.json")}</span></div>${Array.isArray(DATA.summary) ? renderAny(DATA.summary) : summaryBlocks(DATA.summary)}</div>`
        : `<div class="pending"><b>정리 중</b>review/summary.json이 아직 없다. 들어오면 다시 빌드할 때 여기에 정량 표가 붙는다.</div>`;
    } catch (err) {
      ext = `<div class="pending"><b>정리 중</b>summary.json 형식을 읽지 못했다(${esc(err.message)}). 아래 표는 로그에서 바로 센 값이다.</div>`;
    }
    const rows = RUNS.map((r) => {
      const s = STATS[r.id]; const eng = r.kind === "engine";
      return `<tr><td><a href="#${r.id}">${esc(r.label)}</a></td><td>${eng ? "엔진" : "기준선"}</td><td>${esc(r.group)}</td><td class="n">${r.n}</td><td class="n">${eng ? esc(r.clock0) + "–" + esc(r.clock1) : "—"}</td>
        <td class="n">${s.avgLen}</td><td class="n">${kfmt(s.avgI)} / ${kfmt(s.avgO)}</td><td class="n">${s.avgSec.toFixed(1)}</td>
        <td class="n">${eng ? `${s.ev} (${s.forced})` : "—"}</td><td class="n">${eng ? `${s.det} (${s.prior})` : "—"}</td><td class="n">${eng ? s.leak : "—"}</td><td class="n">${eng ? s.rej : "—"}</td><td class="n">${eng ? s.ep : "—"}</td>
        <td>${eng ? esc((r.final || {}).stage) : "—"}</td></tr>`;
    }).join("");
    const own = `<div><div class="sec-h"><h2>로그에서 바로 센 값</h2><span>빌드할 때 로그를 그대로 센다</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>판</th><th>종류</th><th>묶음</th><th>턴</th><th>시각</th><th>도하 대사 평균(자)</th><th>턴당 입력/출력 tok</th><th>턴당 초</th><th>이벤트(코드)</th><th>떡밥 확정(지난 만남)</th><th>비밀 새어 나감</th><th>코드 거절</th><th>기억 묶음</th><th>최종 단계</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
    v.innerHTML = `<div class="sum">${ext}${own}</div>`;
  }

  // 시작
  const lastRun = store.get("ot-run", null); if (lastRun && BY[lastRun]) $("#nav-run").href = "#" + lastRun;
  const lastPair = store.get("ot-pair", null); if (lastPair && BY[lastPair]) $("#nav-pair").href = "#pair-" + lastPair;
  if (!PAIRS.length) $("#nav-pair").hidden = true;
  $("#brand-title").textContent = SC.title;
  const topEl = $(".top");
  const setTop = () => document.documentElement.style.setProperty("--toph", topEl.offsetHeight + "px");
  setTop();
  if (window.ResizeObserver) new ResizeObserver(setTop).observe(topEl); else window.addEventListener("resize", setTop);
  window.addEventListener("hashchange", route);
  route();
})();
</script>
