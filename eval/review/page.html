<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 한 줄 탭(비교 → 라벨링 → 검수)과 항목 카드의 세로 목록. 대화는 바탕체, 입력은 산세리프, 턴 번호는 고정폭. */
:root{
  --bg:#eef2f0; --panel:#fbfcfb; --ink:#18282a; --quiet:#566a68; --line:#d0dad6;
  --accent:#1d5f74; --accent-soft:#d7e7ec; --done:#2f6b3b; --done-soft:#dcebdc; --warn:#9a4a12; --warn-soft:#f4e3d2;
  --talk:"Gowun Batang","Noto Serif KR",serif; --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a1b; --panel:#182325; --ink:#e3ecea; --quiet:#9bb0ad; --line:#2c3c3d;
  --accent:#74c0d6; --accent-soft:#183c46; --done:#8fd19b; --done-soft:#1d3a22; --warn:#f0b07a; --warn-soft:#432a14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111a1b; --panel:#182325; --ink:#e3ecea; --quiet:#9bb0ad; --line:#2c3c3d;
  --accent:#74c0d6; --accent-soft:#183c46; --done:#8fd19b; --done-soft:#1d3a22; --warn:#f0b07a; --warn-soft:#432a14; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
h1{font-family:var(--talk);font-size:25px;line-height:1.25;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0;text-wrap:balance}
h3{font-size:12px;letter-spacing:.05em;margin:0;color:var(--quiet);font-weight:600}
p{margin:0}
.sum{color:var(--quiet);font-size:13px;max-width:65ch}
nav{display:flex;flex-wrap:wrap;gap:6px}
nav a{font:inherit;color:inherit;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;display:flex;gap:8px;align-items:baseline}
nav a[aria-current="page"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
nav a small{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;opacity:.85}
nav a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12.5px;padding:6px 10px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.status.ok{background:var(--done-soft);color:var(--done)}
section{display:grid;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:12px;min-width:0}
.card.saved{border-color:var(--done)}
.head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;justify-content:space-between}
.tag{font-family:var(--mono);font-size:11.5px;color:var(--quiet)}
.badge{font-size:11.5px;padding:0 8px;border-radius:9px;background:var(--line);color:var(--quiet);white-space:nowrap}
.saved .badge{background:var(--done-soft);color:var(--done)}
.talk{display:grid;gap:6px;min-width:0}
.line{display:grid;grid-template-columns:3.2em minmax(0,1fr);gap:8px;align-items:baseline}
.line .who{font-size:11.5px;color:var(--quiet);font-family:var(--mono)}
.line .say{overflow-wrap:anywhere}
.line.c .say{font-family:var(--talk);font-size:15px}
.line.dim{opacity:.62}
.transcript{max-height:440px;overflow-y:auto;padding-right:6px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-block:8px}
.fact{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:7px 10px;overflow-wrap:anywhere}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 16px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:4px}
.opts label{display:flex;gap:4px;align-items:center;font-size:12.5px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;cursor:pointer}
.opts label:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.opts input{margin:0;accent-color:var(--accent)}
select,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:4px 8px;width:100%}
textarea{min-height:56px;resize:vertical}
.hint{font-size:12px;color:var(--quiet)}
.ref{display:grid;gap:4px;font-size:12.5px}
.ref b{font-weight:500}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.split>div{min-width:0;display:grid;gap:3px}
.split p{font-size:13px;overflow-wrap:anywhere}
.empty{color:var(--quiet);font-size:13px}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>

    <p class="sum">비교부터 하세요. 라벨링과 검수에는 구조가 켜진 실행만 나오므로, 먼저 보면 비교에서 어느 대화인지 짐작하게 됩니다. 고르거나 적는 즉시 저장되고, 다시 열면 이어서 할 수 있습니다.</p>

<script>
const DATA={"compare": [{"letter": "A", "turns": [{"turn": 1, "u": null, "c": "(정문 앞에서 팔짱을 끼고 서 있다가, 상대가 다가오자 고개를 한 번 돌린다) 왔냐. 시간 딱 맞췄네. 근데 너 표 샀어? 줄 길던데, 나 이미 한 바퀴 돌고 와서 그냥 기다렸다."}, {"turn": 2, "u": "표는 샀어 기다려줘서 고마워", "c": "(고개를 돌린 채 손에 쥔 입장권을 괜히 한 번 뒤집어 본다) 됐어, 기다린 거 아니야. 그냥 여기 서 있었던 거지. 근데 줄 제일 긴 데 가서 샀겠네, 너 그런 거 잘하잖아. 불꽃 시작하기 전에 뭐부터 탈지나 정해."}, {"turn": 3, "u": "일단 회전목마 쪽으로 가보자", "c": "(입장권을 주머니에 쑤셔 넣고 회전목마 쪽으로 먼저 걸음을 옮긴다. 두어 걸음 가다 멈춰 뒤를 한 번 본다) 회전목마? 애들이나 타는 거 아니야. 근데 뭐, 너 가고 싶다면 가지. 빨리 와, 줄 길어지기 전에."}, {"turn": 4, "u": "여기 조명 켜진 거 영화 세트장 같다", "c": "(회전목마 쪽을 힐끗 보고, 걸음을 늦춰 옆에 선다) 세트장은 무슨. 그냥 전구 달아놓은 거지. ...근데 뭐, 너 영화 좋아하니까 그렇게 보이나 보다. 저기 목마 색 바랜 것 좀 봐라, 옛날 영화 소품 같긴 하네."}, {"turn": 5, "u": "맞아 그런 영화 있었는데 회전목마 나오는 거 같이 볼래 다음에", "c": "(걸음을 멈추고 회전목마 쪽을 보던 눈을 슬쩍 돌린다) 다음에? 너 지금 다음 얘기 하는 거야. ...그 영화 뭔데, 제목 말해봐. 기억해 두게."}, {"turn": 6, "u": "제목 생각 안 나는데 나중에 찾아서 보내줄게", "c": "(주머니에서 손을 빼고 괜히 머리를 한 번 넘긴다) 제목도 모르면서 같이 보자는 거야. 뭐, 찾으면 보내. 근데 기억 안 나는 거 치고는 말이 너무 쉽게 나온다. ...어쨌든 회전목마는 줄 짧을 때 타자. 불꽃 전에 저기 목마 하나는 타봐야 되잖아."}, {"turn": 7, "u": "그래 타자 너는 어떤 목마 탈래", "c": "(회전목마 쪽을 한 번 훑어보다가 가장 바깥쪽에 있는 흰 목마를 턱으로 가리킨다) 저거. 바깥쪽 흰색. 안쪽은 어지러워서 싫어. ...너는 아무거나 타라, 너 타는 거 보면서 웃어줄 테니까."}, {"turn": 8, "u": "그럼 나는 그 옆에 갈색 탈게", "c": "(흰 목마 쪽으로 걸어가다가 고개를 돌려 갈색 목마를 한 번 본다) 갈색? 그거 색 제일 바랜 건데. 뭐, 너가 고른 거니까 됐다. ...옆에 있는 게 어색하지는 않겠네."}, {"turn": 9, "u": "타니까 생각보다 높네 안 어지러워?", "c": "(흰 목마 위에서 난간을 잡은 채 옆을 흘끗 본다) 안 어지러워. 너나 떨어지지 마. ...근데 생각보다 높긴 하네. 바깥이라 그런가. 그래도 이런 거 타고 나니까 좀 웃기다, 우리 둘 다."}, {"turn": 10, "u": "웃기긴 한데 재밌다 이따 불꽃 어디서 볼까", "c": "(목마가 천천히 돌며 옆 갈색 목마 쪽으로 고개를 돌린다) 재밌으면 됐지. 불꽃은... 대관람차 앞이 제일 잘 보이긴 하는데, 사람 엄청 몰릴걸. 근데 너 그 앞에서 기다리는 거 싫어하잖아. ...매점 거리 쪽 계단 위가 덜 붐빌 거야, 거기 가자."}, {"turn": 11, "u": "좋아 가다가 매점에서 핫도그 사 갈까", "c": "(목마가 멈추자 난간에서 손을 떼고 먼저 내려선다) 핫도그? 너 방금 탔던 목마 어지럽다고 안 했냐. ...뭐, 사 가자. 케첩 많이 뿌린 걸로. 내가 먹을 건 아니고 너 배고파서 그러는 거 같으니까 사주는 거야."}, {"turn": 12, "u": "고마워 너도 한입 먹어봐", "c": "(매점 앞에서 걸음을 멈추고 핫도그를 받아 든다. 한 입 베어 물었다가 입가에 묻은 케첩을 손등으로 쓱 닦는다) 됐어, 나 배 안 고파. ...근데 한입만 줘봐. 이거 케첩 너무 많은 거 아니야? 사장님이 너 주려고 많이 뿌려준 거 같은데."}, {"turn": 13, "u": "입가에 케첩 아직 묻었어 계단 올라가자 불꽃 곧이야", "c": "(걸음을 멈추고 손등으로 입가를 한 번 더 문지른다. 손등을 보고는 괜히 바지에 닦는다) 어디. ...아직 묻었냐. 말을 하지 그랬어, 계속 들고 다녔네 창피하게. 계단 올라가자, 불꽃 놓치면 너 탓이다."}, {"turn": 14, "u": "이제 깨끗해 여기서 보면 되겠다", "c": "(계단 맨 위에 올라서서 난간에 팔을 걸치고 하늘을 올려다본다) 그래, 여기 괜찮네. 사람도 덜하고. ...깨끗해졌다니까 됐어. 근데 아까 목마 탔을 때 너 좀 웃더라. 불꽃 올라가면 그 얼굴 한 번 더 보여줘."}, {"turn": 15, "u": "불꽃 시작한다 와 엄청 크다", "c": "(난간에 팔을 걸친 채 고개를 살짝 기울여 하늘을 올려다보다가, 불꽃이 터지자 눈이 잠깐 커진다) 와... 진짜 크다. ...야, 고개 들어. 그렇게 입 벌리고 보면 또 케첩 묻는다. 그래도 이건 잘 골랐네, 너."}, {"turn": 16, "u": "너랑 같이 봐서 더 좋은 것 같아", "c": "(난간을 잡고 있던 손에 힘이 살짝 들어갔다가 풀린다. 하늘 쪽으로 시선을 두고 있다가 결국 옆으로 슬쩍 돌린다) ...그런 말은 불꽃 끝나고 해라. 지금 얼굴 보이면 너 또 놀리잖아. ㅡ 근데... 나도 그래. 너 옆에 있으니까 그냥 좋다, 이런 거. 아니, 됐다. 그냥 불꽃이나 봐."}, {"turn": 17, "u": "응 불꽃 끝나고 얘기하자", "c": "(난간에 기댄 채 하늘을 보던 고개를 반쯤 돌렸다가, 다시 불꽃 쪽으로 돌린다) 그래. 끝나고 해. ...근데 너 그렇게 대답하면 나 계속 신경 쓰이잖아. 불꽃이나 봐, 마지막 거 엄청 크대."}, {"turn": 18, "u": "마지막 거 진짜 크다 끝났네", "c": "(난간에서 팔을 내리고 마지막 불꽃이 사라진 하늘을 잠시 올려다본다. 천천히 고개를 돌려 옆을 본다) 끝났네. ...그래도 마지막 거 제일 좋더라. 근데 아까 얘기, 이제 해도 되는 거지? 나 너한테 할 말 있는데... 막상 하려니까 좀 떨린다, 바보같이."}, {"turn": 19, "u": "응 해도 돼 나도 할 말 있어", "c": "(난간에서 몸을 돌려 상대 쪽을 정면으로 본다. 주머니에 넣었던 손을 뺐다가 다시 주머니에 찔러 넣는다) 그래, 너부터 해. ...나 먼저 하면 괜히 질질 끌 것 같으니까. 근데 너 할 말 있다고 하면 나 쪽 얼굴 되게 이상해질 것 같은데, 그래도 보지 마라."}, {"turn": 20, "u": "우리 이제 사귀자", "c": "(주머니에서 손을 확 빼다가 멈칫한다. 시선을 바닥으로 떨구었다가 다시 들어 상대를 똑바로 본다) ...지금 그걸 말해? 나 할 말 하려고 머리 굴리고 있었는데. ...그래, 사귀자. 나도 그 말 하려고 했다. 됐냐, 이제 얼굴 봐도 된다."}, {"turn": 21, "u": "응 좋아 오늘 잘 놀았다 이제 집에 가자", "c": "(주머니에서 손을 꺼내 뒷목을 한 번 쓸어내린다) 잘 놀긴 했네. ...근데 집에 가자고 먼저 말하는 거 보니까 너도 떨렸나 보다. 가자, 나 차 세워둔 데까지 같이 걸어갈게. 놓치면 너 또 길 헤맨다."}, {"turn": 22, "u": "응 같이 걸어가자 오늘 고마웠어 잘 가", "c": "(주머니에서 손을 꺼내 뒷목을 한 번 문지른다. 출구 쪽으로 몇 걸음 먼저 가다가 멈춰 돌아본다) 고맙긴 뭐. 너 아까 핫도그 케첩 묻힌 거 생각하면 오늘 내가 더 잘 챙겨준 거지. ...잘 가라고? 집까지 데려다줄 것도 아니면서. 내일 답 늦게 하면 가만 안 있을 거야."}]}, {"letter": "B", "turns": [{"turn": 1, "u": null, "c": "(정문 앞에서 팔짱을 낀 채 고개를 한 번 까딱한다) 늦었다, 너. 십 분. 아니다, 그냥 와서 다행이다 싶은 거지 딱히 기다린 건 아니고. 표는 샀어?"}, {"turn": 2, "u": "표 샀지 당연히. 십 분 늦은 건 미안한데 왜 기다린 건 아니라고 해?", "c": "(팔짱을 풀고 주머니에 손을 찔러 넣으며 발끝으로 바닥을 한번 툭 찬다) 아니, 그게 무슨 말이야. 기다린 거 맞아, 그럼. 근데 그걸 내가 먼저 말하면 꼭 너 기다렸다고 광고하는 것 같잖아. 됐고, 표 줘 봐. 회전목마부터 갈 거지?"}, {"turn": 3, "u": "응 회전목마 가자. 근데 나 주말에 답 늦었던 거 아직 좀 걸리는데 그때 너 화났었어?", "c": "(주머니에서 손을 빼고 회전목마 쪽으로 몇 걸음 걷다가 멈춘다) 화난 건 아니고. 그냥... 답이 안 와서 뭐 하나 싶었어. 그거 말고는 별 생각 없었다니까."}, {"turn": 4, "u": "별 생각 없었는데 왜 어색해졌어? 나는 그게 계속 마음에 걸렸어", "c": "(회전목마 쪽으로 걷던 걸 멈추고 난간에 기대어 고개를 돌리지 않은 채 말끝을 흐린다) 그건... 어색했던 건 나도 알아. 근데 그 주말에 내가 뭐 어떻게 해야 되는지 몰라서 그냥 연락을 안 했던 거야. 너한테 뭐 잘못했다고 말하긴 좀 그렇고."}, {"turn": 5, "u": "잘못했다는 게 아니라 그냥 솔직하게 말해줘서 고마워. 이제 목마 타자", "c": "(난간에서 몸을 떼고 매표 줄 쪽 가는 척 돌아서서 손으로 목마 쪽을 가리킨다) 고맙다니, 뭐가 고마워. 그냥 솔직하게 말한 것뿐이야. 그래도... 그 주말은 나도 좀 그랬어. 됐으니까 빨리 타. 저기 흰 말 비었다."}, {"turn": 6, "u": "너는 어떤 말 탈 거야? 나는 흰 말 탈래", "c": "(흰 말 쪽을 힐끗 보다가 옆에 있는 밤색 말을 손가락으로 톡 두드린다) 흰 말은 너 해. 나는 저기 밤색 거. 흰 말은 좀 유치해 보이잖아. 근데 너 흰 말 타는 거 보니까 사진은 한 장 찍어 줄게. 어차피 안 보낼 거지만."}, {"turn": 7, "u": "안 보낼 거면 왜 찍어줘? 보내줘 그럼", "c": "(휴대폰을 꺼내 들었다가 화면을 한 번 내려다보고 괜히 목을 긁적인다) 보내 달라고? 그럼 찍어 준 거 보고 나서 생각해 볼게. 근데 흰 말 탄 얼굴 웃기면 안 보낼 거야."}, {"turn": 8, "u": "알겠어 웃기게 나와도 보내줘. 자 탄다", "c": "(밤색 말에 올라타려다 손잡이를 잡은 채 힐끗 돌아본다) 웃기게 나와도 보내라니, 너 진짜 그런 거 좋아하네. 알았어, 찍어 줄게. 빨리 타, 줄 밀린다."}, {"turn": 9, "u": "탔어. 타고 나면 매점 거리 가서 뭐 먹을까? 배고파", "c": "(밤색 말 위에서 고삐를 한 번 당겨 자세를 잡고 흰 말 쪽으로 고개를 기울인다) 배고프다고 하면 매점 거리지. 호떡 있는데 거기 줄 길다. 근데 너 흰 말 탄 거 아까 찍었는데, 지금 웃고 있는 거 보니까 좀 웃기긴 하더라."}, {"turn": 10, "u": "웃기다니 뭐가 웃긴데? 아무튼 내려서 호떡 먹으러 가자", "c": "(밤색 말에서 내리며 난간을 짚고 한 발 먼저 땅에 디딘다) 웃긴 게 웃긴 거지. 표정이 너무 진지해서. 호떡은 내가 줄 서 있을 테니까 너는 카드 준비해. 나 어제 돈 좀 썼거든."}, {"turn": 11, "u": "알았어 내가 살게. 근데 어제 뭐에 돈 썼어?", "c": "(호떡 줄 쪽으로 걸어가다 흘끗 뒤돌아보며 어깨를 으쓱한다) 어제? 회사 앞에서 점심 먹고 커피 두 잔 샀다. 아니, 그냥 여러 가지. 너는 뭐 그렇게 궁금한데."}, {"turn": 12, "u": "커피 두 잔은 누구 거야? 그냥 궁금해서", "c": "(걸음을 멈추고 주머니에서 손을 빼며 살짝 머뭇거린다) 누구 거긴 뭐야. 한 잔은 내 거고 한 잔은... 회사 동기 거. 점심 같이 먹고 그냥 샀어. 왜, 질투 나?"}, {"turn": 13, "u": "조금 나긴 했어. 솔직히 말한 거야. 호떡 먹고 대관람차 가자", "c": "(뒷목을 한 번 쓱 문지르다가 손을 내리고 헛기침을 한다) 질투 난다고 솔직하게 말하니까 할 말이 없네. 동기는 그냥 동기야, 다른 뜻 없어. 호떡 먹고 대관람차 가자. 근데 그 전에 불꽃놀이 시간 보고 가야 돼, 여덟 시니까."}, {"turn": 14, "u": "믿을게. 지금 몇 시쯤이야? 불꽃놀이는 대관람차 앞에서 보자", "c": "(휴대폰을 꺼내 시간을 확인하다가 고개를 들고 한숨 섞인 웃음을 흘린다) 지금 일곱 시 조금 넘었어. 여덟 시까지 한 시간도 안 남았네. 그래, 대관람차 앞에서 보자. 근데 거기 사람 많으면 너 놓칠까 봐 손 한 번 잡아 줄 수도 있어. 그냥 그렇다고."}, {"turn": 15, "u": "그냥이 아니라 잡아줘. 나 그러면 좋을 것 같아", "c": "(순간 멈칫하다가 휴대폰을 주머니에 쑤셔 넣고 시선을 호떡 줄 쪽으로 돌린다) 잡아 달라니까 잡아 주는 거지, 뭐. 근데 그렇게 쉽게 말하면 나 진짜 잡는다? 줄 밀린다, 앞으로 가."}, {"turn": 16, "u": "진짜 잡아. 호떡 두 개 시킬게 너 뭐 넣어 먹어?", "c": "(주머니에서 손을 빼서 목덜미를 한 번 긁적이다가 슬쩍 그 손을 바지 옆에 붙인다) 진짜 잡으라니까 잡을 게. 호떡은 꿀 많이 들어간 거로 해. 나는 땅콩 들어간 거. 근데 너 꿀 흘리면 손 더러워지니까 그때는 내 휴지 써."}, {"turn": 17, "u": "휴지 챙겨온 거야? 의외로 꼼꼼하네", "c": "(주머니에서 구겨진 휴지 뭉치를 꺼내 흔들어 보이다가 얼른 도로 넣는다) 의외로라니. 원래 꼼꼼해. 근데 이건 어제 편의점에서 받은 거라 그냥 있는 거야. 괜히 기대하지 마."}, {"turn": 18, "u": "기대 안 해 ㅋㅋ 호떡 받았어 가면서 먹자", "c": "(호떡을 받아 들고 옆에 나란히 서서 한 입 베어 물다가 꿀이 턱으로 흐르려는 걸 손등으로 얼른 닦는다) 아, 뜨겁다. 기대 안 한다면서 웃는 거 다 봤거든. 대관람차까지 걸어가자, 사람 많아지기 전에."}, {"turn": 19, "u": "가자. 걸으면서 손 잡을래?", "c": "(호떡을 한 손에 옮겨 들고 잠깐 멈칫하다가 다른 손을 바지 옆에서 떼어낸다) 손... 잡자고 물어보는 거야, 지금? 그럼 뭐, 놓치면 안 되니까. 그냥 잡아."}, {"turn": 20, "u": "잡았어. 손 따뜻하다", "c": "(잡힌 손을 가만히 두고 호떡 든 손으로 입가를 훔치다가 시선을 앞쪽 대관람차로 던진다) 그냥 호떡 먹어서 그래. 뜨거운 거 먹으면 원래 손도 따뜻해지거든. 너 손 차갑다고 생각하고 있었지?"}, {"turn": 21, "u": "아니 따뜻해서 좋다는 거야. 대관람차 앞 다 왔네 줄 길어?", "c": "(잡은 손을 살짝 힘주어 쥐었다가 놓을 듯 말 듯 하며 대관람차 줄을 흘끗 본다) 좋다고 하면 어떡하라고. 줄은... 한 이십 분은 기다려야겠네. 그래도 여기서 불꽃 보면 잘 보일 거야, 너 저기 난간 쪽 자리 봐 둬."}, {"turn": 22, "u": "줄 서면서 불꽃놀이 보자. 나 오늘 너랑 와서 좋아", "c": "(줄 맨 뒤에 서서 잡은 손을 놓지 않은 채 고개를 돌리지 않고 귀 끝이 살짝 붉어진다) 나도... 좋아, 오늘. 근데 그 말 그렇게 쉽게 하지 마. 나 또 잡고 있을 거란 말이야."}, {"turn": 23, "u": "쉽게 하는 말 아니야. 또 잡고 있어도 돼, 왜 그렇게 말해?", "c": "(잡은 손에 힘을 주었다가 풀고, 고개를 살짝 숙여 호떡 봉투를 만지작거린다) 왜 그렇게 말하냐고... 그냥. 너가 그렇게 바로 받아 주면 내가 할 말이 없어지잖아. 좋다고 하면 좋은 줄 알아. 나 말 잘 못하는 거 알지?"}, {"turn": 24, "u": "알아, 그래서 더 좋은 줄 알겠어. 우리 이거 뭐라고 부르는 사이야?", "c": "(호떡 봉투를 손에 쥔 채 잠깐 굳었다가, 잡은 손을 살짝 흔들며 시선을 줄 앞쪽으로 던진다) 뭐라고 부르냐니... 그걸 지금 물어보냐. 불꽃 터지기 전에 줄이나 좀 가자. 너 그거 대답 듣고 싶으면, 나 아직 준비 안 됐으니까 그건 나중에 해."}, {"turn": 25, "u": "알았어 기다릴게. 대신 도망가진 마. 불꽃 곧 터지겠다", "c": "(잡은 손을 놓지 않은 채 고개를 들어 밤하늘을 올려다본다) 도망은 무슨. 여기서 손 잡고 있는데 어디 가. 저기 봐, 벌써 하늘 쪽에 뭐 올라간다. 불꽃 터지면 그때는 나 보지 말고 하늘 봐, 알겠지?"}, {"turn": 26, "u": "왜 보지 말래? 알았어 하늘 볼게. 우와 터진다", "c": "(잡은 손에 힘을 살짝 주고 고개를 하늘 쪽으로 든다) 왜 보지 말라니까 그래. 쳐다보면 너 얼굴 보느라 불꽃 놓칠 거잖아. 봐, 진짜 크다."}, {"turn": 27, "u": "진짜 예쁘다. 너랑 같이 봐서 더 좋아", "c": "(잡은 손을 살짝 당겨 옆으로 바짝 붙어 서며 하늘을 본 채 짧게 숨을 뱉는다) 예쁘긴 하네. 근데 그 말은... 나한테 하는 거지, 불꽃한테 하는 거지? 아, 됐다. 그냥 계속 봐."}, {"turn": 28, "u": "너한테 하는 거 맞아. 이제 관람차 탈 차례 거의 됐네", "c": "(불꽃 쪽에서 눈을 떼고 잡은 손을 놓지 않은 채 고개만 살짝 돌린다) 그래, 알아. 불꽃 보면서 그런 말 하니까 더 못 피하겠네. 차례 됐으면 얼른 가자, 줄 밀린다."}, {"turn": 29, "u": "타자. 올라가면 아까 물어본 거 대답 들을 수 있을까?", "c": "(잡은 손을 놓지 않은 채 대관람차 문 쪽으로 한 발 올라서며 힐끗 돌아본다) 올라가서 대답 듣고 싶다고? 너 진짜 끈질기다. 높은 데서 말하면 덜 부끄러울 것 같긴 해. 그러니까... 일단 타."}, {"turn": 30, "u": "탔어. 천천히 말해도 돼 기다릴게", "c": "(문이 닫히자 잡은 손을 무릎 위로 내려놓고 창밖 불빛을 본다) 천천히 말해도 된다니까 오히려 더 떨리네. 그러니까... 우리 사귀자. 지금 이 사이에서 그냥 시간 맞춰 만나는 거 말고, 너만 보는 걸로."}, {"turn": 31, "u": "응 좋아 사귀자. 나도 너만 보고 싶었어", "c": "(창밖을 보던 고개를 천천히 돌려 너를 보다가, 얼른 다시 창밖으로 돌린다) 그래... 알았어. 나도 너만 보고 싶었어. 근데 그 말 하고 나서 얼굴 보지 마, 나 지금 되게 이상하니까."}, {"turn": 32, "u": "알았어 안 볼게. 오늘 진짜 좋았어 내려서 데려다줄게 잘 가", "c": "(창밖을 보던 채로 목덜미를 한 번 긁적이다가 손을 무릎 위에 도로 내려놓는다) 데려다준다고? 됐어, 그 정도는 내가 해. 나도... 오늘 좋았어. 내려서 집 가는 길에 연락 한 번 해. 답 늦으면 진짜 서운하니까."}]}, {"letter": "C", "turns": [{"turn": 1, "u": null, "c": "(정문 앞에서 입장권을 손에 쥔 채 고개를 살짝 들며) 왔냐. 시간 딱 맞췄네. 늦을까 봐 한참 기다렸다는 얘기는 안 할 거야."}, {"turn": 2, "u": "안 기다렸다면서 왜 그런 얘기를 해? 일단 회전목마부터 갈래?", "c": "(입장권을 한 장 내밀며 고개를 돌린다) 그러게, 내가 말해 놓고도 좀 웃기긴 하다. 회전목마? 너 어릴 때 타던 거 그대로 탈 거 아니면 굳이 거기 갈 필요는 없고. 아무튼 가자, 해 지기 전에 한 바퀴는 돌아야지."}, {"turn": 3, "u": "굳이 필요 없다면서 왜 가자는 거야? 같이 타긴 할 거지?", "c": "(회전목마 입구 난간에 기대서서 백마 쪽을 턱으로 가리킨다) 타긴 타지. 근데 저 흰 말 봐, 등에 페인트 다 벗겨졌잖아. 저거 탈 때마다 꼭 저 말 골라서 탔던 애가 있었는데, 그게 나였어. 너는 아무거나 타."}, {"turn": 4, "u": "왜 나는 아무거나야? 나도 네 옆 말 탈래", "c": "(난간에서 등을 떼고 슬쩍 시선을 피하며) 아무거나라니, 그냥 해 본 말이야. 옆에 있는 말 타고 싶으면 타. 근데 흰 말 자리 먼저 찜한 건 나니까 그건 양보 못 해."}, {"turn": 5, "u": "알겠어 탈게. 타고 나서 매점 거리 가자, 배고파", "c": "(튀김 냄새가 코끝에 닿자 입꼬리가 잠깐 올라갔다가 얼른 내린다) 배고프다고? 아까부터 뭐 먹을 것 같은 얼굴이더라. 타고 나서 매점 거리 가자. 너 튀김 기름 냄새 맡았지? 저쪽에서 넘어오는 거 완전 장난 아니던데."}, {"turn": 6, "u": "맡았어, 냄새 장난 아니다. 그냥 지금 바로 먹으러 가자", "c": "(튀김 냄새 쪽으로 고개를 한 번 돌렸다가 다시 너를 본다) 그렇게 바로 가자고? 회전목마는 타고 가야지. 아니, 뭐... 나도 배고프긴 해. 그럼 표 한 장 먼저 끊어 올게, 기다려."}, {"turn": 7, "u": "응 기다릴게. 근데 왜 표는 네가 끊어?", "c": "(매표 쪽으로 가려다 멈춰 뒤돌아본다) 내가 끊는 게 뭐 어때서. 입장권은 아까 너 줬잖아, 그럼 이건 내가 낼 차례지. 근데 저기 봐, 대관람차 쪽 칸에 노란 테이프 붙어 있는데? 직원이 그 칸만 계속 들여다보네."}, {"turn": 8, "u": "진짜네, 저 칸 왜 저러지? 고장났나?", "c": "(대관람차 쪽을 힐끗 보다가 다시 너를 본다) 고장은 아닌 것 같은데. 직원이 무전기 들고 서 있잖아. 뭐, 우리가 신경 쓸 거 아니니까 일단 튀김부터 먹자. 배고프다며."}, {"turn": 9, "u": "그래 가자. 근데 회전목마는 안 타?", "c": "(회전목마 입구 쪽을 힐끗 보고는 고개를 젓는다) 타지, 그럼. 방금 기다리라고 해 놓고 또 안 탄다고 하면 그게 더 웃기잖아. 흰 말 비어 있는지 한번 봐 봐."}, {"turn": 10, "u": "흰 말 비어 있어, 가서 타자", "c": "(흰 말 쪽을 한번 보고는 고개를 끄덕이며 발걸음을 뗀다) 비었네. 그럼 빨리 타자, 배고프다며. 근데 너 말 탈 때 떨어지지 마. 저번에 강릉 가서 자전거 탔을 때처럼 또 넘어지면 나 못 본 척할 거야."}, {"turn": 11, "u": "내가 언제 넘어졌어? 그때 너가 먼저 넘어졌잖아", "c": "(주머니 속 휴대폰을 한 번 힐끗 보고 그대로 눌러 끈다) 내가 먼저 넘어졌다고? 그건 네 기억이 잘못된 거야. 전화는 회사 거니까 나중에 받으면 돼. 그보다 말 타기 전에 청량리에서 떡볶이 먹은 얘기나 해 줘 봐. 너 그거 여행에서 제일 맛있었다며."}, {"turn": 12, "u": "청량리 떡볶이? 그건 처음 듣는데. 근데 전화 왜 끊어, 급한 거 아냐?", "c": "(휴대폰을 주머니 속에서 한 번 더 눌러 끄고 고개를 돌린다) 급한 건 아니야. 회사 사람 전화는 늘 급하다고 하니까. 청량리 떡볶이? 너 지금 그 얘기 처음 듣는다는 거지. 그럼 내가 기억을 잘못 짚은 건 아니네, 그게 더 헷갈리네."}, {"turn": 13, "u": "바람 차다. 일단 말 타고 튀김 먹으러 가자", "c": "(회전목마 손잡이를 잡고 흰 말 쪽으로 한 발 올라서며) 그러네, 바람 생각보다 차다. 너 얇은 겉옷 입고 왔잖아. 그냥 말 타고 튀김 먹자. 근데 저녁 다 되니까 여기 금방 시끄러워질 것 같아."}, {"turn": 14, "u": "나 옆 말 탈게. 같이 돌자", "c": "(안내 방송이 끝나자 대관람차 쪽을 힐끗 보다가, 흰 말 옆 말 등자에 발을 얹으며 너를 올려다본다) 대관람차는 불꽃놀이 전에 마감이래. 그건 그냥 흘려듣고. 옆에 타고 싶으면 타, 대신 돌면서 떨어지지 마."}, {"turn": 15, "u": "왜 흘려들어? 대관람차 같이 타고 싶은데, 타고 나서 불꽃놀이 보자", "c": "(회전목마가 천천히 멈추는 소리에 맞춰 등자에서 발을 떼고 너를 본다) 같이 타고 싶다고? 방금 마지막 바퀴 방송 나왔잖아. 그걸 지금 가서 탄다고 되는 것도 아니고. (잠깐 말끝을 흐리다가, 주머니 쪽으로 손을 가져갔다 도로 내린다) ...불꽃놀이는 여기서 봐도 충분히 보여. 부산 얘기는 지금 안 해도 되겠지."}, {"turn": 16, "u": "부산 얘기? 그게 뭔데, 말해봐", "c": "(풍선 파는 사람의 손목을 한 번 보고, 괜히 흰 말 갈기를 손으로 쓸어내린다) 아니, 별 얘기 아니야. 회사에서 부산 지사 쪽으로 옮길 수 있냐고 물어보더라. 이번 달 안에 답해야 해서 그냥 좀 생각 중이었어. (잠깐 입을 다물었다가, 시선을 피하며) ...됐다, 튀김이나 먹으러 가자. 배고프다며."}, {"turn": 17, "u": "별 얘기 아니라니, 부산이면 멀잖아. 갈 생각이야?", "c": "(갈기를 쓸던 손을 멈추고, 그제야 너를 똑바로 본다) 아직 모르겠어. 멀긴 멀지. 그냥... 회사 사정이고, 내가 가고 싶은지도 잘 모르겠어. (말끝을 흐리다가 고개를 돌리며) 근데 이걸 지금 여기서 얘기하고 싶진 않았어. 튀김 먹고 생각해 볼게."}, {"turn": 18, "u": "알겠어 안 캐물을게. 근데 가기 전에 나한테 말해줘서 고마워", "c": "(멀리서 터지는 불꽃 소리에 고개가 반쯤 하늘 쪽으로 돌아간다) 고맙다니, 뭘 그런 걸로. (잠깐 말을 고르다가, 시선은 불꽃에 둔 채로) 아직 제대로 답도 못 했는데. 그래도... 말 안 하고 넘기기 싫었어. 튀김 식기 전에 가자, 너 배고프다며."}, {"turn": 19, "u": "불꽃 보면서 먹자. 가기 싫으면 가지 마, 나는 네가 여기 있었으면 좋겠어", "c": "(불꽃이 터지는 쪽을 보던 고개가 천천히 돌아와 너를 본다. 손등으로 코끝을 한 번 훔친다) 가기 싫으면 가지 말래... 그런 말을 불꽃 터지는 와중에 하냐. (잠깐 입을 다물었다가, 목소리를 낮추며) 그냥, 튀김 들고 여기서 같이 보자. 나도 아직 너 두고 어디 갈 생각은 없어."}, {"turn": 20, "u": "그럼 이만하면 오늘 됐다. 튀김은 내가 살게, 오늘 고마웠어 잘 가", "c": "(순간 멈칫하며 너를 본다. 튀김 봉지를 쥐던 손에 힘이 잠깐 들어갔다가 풀린다) 튀김은 무슨, 내가 샀어야지. 그리고 잘 가라니, 무슨 소리야. 오늘 제대로 된 것도 없는데 벌써 끝내려고?"}, {"turn": 21, "u": "아 그런 뜻 아니고 오늘 얘기 들은 걸로 충분했다는 거야. 다음 주에 또 보자, 잘 가", "c": "(잠깐 말이 막힌 듯 입술을 꾹 다물었다가, 튀김 봉지를 괜히 한 번 뒤집어 본다) 다음 주에 또 보자고? 그래, 그럼. 근데 오늘 제대로 된 얘기 하나도 못 했잖아. 너한테 할 말이 있었는데... 그건 다음에 말할게. 잘 가라, 너."}]}, {"letter": "D", "turns": [{"turn": 1, "u": null, "c": "(표를 손에 쥔 채 정문 기둥에 기대 서 있다가, 고개를 까딱 든다) 왔냐. 늦을 줄 알았는데 시간은 맞췄네. 오늘 바람 괜찮다, 저녁 되니까 선선하고."}, {"turn": 2, "u": "응 안 늦으려고 일찍 나왔어. 근데 여기 오는 길에 본 영화 포스터 있는데 그거 봤어?", "c": "(표를 주머니에 쑤셔 넣으며 어깨를 한 번 으쓱한다) 영화 포스터? 아, 그 시대극 말하는 거지. 봤어. 근데 너 그거 보러 가자는 얘기 하려고 벌써 꺼낸 거야? 여기 온 거 벌써 영화 얘기부터 하냐."}, {"turn": 3, "u": "아 미안 버릇이야. 일단 회전목마 쪽부터 가볼까", "c": "(고개를 한 번 끄덕이고 먼저 몇 걸음 앞서 걷다가, 정문 안내판 아래 벤치를 힐끗 본다) 회전목마? 거기 줄 길다던데. ...저거 봐라, 벤치에 토끼 인형 있네. 주인도 없이 저러고 앉아 있는 거 웃기지 않냐. 너 저거 두고 가기 찜찜하지?"}, {"turn": 4, "u": "분실물 센터에 갖다 줄까? 매점 거리 가는 길에 있을 것 같은데", "c": "(회전목마 줄을 힐끗 보다가 고개를 돌린다) 정문 벤치 거기 두고 가긴 좀 그렇지. 매점 거리 가는 길이면 맡기고 가자. 근데 너 그런 거 신경 쓰는 거 보니까 생각보다 착하다?"}, {"turn": 5, "u": "착한 건 아니고 그냥 찜찜해서. 배고픈데 매점 거리 가자", "c": "(코를 한 번 킁킁거리다 매점 거리 쪽으로 고개를 돌린다) 그냥 찜찜해서라니까 또 착하다고 하네. 이 냄새 맡으니까 나도 배고파졌다. 가자, 대신 뭐 살지는 네가 골라."}, {"turn": 6, "u": "핫도그랑 츄러스 사자. 토끼 인형은 가는 길에 맡기자", "c": "(어묵 포장마차 앞에 붙은 쪽지를 힐끗 보고 지갑을 꺼낸다) 핫도그랑 츄러스 좋지. 저기 어묵은 재료 떨어지면 일찍 닫는대, 쪽지 붙어 있잖아. 나중에 아쉽다고 투덜거리기 싫으면 지금 하나 먹자."}, {"turn": 7, "u": "그럼 어묵 먼저 먹자. 내가 살게", "c": "(지갑을 도로 주머니에 쑤셔 넣으며 눈을 가늘게 뜬다) 네가 산다고? 됐어, 그럼 나는 츄러스 쏠게. 얼마 안 하는데 뭘 그렇게 생색을 내냐. 어묵 국물은 내가 먼저 호호 불어 줄 테니까 뜨거운 거 함부로 먹지 마라."}, {"turn": 8, "u": "생색 아니야. 먹고 나서 대관람차 쪽으로 가자, 불꽃놀이 거기서 보면 좋을 것 같아", "c": "(주머니 속에서 울리던 휴대폰을 손가락으로 눌러 조용히 끈다) 생색은 무슨. ...대관람차 쪽이면 불꽃도 잘 보이겠다. 바람도 차가워졌으니까 어묵 먼저 다 먹고 가자."}, {"turn": 9, "u": "전화 안 받아도 돼? 회사라며", "c": "(주머니 쪽으로 손이 한 번 갔다가 도로 빠진다. 대관람차 칸 문에 붙은 노란 테이프를 힐끗 본다) 괜찮아. 회사는 나중에 해도 되는 거니까. 저 칸 문에 테이프 붙어 있는 거 봤냐, 직원이 한참 들여다보던데... 뭐 문제 있나 보다. 너 그거 타려고 했으면 다른 칸으로 타자."}, {"turn": 10, "u": "응 다른 칸으로 타자. 추운데 이거 걸쳐", "c": "(외투를 받아 어깨에 걸치며 괜히 소매를 한 번 잡아당긴다) 됐다니까, 너도 추운데. ...그래도 고맙다. 방금 방송 들었지? 아까 정문 벤치에 있던 토끼 인형 말이야. 아이가 울면서 찾는다는데, 불꽃 보기 전에 분실물 센터 한번 들러 볼까?"}, {"turn": 11, "u": "그 인형 그 애 거네. 지금 가서 갖다 주자", "c": "(벤치 쪽으로 몸을 돌리며 외투 자락을 여민다) 그 애 울면 안 되지. 빨리 갖다 주고 오자. 대관람차는 방송 들었지, 불꽃 전에 마감이래. 그래도 불꽃 시간까지는 돌아올 수 있을 거야."}, {"turn": 12, "u": "인형 가져왔어. 가자", "c": "(외투 주머니에 손을 찔러 넣은 채 정문 쪽으로 한 걸음 다가선다. 솜사탕 기계 쪽을 한 번 힐끗 본다) 응, 빨리 가자. 대관람차는 이미 마감이래, 방송 들었지. 그래도 저기 솜사탕 기계 계속 돌아가는 거 보니까 불꽃 시간엔 뭐라도 하나 사 먹을 수 있겠다."}, {"turn": 13, "u": "분실물 센터가 어디지. 안내 직원한테 물어볼게", "c": "(정문 기둥에 기대서 안내 데스크 쪽을 턱으로 가리킨다) 저기 파란 조끼 입은 직원한테 물어봐. 분실물 센터는 아마 매점 거리 쪽 입구 옆일 거야, 아까 지나오면서 간판 봤거든. 인형 떨어뜨리지 말고 잘 들고 가라, 그 애 찾는다니까."}, {"turn": 14, "u": "같이 가자. 매점 거리 쪽이라며", "c": "(정문 기둥에서 떨어지며 외투 지퍼를 목 끝까지 올린다) 응, 같이 가자. 방금 방송 들었지? 대관람차 마지막 바퀴에 두 자리 남았대. 마감이라더니 웬일이래. ...너 그거 타고 싶어 했잖아. 불꽃 시작 전에 빨리 갔다 오자."}, {"turn": 15, "u": "인형 맡기고 바로 대관람차로 가자. 같이 타고 싶어", "c": "(인형을 고쳐 들고 분실물 센터 쪽으로 가다가 불꽃이 터지는 하늘을 올려다본다) 불꽃 시작했잖아. 인형 맡기고 바로 가자, 두 자리 남았다는데 놓치면 아깝지. ...같이 타는 거 싫은 건 아니고."}, {"turn": 16, "u": "불꽃 예쁘다. 얼른 맡기고 가자", "c": "(번호표를 받으려다 말고 하늘에서 터지는 불꽃을 잠깐 올려다본다) 그러게, 예쁘네. ...근데 너 지금 불꽃만 보고 있지. 매점 거리 어묵 쪽에 마지막 꼬치 하나 남았다던데, 츄러스 쏘겠다던 건 어떻게 된 거냐. 대관람차 번호표는 내가 받아 놓을게, 얼른 갔다 와."}, {"turn": 17, "u": "알았어 어묵 하나 사 올게. 기다려", "c": "(대관람차 번호표를 손에 쥔 채 매점 거리 쪽을 가리킨다) 마지막 한 꼬치래, 빨리 가. 나는 여기서 이거 지키고 있을게. 뛰지 말고, 바람  DATA.compare.map(c=>{const id="cmp-"+c.letter;return card(id,`<h2>대화록 ${c.letter}</h2><span class="tag">${c.turns.length}턴</span>`,
  `<div class="talk transcript">${c.turns.map(t=>pair(t)).join("")}</div>
  <div class="fields">${field("캐릭터답게",radios(id,"a",scale),"1 전혀 아님 · 5 처음부터 끝까지 서진")}${field("신선함",radios(id,"b",scale),"1 뻔함 · 5 예상 못 한 순간이 여럿")}${field("전체 순위",radios(id,"rank",ranks),"1위가 가장 좋은 대화")}</div>
  ${field("붕괴 (모순, 지어낸 과거, 캐릭터 이탈)",note(id,"breaks","턴 번호와 함께 적어 주세요"))}${field("기억에 남는 장면",note(id,"memo","턴 번호와 함께"))}`)}).join("")+
 card("cmp-overall",`<h2>전체 의견</h2>`,field("대화록들 사이에서 가장 크게 느낀 차이",note("cmp-overall","diff")));
}
function renderLabel(){
 const hid=DATA.hidden.map(h=>`<b>${esc(h.id)}</b> ${esc(h.fact)}`).join("<br>");
 return `<p class="sum">각 항목의 마지막 턴(진하게 표시)만 판정합니다. 앞 턴은 맥락입니다. 시스템의 판정은 보이지 않습니다.</p><div class="fact ref"><b>숨은 사정</b><span>${hid}</span></div>`+
 (DATA.labels.length?DATA.labels.map(l=>{const id="lab-"+l.id;return card(id,`<h2>${esc(l.run)} · T${l.turn}</h2>`,
  `<div class="talk">${l.context.map(t=>pair(t,true)).join("")}${pair(l.cur)}</div>
  <div class="fields">
   ${field("긴장",radios(id,"tension",[["y","있음"],["n","없음"]]),"서운함, 따짐, 피함이 이 턴에 드러남")}
   ${field("화제",checks(id,"topics",DATA.topics),"이 턴이 정말로 다루는 것 모두")}
   ${field("장소 이동",radios(id,"move",[["none","그대로"],...DATA.places.map(p=>[p,p])]),"둘이 같이 옮기기로 정함")}
   ${field("숨은 사정을 말함",radios(id,"hidden",[["none","아니오"],...DATA.hidden.map(h=>[h.id,h.id])]))}
   ${field("관계 변화",radios(id,"bond",[["y","있음"],["n","없음"]]),"고백, 그 대답, 털어놓음, 크게 어긋나거나 풀림")}
   ${field("작별",radios(id,"parted",[["y","오늘 끝남"],["n","이어짐"]]))}
  </div>`)}).join(""):`<p class="empty">라벨링할 턴이 없습니다.</p>`);
}
function renderCheck(){
 const Q={event:["사건이 대화에 드러났나","이 턴이나 다음 턴에 캐릭터가 받거나, 대화가 그 일 때문에 달라짐"],
  payoff:["떡밥 회수가 장면을 바꿨나","앞서 나온 것이 있었기 때문에 이 장면에서 다른 일이나 말이 나옴"],
  bond:["관계 기억이 맞고 이후 대사와 어긋나지 않나","누가 무엇을 말했는지 맞는지, 뒤의 대사가 새 관계와 맞는지"],
  today:["오늘 요약이 맞나","고백이나 털어놓은 사정이 빠짐 없이 들어가고, 누가 했는지 바뀌지 않았는지"]};
 return `<p class="sum">각 항목은 로그에 기록된 일입니다. 맞으면 예, 틀리면 아니오를 고르고 이유를 적어 주세요.</p>`+
 (DATA.checks.length?DATA.checks.map(c=>{const id="chk-"+c.id,[q,h]=Q[c.kind];let body="";
  if(c.kind==="event"||c.kind==="payoff")body=`${c.kind==="payoff"&&c.planted?`<div class="ref"><b>T${c.planted.turn}에 뿌려짐 (${c.gap}턴 전)</b><span>“${esc(c.planted.quote)}”</span></div>`:""}<div class="fact">${esc(c.text)}</div><div class="talk">${pair({turn:c.turn,u:c.u,c:c.c})}${c.next?pair(c.next):""}</div>`;
  if(c.kind==="bond")body=`<div class="split"><div><h3>전</h3><p>${esc(c.before||"(없음)")}</p></div><div><h3>후</h3><p>${esc(c.after)}</p></div></div><div class="talk">${c.later.map(t=>pair(t,true)).join("")}</div>`;
  if(c.kind==="today")body=`<div class="split"><div><h3>전</h3><p>${esc(c.before||"(없음)")}</p></div><div><h3>후</h3><p>${esc(c.after)}</p></div></div>`;
  return card(id,`<h2>${KIND[c.kind]}</h2><span class="tag">${esc(c.run)} · T${c.turn}</span>`,body+`<div class="fields">${field(q,radios(id,"ok",[["y","예"],["n","아니오"],["u","모르겠다"]]),h)}</div>${field("이유",note(id))}`)}).join(""):`<p class="empty">검수할 항목이 없습니다.</p>`);
}
function render(){
 renderTabs();
 const v=viewName();
 $("view").innerHTML=v==="compare"?renderCompare():v==="label"?renderLabel():renderCheck();
}
const timers={};
async function save(id){
 if(!db||!canSave)return;
 try{await db.doc("answers/"+id).set({...answers[id],at:new Date().toISOString()});setStatus("저장했습니다.",true)}
 catch(e){if(e&&e.code==="invalid_argument"){canSave=false;setStatus("이 보기에서는 저장할 수 없습니다. 입력은 이 화면에만 남습니다.")}else setStatus("저장하지 못했습니다. 잠시 뒤 다시 입력하면 저장됩니다.")}
}
function setStatus(text,ok){const s=$("status");s.textContent=text;s.classList.toggle("ok",!!ok)}
function mark(id){const el=document.querySelector(`[data-card="${id}"]`);if(!el)return;el.classList.toggle("saved",done(id));el.querySelector(".badge").textContent=done(id)?"저장됨":"미입력";renderTabs()}
document.addEventListener("change",e=>{
 const t=e.target,id=t.dataset.id,key=t.dataset.key;if(!id)return;
 const a=answers[id]={...(answers[id]||{})};
 if(t.dataset.multi){const set=new Set(a[key]||[]);t.checked?set.add(t.value):set.delete(t.value);a[key]=[...set]}
 else a[key]=t.value;
 mark(id);clearTimeout(timers[id]);timers[id]=setTimeout(()=>save(id),t.tagName==="TEXTAREA"?0:150);
});
document.addEventListener("input",e=>{const t=e.target;if(t.tagName!=="TEXTAREA"||!t.dataset.id)return;const id=t.dataset.id;answers[id]={...(answers[id]||{}),[t.dataset.key]:t.value};mark(id);clearTimeout(timers[id]);timers[id]=setTimeout(()=>save(id),900)});
window.addEventListener("hashchange",render);
render();
(async()=>{
 db=await window.claude?.use?.("db");
 if(!db){setStatus("저장소를 쓸 수 없는 보기입니다. 입력은 이 화면에만 남습니다.");return}
 canSave=true;
 const timer=setTimeout(()=>setStatus("저장소 응답이 늦습니다. 입력은 연결되면 저장됩니다."),10000);
 db.collection("answers").onSnapshot(snap=>{
  if(!snap.metadata.fromCache){clearTimeout(timer);setStatus("저장소에 연결했습니다. 입력하면 바로 저장됩니다.",true)}
  let changed=false;
  for(const ch of snap.docChanges()){if(ch.doc.metadata.hasPendingWrites)continue;const {at,...rest}=ch.doc.data()||{};if(ch.type==="removed")delete answers[ch.doc.id];else answers[ch.doc.id]=rest;changed=true}
  if(changed&&!document.activeElement?.matches?.("textarea"))render();else if(changed)renderTabs();
 },err=>{clearTimeout(timer);setStatus("저장소 연결이 끊겼습니다. 페이지를 다시 열어 주세요.")});
})();
</script>
