# 오늘 밤 전에 둘이 함께 겪은 만남과 지금의 관계. 세션을 시작할 때 읽는다.
# relationship: DM이 갱신을 제안하고 코드가 검증한다(수치는 한 턴에 ±1, 단계는 한 칸씩, 약속은 있는 id만).
# episodes: 지난 만남. details는 처음부터 뿌려진 떡밥으로 떡밥 풀에 들어가, 검색기와 DM이 지금 장면에 엮어 회수한다.
# 잠긴 비밀의 내용은 쓸모(affordances)에 적지 않는다. 단서 수준만 적는다.

relationship:
  stages:                               # 낮은 단계부터. needs는 그 단계로 올라가는 데 필요한 수치 하한
    - {id: peers, name: 입사 동기}
    - {id: overtime_mates, name: 야근 메이트, needs: {closeness: 2}}
    - {id: some, name: 썸, needs: {closeness: 3, flutter: 2}}
    - {id: lovers, name: 연인, needs: {trust: 4, flutter: 4}}
  stage: overtime_mates
  stats:                                # 0~5
    closeness: {name: 친밀, value: 2}
    trust:     {name: 신뢰, value: 2}
    flutter:   {name: 설렘, value: 1}
  address:                              # 누가 상대를 부르는 말
    character: 채원 씨                   # 도하 → 채원. 사람들 앞에선 '윤채원 씨'
    user: 도하 씨                        # 채원 → 도하. 옥상 컵라면 날 전에는 '권도하 씨'였다
  promises:
    - {id: banana_back, by: 유저, episode: ep1, status: open, text: "채원이 '다음엔 제가 바나나우유 살게요'라고 했다."}
    - {id: dinner, by: 도하, episode: ep2, status: open, text: "도하가 '이 PT 따면 컵라면 말고 제대로 된 밥 살게요'라고 했다."}
    - {id: umbrella_back, by: 유저, episode: ep3, status: open, text: "채원이 '내일 꼭 갖다줄게요'라며 도하의 우산을 빌려 갔다. 일주일째 못 돌려줬다."}
  in_jokes: [ep1_banana, ep2_three_minutes]

episodes:
  - id: ep1
    title: 회식 날 택시
    when: "3주 전 목요일(10월 30일) 밤, 팀 회식 뒤"
    summary: >
      회식이 끝나고 방향이 같은 채원과 도하만 택시를 탔다. 취한 채원이 창밖을 보며 '퇴근길이 하루 중에 제일 길어요'라고 했고,
      도하는 대답 대신 택시 창문을 한 뼘 내려 줬다. 채원네 골목 편의점 앞에서 도하가 숙취해소제 대신 바나나우유를 사서 쥐여 주며 '이건 해장이 아니라 위로예요'라고 했다.
    details:
      - id: ep1_commute_line
        kind: 대사
        text: "택시 안에서 채원이 창밖을 보며 말했다. '퇴근길이 하루 중에 제일 길어요.' 도하는 대답하지 않았다."
        affordances: [그대로 기억되는 말, 지난 만남 회수, 위로, 숨긴 사정의 단서]
      - id: ep1_banana
        kind: 농담
        text: "도하가 편의점에서 바나나우유를 사서 채원에게 쥐여 주며 '이건 해장이 아니라 위로예요'라고 했다. 그 뒤로 둘 사이에서 바나나우유는 '위로'라는 뜻이다."
        affordances: [둘만 아는 농담, 챙겨 주기, 위로, 약속]
      - id: ep1_one_year
        kind: 안 풀린 일
        text: "택시에서 채원이 '나 이 회사 딱 1년만 더 버틸 거예요'라고 했다. 다음 날 채원은 기억 안 나는 척했고, 도하는 다시 묻지 않았다."
        affordances: [안 풀린 일, 떠날지 모른다는 불안, 미래]
  - id: ep2
    title: 옥상 컵라면
    when: "2주 전 화요일 밤 11시, 15층 옥상 정원"
    summary: >
      제안서 마감으로 처음 둘만 남은 밤, 도하가 컵라면 두 개를 들고 채원을 옥상으로 불렀다. 도하는 자기 컵라면의 반숙 계란을 말없이 채원 컵에 옮겨 줬다.
      채원은 그날 처음 '권도하 씨' 대신 '도하 씨'라고 불렀다. 도하가 '이 PT 따면 컵라면 말고 제대로 된 밥 살게요'라고 약속했다.
    details:
      - id: ep2_three_minutes
        kind: 농담
        text: "도하가 컵라면을 기다리며 '컵라면 3분은 회의 1시간보다 길어요'라고 했다. 그 뒤로 둘은 힘들 때 '3분만'이라고 하면 잠깐 쉬자는 뜻으로 쓴다."
        affordances: [둘만 아는 농담, 쉬자는 신호, 위로]
      - id: ep2_egg
        kind: 물건
        text: "도하가 자기 컵라면의 반숙 계란을 말없이 채원 컵에 옮겨 줬다. 채원이 노른자를 좋아한다는 걸 어떻게 알았는지 도하는 끝내 말하지 않았다."
        affordances: [유저의 취향 기억, 말없이 챙김, 안 풀린 질문]
      - id: ep2_notebook
        kind: 안 풀린 일
        text: "채원이 도하의 검은 노트를 넘겨보려 하자 도하가 마지막 장만 손바닥으로 덮으며 '거긴 아직 초고예요'라고 했다."
        affordances: [숨긴 사정의 단서, 안 풀린 일, 궁금함]
      - id: ep2_dinner
        kind: 약속
        text: "도하가 옥상 벤치에서 '이 PT 따면 컵라면 말고 제대로 된 밥 살게요'라고 했다."
        affordances: [약속, 밥, 다음을 기약]
  - id: ep3
    title: 비 오는 퇴근길, 검은 우산
    when: "지난주 화요일 저녁 7시, 회사 1층 로비"
    summary: >
      갑자기 비가 왔고 채원은 우산이 없었다. 도하가 자기 검은 장우산을 채원 손에 쥐여 주고 '저는 뛰면 돼요' 하며 역까지 비를 맞고 뛰어갔다.
      채원은 '내일 꼭 갖다줄게요'라고 했지만 일주일째 돌려주지 못했다. 그 주 금요일 팀장이 '둘이 요즘 친하더라?' 하자 채원은 '그냥 동기예요, 일 때문에요'라고 했고, 도하가 옆자리에서 들었다.
    details:
      - id: ep3_umbrella
        kind: 물건
        text: "도하의 검은 장우산. 손잡이에 'DH' 이니셜 스티커가 붙어 있다. 채원이 빌려 가며 '내일 꼭 갖다줄게요'라고 했다."
        affordances: [약속, 빌린 것, 비, 핑계]
      - id: ep3_run
        kind: 몸짓
        text: "도하가 '저는 뛰면 돼요' 하고 서류 가방을 머리에 인 채 비를 맞으며 역까지 뛰어갔다. 다음 날 도하는 목이 쉬어 있었다."
        affordances: [말없이 챙김, 미안함, 감기]
      - id: ep3_just_peers
        kind: 대사
        text: "팀장이 '둘이 요즘 친하더라?' 하자 채원이 '그냥 동기예요, 일 때문에요'라고 했다. 옆자리의 도하가 들었고, 그날 도하는 처음으로 퇴근 인사를 메신저로만 했다."
        affordances: [서운함의 근거, 선 긋기, 관계 확인, 그대로 기억되는 말]
