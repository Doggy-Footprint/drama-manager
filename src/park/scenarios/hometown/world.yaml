# 솔뫼동, 12월 첫째 주 토요일 밤. 재개발 이주 마감일이라 22시에 동네 전기가 끊기고 자정에 철거 펜스가 쳐진다.
# 한결은 내일 아침 7시 30분 공항버스로 도쿄에 간다. 시각은 "HH:MM". 사건과 기억 문장에는 누가 했는지(한결/유저)를 적는다.

scenario:
  title: 솔뫼동의 마지막 밤
  order: 1                              # 시작 화면 맨 위(면접 데모용)
  place: 솔뫼동 골목                    # "이 ○○에 새로 생긴 장소"처럼 쓰인다
  setting: "12월 첫째 주 토요일 밤, 재개발로 사라지는 솔뫼동의 마지막 밤이다. 소꿉친구 한결과 유저(지안)가 문 닫은 달빛제과 앞에서 만나 동네를 돈다. 밤 10시에 동네 전기가 끊기고, 한결은 내일 아침 도쿄로 떠난다."
  opening: "(약속 시각 20:00보다 25분 늦게, 20:25에 셔터 내린 달빛제과 앞으로 뛰어온다)"
  appointment: "20:00에 달빛제과 앞에서 만나기로 했다"
  countdown: {at: "22:00", label: 단전}
  season: 12월 첫 주 밤
  input_hint: "(숨을 고르며) 미안미안, 많이 기다렸지?"
  intro:
    - "12월 첫째 주 토요일 밤, 재개발로 사라지는 솔뫼동"
    - "약속은 20:00, 달빛제과 앞. 너는 25분 늦었다. 밤 10시에 동네 전기가 끊기고, 그는 내일 아침 도쿄로 떠난다."
    - "열세 살의 그가 타임캡슐에 무엇을 넣었는지, 너는 모른다."
  arc: |
    - 20:25~21:00 setup: 늦게 온 지안, 셔터 내린 달빛제과, 누나 몫으로 남긴 마지막 밤식빵, 문방구. 긴장 2~3. 한결이 지안의 사소한 취향을 다 기억한다는 게 보이게 하고, 내일 떠난다는 것과 '동생' 취급을 깐다. setup 동안 서운함은 2를 넘기지 않는다(말투로만 샌다).
    - 21:00~21:40 complication: 송별 잔치에서 동네 사람들이 둘을 '남매'라고 놀리고, 지안의 휴대폰에 소개팅 얘기가 뜨고, 문방구 할머니가 4년 전 일을 흘린다(할머니의 말은 단서일 뿐, 한결은 웃어넘긴다). 긴장 3~5. 한결의 서운함은 비꼬는 존댓말과 단답으로만 샌다. 서운함이 터지는 것은 소개팅 메시지처럼 결정적인 일이 겹친 뒤다.
    - 21:40~22:00: 엄마 전화, 둘만 남는 곳(옥상, 옛집 계단). 쌓인 서운함이 터질 수 있다. 긴장 5~6.
    - 22:00 단전: 정점의 시작. 동네가 한꺼번에 캄캄해진다. 지안은 어둠을 무서워하고, 한결은 그걸 기억한다. 떨어져 있었다면 한결은 곧바로 전화하거나 찾아온다. 이 뒤로 한결은 지안 곁을 떠나지 않는다. 긴장 7~8.
    - 22:10~22:40 정점: 타임캡슐이 나온다(놀이터에서 파내거나 동민이 가져온다). 휴대폰 불빛, 계단 낙서, 편지. 숨겨 온 사정은 이때 쌓인 근거를 따라 연다(bus_stop은 할머니 말만으로는 열지 않고, 계단의 '첫차 06:10' 낙서를 직접 볼 때 연다. capsule_letter는 상자를 열 때). 빨간 손전등은 곧 꺼지고, 단전 뒤에는 한결이 휴대폰 손전등을 켜 둔다(phone_use photos). 그래서 배터리가 바닥난다. 긴장 8~9.
    - 22:40 이후 resolution: 첫눈, 불 꺼진 동네 너머의 불빛, 펜스 치는 경비원, 막차. 한결은 곁에 있다. 고백, 이름 부르기, 도쿄에 대한 두려움, 2년 뒤의 약속을 매듭짓는다. 긴장 5~7로 내려오며 끝낸다.

start: "20:25"
end: "23:59"                # 자정을 넘기면 시각 계산이 깨지므로 23:59에서 멈춘다
start_loc: {character: bakery, user: bakery}

locations:
  bakery:     {name: 달빛제과 앞, xy: [80, 112], desc: "셔터를 반쯤 내린 30년 된 동네 빵집. 안에는 아직 오븐 온기가 남아 있고, 뒷문 문틀에 키 재던 눈금이 있다. 충전기 꽂을 콘센트가 있지만 22시 단전 뒤엔 쓸 수 없다.", near: {rooftop: 1, stairs: 4, stationery: 3, playground: 3}}
  rooftop:    {name: 빵집 옥상, xy: [112, 34], desc: "달빛제과 2층 위 옥상. 평상과 빈 빨랫줄, 장독 몇 개. 불 꺼진 동네와 강 건너 아파트 불빛이 한눈에 보인다.", near: {bakery: 1}}
  stairs:     {name: 지안네 옛집 계단, xy: [30, 46], desc: "언덕 꼭대기 지안네 옛집으로 오르는 108계단. 대문은 빨간 철거 표시가 붙은 채 잠겨 있다. 가로등이 하나뿐이다.", near: {bakery: 4, playground: 5}}
  stationery: {name: 행운문방구, xy: [132, 168], desc: "40년 된 문방구. 할머니가 혼자 지키고, 가게 앞에 동전 뽑기 기계와 오락기가 있다. 오늘 밤까지만 연다.", near: {bakery: 3, playground: 3, square: 3}}
  playground: {name: 느티나무 놀이터, xy: [166, 96], desc: "녹슨 미끄럼틀과 그네, 가운데 큰 느티나무. 둘이 어릴 때 타임캡슐을 묻은 곳이다.", near: {bakery: 3, stairs: 5, stationery: 3, photo: 3, square: 3}}
  photo:      {name: 청춘사진관, xy: [232, 48], desc: "간판 불이 반쯤 나간 동네 사진관. 쇼윈도에 동네 사람들의 오래된 사진이 걸려 있다.", near: {playground: 3, square: 4, bus_stop: 3}}
  square:     {name: 동네 공터, xy: [224, 150], desc: "철거 펜스 앞 공터. 천막과 드럼통 모닥불, 주민들의 송별 잔치. 막걸리와 전 냄새.", near: {stationery: 3, playground: 3, photo: 4, bus_stop: 3, store: 4}}
  bus_stop:   {name: 마을버스 종점, xy: [290, 96], desc: "솔뫼동 마을버스 종점 정류장. 지안이 4년 전 첫차를 탄 곳. 낡은 벤치와 노선표.", near: {photo: 3, square: 3, store: 3}}
  store:      {name: 큰길 편의점, xy: [306, 186], desc: "재개발 구역 밖 큰길의 24시간 편의점. 단전과 상관없이 환하다. 핫팩, 보조배터리, 컵라면을 판다.", near: {square: 4, bus_stop: 3}}

# 장소별 인파. level 1 한산, 2 붐빔, 3 걷기 힘듦. 목록에 없는 시간은 1.
crowd:
  stationery: [{from: "20:25", to: "21:00", level: 2}]
  square:     [{from: "20:40", to: "21:50", level: 2}, {from: "22:10", to: "22:40", level: 3}]
  playground: [{from: "22:05", to: "22:40", level: 2}]
  bus_stop:   [{from: "23:15", to: "23:40", level: 2}]

# 코드가 분 단위로 바꾸는 수치. 시간은 거꾸로 가지 않는다. 배터리는 쓰면 줄고, 충전 중이면 charge_per_min만큼 오른다.
states:
  battery:
    owner: 한결
    start: 34              # %. 하루 종일 가게 마지막 날을 찍었다. 손전등으로 쓰면 22:30 무렵 바닥나게 맞췄다
    drain_per_min: {idle: 0.12, photos: 0.6, searching: 0.8, calling: 1.2}   # 단전 뒤 휴대폰 손전등은 photos로 친다
    charge_per_min: 1.2
  temperature:
    start: 3               # ℃. 밤이 깊을수록 떨어진다
    per_hour: -1.5

events:
  - id: blackout
    core: true
    where: [any]
    window: ["22:00", "22:20"]
    text: "밤 10시, 재개발 구역의 전기가 끊긴다. 가로등과 창문 불빛이 한꺼번에 꺼지고 동네 전체가 캄캄해진다. 멀리 공터 쪽에서 누군가 '타임캡슐 판대, 놀이터로 와!' 하고 외친다."
    tags: [절정, 어둠, 손, 마지막 밤, 타임캡슐]
