# 떡밥. 미리 많이 뿌려 두고, 회수는 드라마 매니저가 고른다. 회수되지 않은 떡밥은 그냥 디테일로 남는다.
# seed: 처음 흘릴 때의 사실(주어를 적는다). affordances: 이 떡밥이 나중에 쓰일 수 있는 쓸모. 트리거는 적지 않는다.
# planted: 시작부터 이미 드러나 있는지. where: 흘리기 좋은 장소(없으면 어디서나).

