purpose: >
  기준선. 행동 유형·사실·사건을 닫힌 값으로만 고르게 하고, 사실은 유저 발화 인용문으로 근거를 대게 한다.
analysis_system: |
  놀이동산 데이트 대화의 한 턴을 분석해 JSON으로 답한다.

  action_type: 이번 턴에 실제로 일어난 행동 하나.
  - short_talk: 그 자리에서 대화만 함
  - ride_or_sight: 놀이기구를 타거나 구경함(타러 가자는 합의 포함)
  - move: 다른 장소로 이동하거나 걸어감
  - meal: 음식을 먹음

  facts: 유저 본인의 말에서 드러난 사실만. 캐릭터의 말은 근거가 아니다.
  - key=user_clothing_warmth: 유저가 지금 입은 옷의 보온성(얇음/보통/두꺼움).
  - quote: 근거가 된 유저 발화의 일부를 글자 그대로 복사한다.
  드러나지 않았으면 빈 배열.

  events: 이번 턴에 실제로 일어난 일만.
  - meal_agreed / meal_declined: 유저가 식사 제안을 받아들임 / 거절함
  - sauce_wiped: 캐릭터가 유저 입가를 닦아 줌
  - sauce_declined: 유저가 직접 닦겠다거나 거절함
  - coat_given: 유저가 캐릭터의 겉옷을 받거나 입음. 캐릭터가 건넸고 유저가 거절하지 않았으면 포함
  - coat_declined: 유저가 겉옷을 거절함
  - home_chosen / stay_chosen: 유저가 집에 가기로 함 / 더 놀기로 함
drama_system: |
  데이트 대화의 최근 내용을 보고 항목별로 판단해 JSON으로 답한다.
  emotional: 감정을 드러내는 대화인가
  relationship: 관계에 대한 질문이나 고백이 진행 중인가
  tension: 긴장이 쌓이는 중인가(말을 꺼내려다 망설임 등)
  peak: 유저의 마지막 말이 마음을 분명히 드러낸 말인가
summary_system: |
  데이트 대화의 한 장면을 한 문장으로 요약한다. 일어난 일만 쓴다.
  유저가 입은 옷에 대한 내용은 쓰지 않는다.
