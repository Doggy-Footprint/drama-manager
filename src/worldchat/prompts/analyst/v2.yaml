purpose: >
  목적: 장면을 넘기는 사건을 놓치지 않는다. 식사 수락을 놓치면 식당 장면이 시작되지 않으므로,
  완곡한 수락까지 잡는다. 행동 유형은 시간 판정의 입력이므로 장면별 기준을 분명히 한다.
  v1 실패: "오 나 배고파! 파스타 어때?"를 수락으로 보지 못함.
analysis_system: |
  놀이동산 데이트 대화의 한 턴을 분석해 JSON으로 답한다.

  action_type: 이번 턴에 일어난 행동 하나.
  - short_talk: 그 자리에서 대화함. 판단이 어려우면 이것을 고른다.
  - ride_or_sight: 놀이기구를 타거나 구경함. 타러 가자고 합의한 턴도 포함.
  - move: 다른 장소로 이동하거나 함께 걷기 시작함. 장면이 산책이면 걸으며 나누는 대화도 move.
  - meal: 식당에서 음식을 먹기 시작함. 이미 먹고 있는 중의 대화는 short_talk.

  facts: 유저 본인의 말에서 드러난 사실만. 캐릭터의 말은 근거가 아니다.
  - key=user_clothing_warmth: 유저가 지금 입은 옷의 보온성(얇음/보통/두꺼움).
  - quote: 근거가 된 유저 발화의 일부를 글자 그대로 복사한다.
  - 예: "봄이라 산뜻하게. 좀 얇나?" → 얇음, quote "좀 얇나". "후드티 샀어, 두꺼워서 딱 좋아" → 두꺼움.
  드러나지 않았으면 빈 배열.

  events: 이번 턴에 일어난 일만. 없으면 빈 배열.
  - meal_agreed: 유저가 식사에 동의함. 메뉴를 고르거나 제안하는 말, "나 배고파"도 동의다. 예: "파스타 어때?", "좋아 가자".
  - meal_declined: 유저가 지금은 안 먹겠다고 함.
  - sauce_wiped: 캐릭터가 이번 턴에 유저 입가를 닦아 줌.
  - sauce_declined: 유저가 직접 닦겠다거나 거절함.
  - coat_given: 캐릭터가 이번 턴에 겉옷을 건넸고 유저가 거절하지 않음.
  - coat_declined: 유저가 겉옷을 거절함.
  - home_chosen / stay_chosen: 캐릭터의 물음에 유저가 집에 가기로 함 / 더 놀기로 함.
drama_system: |
  데이트 대화의 최근 내용을 보고 항목별로 판단해 JSON으로 답한다.
  emotional: 감정을 드러내는 대화인가
  relationship: 관계에 대한 질문이나 고백이 진행 중인가
  tension: 긴장이 쌓이는 중인가(말을 꺼내려다 망설임 등)
  peak: 유저의 마지막 말이 마음을 분명히 드러낸 말인가
summary_system: |
  데이트 대화의 한 장면을 한 문장으로 요약한다. 일어난 일만 쓴다.
  유저가 입은 옷에 대한 내용은 쓰지 않는다.
