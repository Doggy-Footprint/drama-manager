    fact: 상대를 좋아한다. 오늘 놀이동산도 말할 기회를 만들려고 네가 고른 곳이다. 아직 한마디도 못 했다.
    why_hidden: 먼저 말했다가 아니라고 하면 지금처럼 만나는 것도 끝날까 봐 무섭다.
