# director_v7 scene_draft 초안. 사람 검수 전이다.
intro: 오늘 놀이동산에는 정문 광장, 회전목마 구역, 롤러코스터 대기줄, 호숫가 산책로가 있고 정문 광장에서 입장하면 모든 곳을 걸어서 갈 수 있다. 저녁 여덟 시에는 호수 위에서 불꽃놀이가 시작되어 산책로 난간이 가장 붐빈다.
places:
- 정문 광장
- 회전목마 구역
- 롤러코스터 대기줄
- 호숫가 산책로
checkpoints:
- id: rain
  inject: 갑자기 굵은 빗방울이 떨어지기 시작하고 주변 사람들이 우산을 펴기 시작한다.
  deferrable: true
  deadline: '19:30'
  trigger:
    clock_gte: '18:30'
- id: coaster_closed
  inject: 롤러코스터 대기줄이 정비 때문에 통제되고 안내원이 돌아가라고 외친다.
  deferrable: true
  deadline: '19:00'
  trigger:
    state_eq:
      place: 롤러코스터 대기줄
- id: balloon
  inject: 누군가 들고 있던 풍선이 줄을 놓쳐 하늘 높이 날아간다.
  deferrable: true
  deadline: '20:00'
  trigger:
    turns_in_frame_gte: 3
- id: fireworks
  inject: 호수 쪽에서 불꽃놀이를 알리는 방송이 나오고 사람들이 일제히 산책로 난간으로 몰린다.
  deferrable: false
  deadline: null
  trigger:
    clock_gte: '20:00'
- id: carousel_stop
  inject: 회전목마 음악이 갑자기 멈추고 직원이 점검 중이라는 안내를 한다.
  deferrable: true
  deadline: '19:45'
  trigger:
    all:
    - state_eq:
        place: 회전목마 구역
    - turns_in_frame_gte: 2
foreshadows:
- id: ticket_bench
  detail: 정문 광장 분수대 옆 벤치에 누군가 두고 간 영화 티켓 두 장이 놓여 있다.
  shown_when:
    clock_gte: '17:45'
  trigger:
    all:
    - turns_in_frame_gte: 4
    - clock_gte: '19:30'
  consequence: 방송이 티켓 주인을 찾고, 같은 영화의 상영 시간이 적힌 쪽지가 벤치 아래에서 나온다.
- id: ribbon_tree
  detail: 호숫가 산책로 입구의 오래된 나무에 색색의 리본이 여러 개 묶여 있다.
  shown_when:
    state_eq:
      place: 호숫가 산책로
  trigger:
    clock_gte: '20:30'
  consequence: 리본 주인들이 나무 아래로 모여 불꽃이 꺼진 뒤에도 자리를 뜨지 않는다.
- id: keyring_post
  detail: 회전목마 기둥 위에 작은 열쇠고리 하나가 걸려 있다.
  shown_when:
    state_eq:
      place: 회전목마 구역
  trigger:
    after: rain
  consequence: 직원이 열쇠고리 주인을 찾는 방송을 하고 회전목마 음악이 다시 켜진다.
details:
- text: 정문 광장의 솜사탕 기계가 쉴 새 없이 돌아가고 있다.
  shown_when:
    state_eq:
      place: 정문 광장
- text: 회전목마의 백마 한 마리는 페인트가 벗겨져 있다.
  shown_when:
    state_eq:
      place: 회전목마 구역
- text: 롤러코스터가 머리 위를 지날 때마다 대기줄에서 비명이 터져 나온다.
  shown_when:
    state_eq:
      place: 롤러코스터 대기줄
- text: 호수에는 오리 떼가 떠 있지만 아무도 먹이를 주지 않는다.
  shown_when:
    state_eq:
      place: 호숫가 산책로
- text: 매점 앞 쓰레기통에 아이스크림 막대가 수북하게 쌓여 있다.
  shown_when:
    clock_gte: '17:30'
