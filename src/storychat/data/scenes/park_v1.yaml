# 검수 반영본. 사건과 결과는 핵심만 적고, 일어나는 순간에 stage가 상황에 맞게 고쳐 전한다.
# 문장 속 {name}은 카드의 인물 이름으로 바뀐다. keep의 낱말이 고친 문장에 없으면 코드가 다시 쓰게 하고, 그래도 없으면 핵심 문장을 그대로 쓴다. 원본 LLM 초안은 park_v1.draft.yaml이다.
intro: 오늘 저녁 놀이동산에 왔다. 갈 수 있는 곳은 놀이동산 정문, 회전목마 앞, 매점 거리, 대관람차 앞이다. 밤 여덟 시에 불꽃놀이가 있고 아홉 시쯤 폐장한다.
places:
- 놀이동산 정문
- 회전목마 앞
- 매점 거리
- 대관람차 앞
checkpoints:
- id: snack_smell
  inject: 매점 거리에서 먹을 것 냄새가 난다.
  keep: [냄새]
  trigger: {state_eq: {hunger: 배고픔}}
- id: work_call
  inject: "{name}에게 회사에서 전화가 온다."
  keep: [회사]
  deferrable: true
  deadline: '19:20'
  trigger: {clock_gte: '18:40'}
- id: evening_cold
  inject: 해가 지고 바람이 차가워진다.
  keep: [바람]
  trigger: {clock_gte: '19:00'}
- id: wheel_last_call
  inject: 대관람차 탑승이 불꽃놀이 전에 마감된다는 안내가 나온다.
  keep: [대관람차, 마감]
  trigger: {clock_gte: '19:20'}
- id: fireworks
  inject: 불꽃놀이가 시작된다.
  keep: [불꽃]
  deferrable: true
  deadline: '20:30'
  trigger: {clock_gte: '20:00'}
- id: closing
  inject: 곧 폐장한다는 안내가 나온다.
  keep: [폐장]
  trigger: {clock_gte: '21:00'}
foreshadows:
- id: lost_rabbit
  detail: 정문 안내판 아래 벤치에 주인 없는 토끼 인형이 앉아 있다.
  shown_when: {state_eq: {place: 놀이동산 정문}}
  trigger: {clock_gte: '19:10'}
  consequence: 아이 하나가 울면서 잃어버린 토끼 인형을 찾고 있다.
  keep: [토끼 인형, 찾]
- id: last_skewer
  detail: 매점 거리 끝 어묵 포장마차에 재료가 떨어지면 일찍 닫는다는 쪽지가 붙어 있다.
  shown_when: {state_eq: {place: 매점 거리}}
  trigger: {all: [{state_eq: {place: 매점 거리}}, {clock_gte: '19:30'}]}
  consequence: 어묵 포장마차에 마지막 한 꼬치만 남는다.
  keep: [어묵, 마지막]
- id: taped_gondola
  detail: 대관람차 칸 하나의 문에 노란 테이프가 붙어 있고 직원이 그 칸을 들여다보고 있다.
  shown_when: {clock_gte: '18:10'}
  trigger: {clock_gte: '19:40'}
  consequence: 대관람차 마지막 바퀴에 두 사람 자리만 남는다.
  keep: [마지막, 두 사람]
details:
- text: 정문 옆 솜사탕 기계가 쉴 새 없이 돌아가고 있다.
  shown_when: {state_eq: {place: 놀이동산 정문}}
- text: 회전목마의 백마 한 마리는 페인트가 벗겨져 있다.
  shown_when: {state_eq: {place: 회전목마 앞}}
- text: 매점 앞 쓰레기통에 아이스크림 막대가 수북하게 쌓여 있다.
  shown_when: {state_eq: {place: 매점 거리}}
- text: 대관람차 줄 앞에서 직원이 번호표를 나눠 주고 있다.
  shown_when: {state_eq: {place: 대관람차 앞}}
- text: 풍선 파는 사람이 하나 남은 풍선을 손목에 감은 채 자리를 정리한다.
  shown_when: {clock_gte: '19:30'}
