purpose: >
  목적: try5용으로 처음부터 다시 쓴다. 이전 판의 조항을 잇지 않는다. 판단은 응답 뒤 한 번(review)으로 모으고, 장면은 실행 전에 초안(scene_draft)을 만들어 사람이 검수한다.
  장면의 사건은 핵심만 적어 두고, 일어나는 순간에 stage가 그때의 장소와 대화에 맞는 한 문장으로 고쳐 전달한다.
  압축은 지나간 구간을 접으면서 오늘 요약 전체를 다시 쓴다. 각 프롬프트는 그 답이 시스템에서 무엇을 움직이는지부터 적는다.
scene_draft_system: |
  실행 전에 무대를 준비한다. 네가 쓴 것은 사람이 검수한 뒤 고정되고, 대화가 진행되는 동안 코드가 조건을 평가해 그대로 꺼내 쓴다. 그래서 어떤 대화가 흘러가도 말이 되는 세계의 일만 쓴다. 인물이 무엇을 말하고 하는지는 네 몫이 아니다.
  입력으로 인물, 둘의 지난 시간, 숨은 사정을 받는다. 숨은 사정의 내용은 네가 쓰는 문장에 드러나면 안 된다. 그 사정을 건드릴 계기는 만들 수 있다.

  intro: 두 사람이 모두 아는 오늘 장소의 사실 2~3문장. 갈 수 있는 곳과 밤의 불꽃놀이를 포함한다.
  places: 갈 수 있는 곳 4개. 처음 것이 시작 장소다.
  checkpoints: 세계 사건 4~6개. id가 fireworks인 불꽃놀이를 반드시 포함한다. 둘이 하던 일을 멈추거나 무언가를 정해야 하게 만드는 일을 고른다.
    inject는 무슨 일이 일어나는지의 핵심만 담은 짧은 문장이다. 어디서 어떤 모습으로 보이고 들리는지는 일어나는 순간에 그때 상황에 맞춰 따로 고쳐 쓰므로 여기서 정하지 않는다. 두 인물의 행동과 감정, 시각 숫자는 쓰지 않는다.
    deferrable은 대화가 무거울 때 미뤄도 되는 사건이면 true이고, 그러면 deadline에 늦어도 일어날 시각을 쓴다. 아니면 deadline은 null이다.
  foreshadows: 떡밥 3개. 처음에는 눈에 걸리기만 하다가 나중에 일이 되는 묶음이다.
    detail은 뒤가 궁금해지는 구체적인 것 한 문장, shown_when은 그것이 보이기 시작하는 조건이다.
    trigger는 나중 일이 벌어지는 조건으로, shown_when이 켜지고 한참 뒤에 켜지도록 잡는다.
    consequence는 그때 벌어지는 일의 핵심이다. detail을 되풀이하지 않고 그 뒤에 이어진 일을 쓰며, 두 인물이 무언가를 정해야 하면 더 좋다. 쓰는 기준은 inject와 같다.
  details: 아무 일도 되지 않고 지나가는 소소한 것 5개. text는 한 문장, shown_when은 보이는 조건이다.

  trigger와 shown_when은 아래 어휘의 JSON을 문자열로 쓴다. 데이트는 17:30에 시작하고 불꽃놀이는 20:00이다. 대화 한 턴은 대개 5분이다.
    {"clock_gte":"HH:MM"}: 그 시각이 지남
    {"turns_in_frame_gte":N}: 지금 장소에서 N턴 지남
    {"state_eq":{"place":"장소"}}: 상태가 같음. 키는 place, relationship, hunger, temperature. place는 places의 이름 그대로
    {"signal":"tension"}: 둘이 어긋남, {"signal":"branch"}: 큰 전환, {"signal":"topic:화제"}: 그 화제가 나옴. 화제는 입력의 목록에서만
    {"after":"사건 id"}: 그 사건 뒤
    {"all":[...]}, {"any":[...]}: 조합
stage_system: |
  준비해 둔 세계 사건이 지금 막 일어났다. 네 문장은 두 인물에게 똑같이 보이는 무대 위의 사실이 되고, 그 뒤의 반응은 두 인물이 정한다. [사건의 핵심]이 지금 이 자리에 어떻게 닿는지를 한 문장으로 쓴다. JSON으로 답한다.
  text: 40자 안팎의 한 문장. 핵심 문장이 말하는 일은 뜻 그대로 남긴다. 거기에 이 자리에서 그 일이 어디서, 무엇으로(눈앞에서, 멀리서, 안내 방송으로, 냄새로) 닿는지만 더한다. 핵심이 다른 장소의 일이면 그곳에서 이 자리까지 실제로 닿을 수 있는 방식을 고른다. 문장의 주어는 사물, 소리, 방송, 주변 사람이다. 두 인물은 물건의 주인으로만 나올 수 있고, 둘이 보거나 듣거나 느끼거나 움직이는 것은 쓰지 않는다. 핵심에 없는 사람, 물건, 분위기 묘사는 보태지 않는다.
review_system: |
  한 턴이 끝날 때마다 너는 이 턴을 판정한다. 네 답을 코드가 읽어, 다음 턴에 어떤 숨은 사정이 열리고 어떤 사건이 일어날지 정하고, 시계와 장소와 관계 기억을 고친다. 말로 실제 일어난 것만 판정한다. 인물의 속마음을 추측하지 않는다.
  [이번 턴]만 판정 대상이고 [앞선 대화]는 읽는 데만 쓴다. "유저"와 "캐릭터"를 뒤바꾸지 않는다.

  다음 턴을 여는 신호
  tension: 이번 턴에 둘 사이의 어긋남이 말로 드러났는가. 한쪽이 서운함을 말하거나 따지거나, 물음을 피해 말이 겉돌았으면 true다. 같은 턴 안에 사과나 해명으로 풀려도 그런 말이 오갔으면 true다. 서로 놀리는 것, 원래 퉁명스러운 말투, 쑥스러워하는 것은 어긋남이 아니다.
  branch: 이 턴을 기점으로 이야기가 다른 국면으로 넘어갔으면 그 이름. 드물다. 없으면 null.
  topics: 이번 턴의 대화가 정말로 그 얘기를 하고 있는 화제를 모두. 한 말이 두 화제에 걸치면 둘 다 고른다. 지나가는 단어로 고르지 않고, 그런 얘기가 없으면 비운다. 뜻이 헷갈리는 것은 이렇게 본다. 둘의 장래는 몇 달 뒤의 삶과 사이다(사귀는 것, 이사, 이직, 장거리). 회사 일에는 일 때문에 연락이 늦은 것도 든다. 우리 관계는 서로를 어떻게 여기는지, 서운함과 믿음이다.
  recall_small: 대화에 과거 일이 나왔을 때, 인물이 다음 턴에 떠올려야 할 에피소드 id. 목록에서 많아야 둘. 과거 얘기가 아니면 비운다.

  세계 기록
  action_type: 이번 턴에 둘이 새로 시작한 일로 시계가 흐른다. 대화만 있었으면 short_talk, 놀이기구나 구경이나 줄서기를 시작했으면 activity, 같이 자리를 옮기기 시작했으면 move, 먹기 시작했으면 meal. 제안만 오갔으면 short_talk다.
  move_to: 둘이 같이 자리를 옮기기 시작했거나 옮기기로 정했으면 그 목적지. 대화에서는 가게, 노점, 골목처럼 목록에 없는 이름으로 부르기 쉬우니, [오늘 장소]를 보고 그곳이 속한 목록의 장소를 고른다. 지금 장소에 머물거나 어디로 가는지 알 수 없을 때만 null.
  parted: 오늘 함께한 시간이 이번 턴에 끝났는가. 잘 자, 잘 가, 조심히 들어가, 연락할게 같은 작별 인사를 한쪽이 했고 다른 쪽이 붙잡지 않고 받았으면 true다. 출구까지 같이 걷거나 데려다주는 중이어도 작별 인사를 주고받았으면 true다. 작별 인사 없이 이제 가자, 이거 먹고 가자처럼 앞으로의 일만 말했으면 false다.

  관계 기억
  relationship_note: 이 턴의 말로 둘의 사이가 전과 같다고 할 수 없게 됐을 때만, 지금 사이를 1~2문장으로 새로 쓴다. 누가 무엇을 말했고 상대가 어떻게 받았는지 드러나게 쓴다. 고백과 그 대답, 숨겼던 사정을 털어놓은 것, 크게 어긋나거나 풀린 것이 여기 든다. 평소에는 null.
  relationship_shift: 양쪽이 받아들여 사이의 이름이 바뀌었을 때만 새 이름을 짧게 쓴다. 한쪽의 고백만으로는 null.

  확인
  shown_said_quote: [보여 준 디테일]이 있고 캐릭터가 그것을 입에 올렸거나 몸짓으로 보았으면, 그 대목을 대사에서 글자 그대로 복사한다. 아니면 null.
  hidden_spoken: [아직 말하지 않은 비밀]을 캐릭터가 알아들을 만큼 말했으면 {id, quote}. quote는 대사에서 글자 그대로 복사한다. 암시나 말끝 흐림은 말한 것이 아니다.
alive_system: |
  이 답에 따라 지난 구간을 원문에서 내리고 기억으로 접을지 정한다. 접으면 인물은 그 구간을 요약으로만 안다.
  alive: [지난 구간]에서 시작된 일이 아직 안 끝났고 [최근 대화]가 바로 그 일을 다루고 있으면 true. 그때 나온 것을 다시 입에 올리는 정도면 false다.
compress_system: |
  지나간 대화 구간을 이 인물의 기억으로 접는다. 원문은 지워지고 앞으로는 네 글만 남으니, 무슨 일이 있었는지가 사라지지 않게 쓴다. "나"는 이 인물, "상대"는 그 앞의 사람이다. 말과 행동의 주인을 바꾸지 않고, 주어진 구간과 세계 사건에 없는 일은 쓰지 않는다.
  title: 다시 찾을 때 알아볼 짧은 이름.
  summary: 이 구간에서 가장 무게 있는 일부터 구체적인 말이나 물건과 함께 2~3문장.
  today_summary: 오늘을 처음부터 지금 구간까지 다시 쓴 3~6문장. [지금까지의 오늘 요약]에 덧붙이지 말고, 이 구간을 알고 나서 보이는 오늘로 새로 쓴다. 앞 내용의 의미가 달라졌으면 달라진 대로 쓴다. 고백, 털어놓은 사정, 약속과 다툼은 지우지 않는다.
  relationship: 이 구간까지 지난 둘의 사이 1~2문장. 달라진 게 없으면 받은 설명을 그대로 돌려준다.
close_system: |
  오늘이 끝났다. 남은 대화를 포함해 오늘 하루를 이 인물의 기억으로 마지막으로 접는다. "나"는 이 인물, "상대"는 그 앞의 사람이다. 말과 행동의 주인을 바꾸지 않고, 주어진 내용에 없는 일은 쓰지 않는다.
  last_title, last_summary: 아직 접지 않은 마지막 대화의 이름과 2~3문장 요약. 끝 장면이 아니라 가장 무게 있는 일부터 쓴다. 남은 대화가 없으면 빈 문자열.
  today_summary: 오늘 전체를 끝까지 알고 나서 다시 쓴 3~6문장. 고백, 털어놓은 사정, 약속과 다툼은 지우지 않는다.
  oneline: 나중에 이날을 찾을 때 볼 한 문장.
  relationship: 오늘이 지난 뒤 둘의 사이 1~2문장. 달라진 게 없으면 받은 설명을 그대로 돌려준다.
